<svg viewBox="0 0 360 220" role="img" aria-label="Indian financial regulators converge on the same controls. RBI through FREE-AI and its draft model risk guidance, and SEBI through Regulation 16C and its announced AI guidelines, expect a board-approved AI policy, a risk-tiered AI inventory, full accountability for outputs even from vendor models, a kill switch and human oversight, and telling customers when AI is involved with a way to reach a human. Higher-risk uses get tighter controls."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="168" height="50" rx="7"/><text class="lb" x="92" y="28">RBI</text><text class="sb" x="92" y="43">FREE-AI · MRM draft</text></g><g class="a " style="--d:0.1s"><rect class="bx acc" x="184" y="6" width="168" height="50" rx="7"/><text class="lb" x="268" y="28">SEBI</text><text class="sb" x="268" y="43">Reg 16C · AI guidelines due</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="8" y="66" width="344" height="20" rx="6"/><text class="tl" x="180" y="80" text-anchor="middle">board-approved AI policy</text></g><g class="a" style="--d:0.30000000000000004s"><rect class="bx soft" x="8" y="92" width="344" height="20" rx="6"/><text class="tl" x="180" y="106" text-anchor="middle">AI inventory, risk-tiered</text></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="8" y="118" width="344" height="20" rx="6"/><text class="tl" x="180" y="132" text-anchor="middle">you own the output, even from a vendor</text></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="8" y="144" width="344" height="20" rx="6"/><text class="tl" x="180" y="158" text-anchor="middle">kill switch and human oversight</text></g><g class="a" style="--d:0.6000000000000001s"><rect class="bx soft" x="8" y="170" width="344" height="20" rx="6"/><text class="tl" x="180" y="184" text-anchor="middle">tell customers; give a human option</text></g><text class="tl m a" x="180" y="212" style="--d:0.8s">Tighter controls for higher-risk uses</text></svg>