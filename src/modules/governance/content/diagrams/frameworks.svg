<svg viewBox="0 0 360 222" role="img" aria-label="The NIST AI Risk Management Framework has four functions: Govern for policy, roles and culture; Map for context, use case and impact; Measure for testing, evaluation and monitoring; and Manage for treating risks and responding. ISO/IEC 42001 is a certifiable management system: policy, risk and impact assessment, controls, internal audit, management review and improvement. One control can serve several frameworks."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="168" height="48" rx="7"/><text class="lb" x="92" y="27">Govern</text><text class="sb" x="92" y="42">policy, roles, culture</text></g><g class="a " style="--d:0.1s"><rect class="bx " x="184" y="6" width="168" height="48" rx="7"/><text class="lb" x="268" y="27">Map</text><text class="sb" x="268" y="42">context, use case, impact</text></g><g class="a " style="--d:0.2s"><rect class="bx " x="8" y="62" width="168" height="48" rx="7"/><text class="lb" x="92" y="83">Measure</text><text class="sb" x="92" y="98">test, evaluate, monitor</text></g><g class="a " style="--d:0.30000000000000004s"><rect class="bx " x="184" y="62" width="168" height="48" rx="7"/><text class="lb" x="268" y="83">Manage</text><text class="sb" x="268" y="98">treat risks, respond</text></g><text class="tl l a" x="8" y="136" style="--d:0.5s">ISO/IEC 42001: a certifiable management system</text><g class="a" style="--d:0.6s"><rect class="bx soft" x="8" y="144" width="344" height="22" rx="6"/><text class="tl" x="180" y="159" text-anchor="middle">policy → risk and impact assessment → controls</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="170" width="344" height="22" rx="6"/><text class="tl" x="180" y="185" text-anchor="middle">→ internal audit → management review → improve</text></g><text class="tl m a" x="180" y="214" style="--d:0.9s">One control can serve several frameworks</text></svg>