<svg viewBox="0 0 360 212" role="img" aria-label="A system card lists intended use and out-of-scope uses, data sources and legal basis, overall results, results by segment, known limitations, human oversight and kill switch, versions and change log, and a grievance contact. In the illustrative example, 94 percent overall accuracy hides 71 percent on scanned regional-language documents, which only a by-segment breakdown reveals."><g class="a" style="--d:0s"><rect class="bx" x="8" y="6" width="200" height="200" rx="8"/><text class="lb" x="108" y="26">System card</text></g><text class="tl l a" x="20" y="48" style="--d:0.1s">Intended use · out of scope</text><text class="tl l a" x="20" y="67" style="--d:0.16s">Data sources · legal basis</text><text class="tl l a" x="20" y="86" style="--d:0.22s">Results overall</text><text class="tl l a" x="20" y="105" style="--d:0.28s">Results by segment</text><text class="tl l a" x="20" y="124" style="--d:0.33999999999999997s">Known limitations</text><text class="tl l a" x="20" y="143" style="--d:0.4s">Human oversight · kill switch</text><text class="tl l a" x="20" y="162" style="--d:0.45999999999999996s">Versions · change log</text><text class="tl l a" x="20" y="181" style="--d:0.52s">Grievance contact</text><text class="tl a" x="300" y="44" style="text-anchor:middle;--d:.7s">Overall</text><text class="big a" x="300" y="76" style="--d:.8s">94%</text><text class="tl a" x="300" y="116" style="text-anchor:middle;--d:.9s">Scanned, regional-language</text><text class="big a" x="300" y="148" style="--d:1s;fill:var(--fail)">71%</text><text class="tl m a" x="284" y="190" style="--d:1.1s">segments reveal</text><text class="tl m a" x="284" y="204" style="--d:1.15s">what averages hide</text></svg>