<svg viewBox="0 0 360 208" role="img" aria-label="An AI incident is detected, classified by severity from S1 to S4, and logged in a register. Notification clocks may apply: CERT-In within 6 hours for cyber incidents, the Data Protection Board without delay and a detailed report within 72 hours for personal data breaches under DPDP, and serious incidents under the EU AI Act within 15 days, shorter in some cases. Each incident gets a root cause and corrective action, is reported to the board and regulators where required, and is closed only when the fix is verified."><text class="tl l a" x="6" y="14" style="--d:0s">Is it an AI incident, how bad, and who must be told?</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="22" width="110" height="22" rx="6"/><text class="mono" x="61" y="37" text-anchor="middle">detect</text></g><g class="a" style="--d:0.15s"><path class="ln " d="M118 33L124 33" marker-end="url(#arr)"/></g><g class="a" style="--d:0.2s"><rect class="bx warn" x="126" y="22" width="110" height="22" rx="6"/><text class="mono" x="181" y="37" text-anchor="middle">classify S1–S4</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M238 33L244 33" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="246" y="22" width="108" height="22" rx="6"/><text class="mono" x="300" y="37" text-anchor="middle">register</text></g><text class="tl l a" x="6" y="66" style="--d:0.45s">Notification clocks (educational summary)</text><g class="a" style="--d:0.55s"><rect class="bx soft" x="6" y="74" width="120" height="20" rx="6"/><text class="tl" x="66" y="88" text-anchor="middle">CERT-In (cyber)</text></g><text class="mono l a" x="132" y="88" style="--d:0.6s">6 hours</text><g class="a" style="--d:0.65s"><rect class="bx soft" x="6" y="98" width="120" height="20" rx="6"/><text class="tl" x="66" y="112" text-anchor="middle">DPDP breach</text></g><text class="mono l a" x="132" y="112" style="--d:0.7s">Board: without delay; 72 h report</text><g class="a" style="--d:0.75s"><rect class="bx soft" x="6" y="122" width="120" height="20" rx="6"/><text class="tl" x="66" y="136" text-anchor="middle">EU AI Act (serious)</text></g><text class="mono l a" x="132" y="136" style="--d:0.8s">15 days; shorter in some cases</text><g class="a" style="--d:1s"><rect class="bx pass" x="6" y="152" width="168" height="22" rx="6"/><text class="tl" x="90" y="167" text-anchor="middle">root cause + corrective action</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="186" y="152" width="168" height="22" rx="6"/><text class="tl" x="270" y="167" text-anchor="middle">board and regulator report</text></g><g class="a" style="--d:1.25s"><rect class="bx acc" x="6" y="180" width="348" height="22" rx="6"/><text class="tl" x="180" y="195" text-anchor="middle">close only when the fix is verified and the register updated</text></g></svg>