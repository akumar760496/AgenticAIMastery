<svg viewBox="0 0 360 222" role="img" aria-label="DPDP life cycle for personal data: an itemised plain-language notice, specific consent per purpose, collecting only what the purpose needs, protecting it with safeguards and processor contracts, and erasing it when the purpose ends. A breach must be reported to the Data Protection Board without delay, with a detailed report within 72 hours. Most obligations apply from 13 May 2027, and penalties reach 250 crore rupees."><g class="a" style="--d:0s"><rect class="bx acc" x="8" y="6" width="96" height="22" rx="6"/><text class="mono" x="56" y="21" text-anchor="middle">notice</text></g><text class="tl l a" x="112" y="21" style="--d:0.05s">itemised, plain language</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="8" y="34" width="96" height="22" rx="6"/><text class="mono" x="56" y="49" text-anchor="middle">consent</text></g><text class="tl l a" x="112" y="49" style="--d:0.15000000000000002s">specific, per purpose</text><g class="a" style="--d:0.2s"><rect class="bx pass" x="8" y="62" width="96" height="22" rx="6"/><text class="mono" x="56" y="77" text-anchor="middle">collect</text></g><text class="tl l a" x="112" y="77" style="--d:0.25s">only what the purpose needs</text><g class="a" style="--d:0.30000000000000004s"><rect class="bx pass" x="8" y="90" width="96" height="22" rx="6"/><text class="mono" x="56" y="105" text-anchor="middle">protect</text></g><text class="tl l a" x="112" y="105" style="--d:0.35000000000000003s">safeguards, processor contracts</text><g class="a" style="--d:0.4s"><rect class="bx pass" x="8" y="118" width="96" height="22" rx="6"/><text class="mono" x="56" y="133" text-anchor="middle">erase</text></g><text class="tl l a" x="112" y="133" style="--d:0.45s">when the purpose ends</text><g class="a" style="--d:0.7s"><rect class="bx warn" x="8" y="150" width="344" height="24" rx="6"/><text class="tl" x="180" y="166" text-anchor="middle">breach: tell the Board without delay, full report in 72 h</text></g><text class="tl l a" x="8" y="196" style="--d:0.9s">Most obligations apply from 13 May 2027.</text><text class="tl l a" x="8" y="212" style="--d:1s">Penalties up to ₹250 crore per breach of duty.</text></svg>