<svg viewBox="0 0 360 248" role="img" aria-label="The bank app calls one abstraction layer, which sends requests to a primary provider on a pinned, dated model version and can switch to a tested fallback provider. The contract sets zero-day retention, no training on the bank’s data and an India region, requires incident notice within 6 hours and has an exit plan on file. On a floating alias about 6 provider-side behaviour changes a year reach production unevaluated; pinned versions with evals on every change bring that to 0, while planned upgrades still happen after evaluation."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="92" height="26" rx="6"/><text class="tl" x="54" y="25" text-anchor="middle">bank app</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M102 21L116 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="118" y="8" width="234" height="26" rx="6"/><text class="tl" x="235" y="25" text-anchor="middle">abstraction layer · one API</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M190 36L150 50" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><path class="ln " d="M290 36L300 50" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx pass" x="8" y="52" width="206" height="26" rx="6"/><text class="mono" x="111" y="69" text-anchor="middle">primary · model-2026-03-15</text></g><g class="a" style="--d:0.5s"><rect class="bx pass" x="222" y="52" width="130" height="26" rx="6"/><text class="tl" x="287" y="69" text-anchor="middle">fallback · tested</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="86" width="344" height="22" rx="6"/><text class="tl" x="180" y="101" text-anchor="middle">terms: 0-day retention · no training · India region</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="8" y="112" width="344" height="22" rx="6"/><text class="tl" x="180" y="127" text-anchor="middle">notify us of incidents within 6 h · exit plan on file</text></g><text class="tl l a" x="8" y="154" style="--d:1s">Behaviour changes reaching production a year</text><text class="tl a" x="124" y="176" style="text-anchor:end;--d:1.1s">Floating alias</text><rect x="130" y="165" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="165" width="180" height="16" rx="3" class="bar grow warn" style="--d:1.2s"/><text class="mono l a" x="316" y="177" style="--d:1.4s">6</text><text class="tl a" x="124" y="204" style="text-anchor:end;--d:1.3s">Pinned + evals</text><rect x="130" y="193" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="193" width="1.5" height="16" rx="3" class="bar grow pass" style="--d:1.4s"/><text class="mono l a" x="316" y="205" style="--d:1.6s">0</text><g class="a" style="--d:1.7s"><rect class="bx soft" x="8" y="220" width="344" height="22" rx="6"/><text class="tl" x="180" y="235" text-anchor="middle">upgrades still happen, but only after your evals</text></g></svg>