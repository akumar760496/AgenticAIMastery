<svg viewBox="0 0 360 200" role="img" aria-label="Each generated image or audio clip gets three layers: a visible label, signed C2PA metadata and an invisible watermark. After sharing, crops can cut the label and platforms often strip metadata, while the watermark usually survives. India’s IT Amendment Rules 2026, in force from 20 February 2026, require prominent labels on synthetic content, embedded metadata or an identifier where feasible, and no removal of labels or metadata."><text class="tl l a" x="6" y="14" style="--d:0s">Three layers on every generated image or audio</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="6" y="22" width="110" height="24" rx="6"/><text class="mono" x="61" y="38" text-anchor="middle">visible label</text></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="124" y="22" width="110" height="24" rx="6"/><text class="mono" x="179" y="38" text-anchor="middle">C2PA metadata</text></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="242" y="22" width="112" height="24" rx="6"/><text class="mono" x="298" y="38" text-anchor="middle">invisible mark</text></g><text class="tl l a" x="6" y="66" style="--d:0.45s">After sharing: screenshots, crops, re-encoding</text><g class="a" style="--d:0.55s"><rect class="bx warn" x="6" y="74" width="110" height="22" rx="6"/><text class="mono" x="61" y="89" text-anchor="middle">crop can cut it</text></g><g class="a" style="--d:0.65s"><rect class="bx warn" x="124" y="74" width="110" height="22" rx="6"/><text class="mono" x="179" y="89" text-anchor="middle">often stripped</text></g><g class="a" style="--d:0.75s"><rect class="bx pass" x="242" y="74" width="112" height="22" rx="6"/><text class="mono" x="298" y="89" text-anchor="middle">usually survives</text></g><text class="tl l a" x="6" y="118" style="--d:0.9s">India, IT Amendment Rules 2026 (in force 20 Feb 2026)</text><g class="a" style="--d:1s"><rect class="bx soft" x="6" y="126" width="348" height="20" rx="6"/><text class="tl" x="180" y="140" text-anchor="middle">label synthetic audio/video/images prominently</text></g><g class="a" style="--d:1.1s"><rect class="bx soft" x="6" y="150" width="348" height="20" rx="6"/><text class="tl" x="180" y="164" text-anchor="middle">embed metadata or an identifier where feasible</text></g><g class="a" style="--d:1.2s"><rect class="bx soft" x="6" y="174" width="348" height="20" rx="6"/><text class="tl" x="180" y="188" text-anchor="middle">do not let users remove labels or metadata</text></g></svg>