<svg viewBox="0 0 360 218" role="img" aria-label="An audit trail is a chain of decision records, each holding the hash of the previous one, so edits are detectable. Each record holds the input hash, model and prompt versions, the rules used, tool calls, the decision and reason codes, the reviewer and any override, and timestamps. Personal data is masked, and records are kept for the legal retention period, so any decision can be replayed years later."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="108" height="64" rx="6"/><text class="lb" x="62" y="24">#1041</text><text class="sb" x="62" y="40">reject</text><text class="sb" x="62" y="58">prev: 000…</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M116 38L126 38" marker-end="url(#arr)"/></g><g class="a" style="--d:0.15s"><rect class="bx soft" x="126" y="6" width="108" height="64" rx="6"/><text class="lb" x="180" y="24">#1042</text><text class="sb" x="180" y="40">approve</text><text class="sb" x="180" y="58">prev: a9f…</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M234 38L244 38" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="244" y="6" width="108" height="64" rx="6"/><text class="lb" x="298" y="24">#1043</text><text class="sb" x="298" y="40">refer</text><text class="sb" x="298" y="58">prev: a9f…</text></g><text class="tl l a" x="8" y="90" style="--d:0.5s">Each record: input hash, model and prompt version,</text><text class="tl l a" x="8" y="106" style="--d:0.55s">rules used, tool calls, decision and reason codes,</text><text class="tl l a" x="8" y="122" style="--d:0.6s">reviewer and override, timestamps</text><g class="a" style="--d:0.8s"><rect class="bx pass" x="8" y="134" width="344" height="22" rx="6"/><text class="tl" x="180" y="149" text-anchor="middle">append-only, hash-chained: edits are detectable</text></g><g class="a" style="--d:0.9s"><rect class="bx acc" x="8" y="162" width="344" height="22" rx="6"/><text class="tl" x="180" y="177" text-anchor="middle">mask PII in logs; keep for the legal retention period</text></g><text class="tl m a" x="180" y="210" style="--d:1.1s">Can you replay decision #1041 two years later?</text></svg>