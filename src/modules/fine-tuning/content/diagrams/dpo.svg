<svg viewBox="0 0 360 202" role="img" aria-label="DPO trains on pairs: for each prompt, a chosen answer and a rejected one. The update makes the chosen answer more likely and the rejected one less likely, while beta keeps the model close to its reference. Illustrative win rate against the SFT model: 66 percent."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="344" height="24" rx="6"/><text class="mono" x="180" y="22" text-anchor="middle">prompt: “Explain STT on an intraday trade.”</text></g><g class="a" style="--d:0.2s"><rect class="bx pass" x="8" y="38" width="168" height="40" rx="6"/><text class="tl" x="92" y="62" text-anchor="middle">chosen ✓</text></g><g class="a" style="--d:0.3s"><rect class="bx fail" x="184" y="38" width="168" height="40" rx="6"/><text class="tl" x="268" y="62" text-anchor="middle">rejected ✗</text></g><text class="sb a" x="92" y="72" style="--d:.25s">short, correct, cites rate</text><text class="sb a" x="268" y="72" style="--d:.35s">long, vague, no rate</text><g class="a" style="--d:0.5s"><path class="ln " d="M180 82L180 98" marker-end="url(#arr)"/></g><g class="a " style="--d:0.6s"><rect class="bx acc" x="80" y="100" width="200" height="40" rx="7"/><text class="lb" x="180" y="117">DPO update</text><text class="sb" x="180" y="132">raise chosen, lower rejected</text></g><text class="tl l a" x="8" y="166" style="--d:0.9s">β keeps the model close to the reference (default 0.1)</text><text class="tl a" x="120" y="190" style="text-anchor:end;--d:1s">Win rate vs SFT</text><rect x="126" y="179" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="179" width="118.80000000000001" height="14" rx="3" class="bar grow pass" style="--d:1.1s"/><text class="mono l a" x="312" y="190" style="--d:1.2s">66%</text></svg>