<svg viewBox="0 0 360 228" role="img" aria-label="A curation pipeline at a fictional NBFC. 50,000 raw logged loan queries lose 9,000 duplicates and 400 near-copies of eval items. Labels are fixed, personal data is scrubbed and the dominant EMI-date intent is cut by 8,120 rows. 5,000 verified synthetic examples are added for rare intents, giving 37,480 rows. Honest held-out accuracy rises from 81.4 percent on the raw data to 90.6 percent, and accuracy on three rare intents from 58 to 87 percent."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="108" height="24" rx="6"/><text class="mono" x="62" y="22" text-anchor="middle">50,000 raw</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M118 18L130 18" marker-end="url(#arr)"/></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="132" y="6" width="104" height="24" rx="6"/><text class="mono" x="184" y="22" text-anchor="middle">dedup −9,000</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M238 18L250 18" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx warn" x="252" y="6" width="100" height="24" rx="6"/><text class="mono" x="302" y="22" text-anchor="middle">decontam −400</text></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="8" y="38" width="108" height="24" rx="6"/><text class="tl" x="62" y="54" text-anchor="middle">fix labels</text></g><g class="a" style="--d:0.6s"><rect class="bx acc" x="124" y="38" width="112" height="24" rx="6"/><text class="tl" x="180" y="54" text-anchor="middle">scrub PII</text></g><g class="a" style="--d:0.7s"><rect class="bx acc" x="244" y="38" width="108" height="24" rx="6"/><text class="mono" x="298" y="54" text-anchor="middle">cap EMI −8,120</text></g><g class="a" style="--d:0.8s"><rect class="bx pass" x="8" y="70" width="220" height="24" rx="6"/><text class="tl" x="118" y="86" text-anchor="middle">+5,000 verified synthetic</text></g><g class="a" style="--d:0.9s"><path class="ln " d="M230 82L242 82" marker-end="url(#arr)"/></g><g class="a" style="--d:1s"><rect class="bx pass" x="244" y="70" width="108" height="24" rx="6"/><text class="mono" x="298" y="86" text-anchor="middle">37,480 rows</text></g><text class="tl l a" x="8" y="120" style="--d:1.1s">Honest accuracy on held-out loan queries</text><text class="tl a" x="120" y="139" style="text-anchor:end;--d:1.2s">Raw 50,000</text><rect x="126" y="128" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="128" width="146.51999999999998" height="14" rx="3" class="bar grow warn" style="--d:1.3s"/><text class="mono l a" x="312" y="139" style="--d:1.4s">81.4%</text><text class="tl a" x="120" y="161" style="text-anchor:end;--d:1.3s">Curated 37,480</text><rect x="126" y="150" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="150" width="163.08" height="14" rx="3" class="bar grow pass" style="--d:1.4000000000000001s"/><text class="mono l a" x="312" y="161" style="--d:1.5s">90.6%</text><text class="tl a" x="120" y="193" style="text-anchor:end;--d:1.4s">Rare, raw</text><rect x="126" y="182" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="182" width="104.39999999999999" height="14" rx="3" class="bar grow fail" style="--d:1.5s"/><text class="mono l a" x="312" y="193" style="--d:1.5999999999999999s">58%</text><text class="tl a" x="120" y="215" style="text-anchor:end;--d:1.5s">Rare, curated</text><rect x="126" y="204" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="204" width="156.6" height="14" rx="3" class="bar grow pass" style="--d:1.6s"/><text class="mono l a" x="312" y="215" style="--d:1.7s">87%</text><text class="tl l a" x="8" y="176" style="--d:1.4s">Three rare intents</text></svg>