<svg viewBox="0 0 360 234" role="img" aria-label="LoRA keeps a weight matrix W frozen and trains two thin matrices, B and A, of rank 16, whose product is added to W. For a 4096 by 4096 matrix that is 131 thousand trainable parameters instead of 16.8 million. QLoRA also stores the frozen weights in 4 bits."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="110" height="110" rx="6"/><text class="lb" x="63" y="58">W</text><text class="sb" x="63" y="76">frozen</text><text class="sb" x="63" y="92">4096 × 4096</text></g><text class="lb a" x="132" y="66" style="--d:.2s">+</text><g class="a" style="--d:.3s"><rect class="bx acc" x="148" y="6" width="22" height="110" rx="4"/><text class="sb" x="159" y="130">B</text></g><text class="lb a" x="184" y="66" style="--d:.4s">×</text><g class="a" style="--d:.5s"><rect class="bx acc" x="198" y="50" width="110" height="22" rx="4"/><text class="sb" x="253" y="88">A (rank r = 16)</text></g><text class="tl l a" x="8" y="156" style="--d:0.8s">Trainable parameters in one 4096 × 4096 matrix</text><text class="tl a" x="120" y="178" style="text-anchor:end;--d:.9s">Full</text><rect x="126" y="167" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="167" width="180" height="14" rx="3" class="bar grow warn" style="--d:1s"/><text class="mono l a" x="312" y="178" style="--d:1.1s">16.8M</text><text class="tl a" x="120" y="202" style="text-anchor:end;--d:1s">LoRA r=16</text><rect x="126" y="191" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="191" width="1.5" height="14" rx="3" class="bar grow pass" style="--d:1.1s"/><text class="mono l a" x="312" y="202" style="--d:1.2s">131k</text><text class="tl m a" x="180" y="226" style="--d:1.3s">QLoRA also stores W in 4 bits</text></svg>