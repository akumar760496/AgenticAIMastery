<svg viewBox="0 0 360 222" role="img" aria-label="A decision guide: facts that change call for retrieval, format, style and tone call for fine-tuning, a narrow skill at scale calls for fine-tuning with retrieval, and a task already at 90 percent with a prompt should stay a prompt. Fine-tuning teaches behaviour better than knowledge."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="176" height="26" rx="6"/><text class="tl" x="96" y="23" text-anchor="middle">Facts that change</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M186 19L200 19" marker-end="url(#arr)"/></g><g class="a" style="--d:0.15s"><rect class="bx acc" x="202" y="6" width="150" height="26" rx="6"/><text class="tl" x="277" y="23" text-anchor="middle">RAG</text></g><g class="a" style="--d:0.12s"><rect class="bx soft" x="8" y="40" width="176" height="26" rx="6"/><text class="tl" x="96" y="57" text-anchor="middle">Format, style, tone</text></g><g class="a" style="--d:0.22s"><path class="ln " d="M186 53L200 53" marker-end="url(#arr)"/></g><g class="a" style="--d:0.27s"><rect class="bx warn" x="202" y="40" width="150" height="26" rx="6"/><text class="tl" x="277" y="57" text-anchor="middle">Fine-tune</text></g><g class="a" style="--d:0.24s"><rect class="bx soft" x="8" y="74" width="176" height="26" rx="6"/><text class="tl" x="96" y="91" text-anchor="middle">A narrow skill at scale</text></g><g class="a" style="--d:0.33999999999999997s"><path class="ln " d="M186 87L200 87" marker-end="url(#arr)"/></g><g class="a" style="--d:0.39s"><rect class="bx warn" x="202" y="74" width="150" height="26" rx="6"/><text class="tl" x="277" y="91" text-anchor="middle">Fine-tune (+ RAG)</text></g><g class="a" style="--d:0.36s"><rect class="bx soft" x="8" y="108" width="176" height="26" rx="6"/><text class="tl" x="96" y="125" text-anchor="middle">Already 90% with a prompt</text></g><g class="a" style="--d:0.45999999999999996s"><path class="ln " d="M186 121L200 121" marker-end="url(#arr)"/></g><g class="a" style="--d:0.51s"><rect class="bx pass" x="202" y="108" width="150" height="26" rx="6"/><text class="tl" x="277" y="125" text-anchor="middle">Keep prompting</text></g><text class="tl l a" x="8" y="164" style="--d:0.8s">Fine-tuning on new facts can raise hallucination;</text><text class="tl l a" x="8" y="180" style="--d:0.8s">it teaches behaviour better than knowledge.</text><g class="a" style="--d:1s"><rect class="bx soft" x="8" y="190" width="344" height="24" rx="6"/><text class="tl" x="180" y="206" text-anchor="middle">decide from evals, volume and how often facts change</text></g></svg>