<svg viewBox="0 0 360 212" role="img" aria-label="A large teacher model answers 50 thousand real inputs, a judge filters the answers, and they train an 8-billion-parameter student with LoRA. Illustratively the student reaches 91 percent against the teacher’s 92, at 8 paise a call instead of 90."><g class="a " style="--d:0s"><rect class="bx warn" x="8" y="6" width="130" height="44" rx="7"/><text class="lb" x="73" y="25">Teacher</text><text class="sb" x="73" y="40">large model</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M140 28L160 28" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="162" y="16" width="190" height="24" rx="6"/><text class="mono" x="257" y="32" text-anchor="middle">50k answers on real inputs</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M256 42L256 58" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="162" y="60" width="190" height="24" rx="6"/><text class="mono" x="257" y="76" text-anchor="middle">filter with a judge</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M256 86L256 102" marker-end="url(#arr)"/></g><g class="a " style="--d:0.7s"><rect class="bx pass" x="162" y="104" width="190" height="40" rx="7"/><text class="lb" x="257" y="121">Student</text><text class="sb" x="257" y="136">8B, LoRA</text></g><text class="tl a" x="120" y="176" style="text-anchor:end;--d:.9s">Teacher</text><rect x="126" y="165" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="165" width="165.6" height="14" rx="3" class="bar grow warn" style="--d:1s"/><text class="mono l a" x="310" y="176" style="--d:1.1s">92% · ₹0.90</text><text class="tl a" x="120" y="200" style="text-anchor:end;--d:1s">Student</text><rect x="126" y="189" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="189" width="163.8" height="14" rx="3" class="bar grow pass" style="--d:1.1s"/><text class="mono l a" x="310" y="200" style="--d:1.2s">91% · ₹0.08</text></svg>