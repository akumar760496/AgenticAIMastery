<svg viewBox="0 0 360 202" role="img" aria-label="For each prompt the model samples a group of answers, and a program such as unit tests scores each one. GRPO compares each answer with its group’s average, pushing passing answers up and failing ones down, with no value model. A weak checker can be gamed, which is reward hacking."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="110" height="24" rx="6"/><text class="mono" x="63" y="22" text-anchor="middle">prompt</text></g><path class="ln draw " pathLength="1" d="M118 18 C130 18,130 14,142 14" style="--d:0.1s"/><g class="a" style="--d:0.2s"><rect class="bx soft" x="144" y="4" width="80" height="20" rx="6"/><text class="mono" x="184" y="18" text-anchor="middle">answer A</text></g><path class="ln draw " pathLength="1" d="M118 18 C130 18,130 40,142 40" style="--d:0.15000000000000002s"/><g class="a" style="--d:0.28s"><rect class="bx soft" x="144" y="30" width="80" height="20" rx="6"/><text class="mono" x="184" y="44" text-anchor="middle">answer B</text></g><path class="ln draw " pathLength="1" d="M118 18 C130 18,130 66,142 66" style="--d:0.2s"/><g class="a" style="--d:0.36s"><rect class="bx soft" x="144" y="56" width="80" height="20" rx="6"/><text class="mono" x="184" y="70" text-anchor="middle">answer C</text></g><path class="ln draw " pathLength="1" d="M118 18 C130 18,130 92,142 92" style="--d:0.25s"/><g class="a" style="--d:0.44s"><rect class="bx soft" x="144" y="82" width="80" height="20" rx="6"/><text class="mono" x="184" y="96" text-anchor="middle">answer D</text></g><g class="a" style="--d:0.5s"><path class="ln " d="M226 14L240 14" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6s"><rect class="bx pass" x="242" y="4" width="110" height="20" rx="6"/><text class="tl" x="297" y="18" text-anchor="middle">tests pass: 1</text></g><g class="a" style="--d:0.55s"><path class="ln " d="M226 40L240 40" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6799999999999999s"><rect class="bx fail" x="242" y="30" width="110" height="20" rx="6"/><text class="tl" x="297" y="44" text-anchor="middle">tests fail: 0</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M226 66L240 66" marker-end="url(#arr)"/></g><g class="a" style="--d:0.76s"><rect class="bx pass" x="242" y="56" width="110" height="20" rx="6"/><text class="tl" x="297" y="70" text-anchor="middle">tests pass: 1</text></g><g class="a" style="--d:0.65s"><path class="ln " d="M226 92L240 92" marker-end="url(#arr)"/></g><g class="a" style="--d:0.84s"><rect class="bx fail" x="242" y="82" width="110" height="20" rx="6"/><text class="tl" x="297" y="96" text-anchor="middle">tests fail: 0</text></g><text class="tl l a" x="8" y="130" style="--d:1s">GRPO: each answer is scored against its group’s average</text><g class="a" style="--d:1.1s"><rect class="bx acc" x="8" y="138" width="344" height="24" rx="6"/><text class="tl" x="180" y="154" text-anchor="middle">A, C pushed up · B, D pushed down · no value model</text></g><g class="a" style="--d:1.3s"><rect class="bx warn" x="8" y="170" width="344" height="24" rx="6"/><text class="tl" x="180" y="186" text-anchor="middle">a weak checker gets gamed: reward hacking</text></g></svg>