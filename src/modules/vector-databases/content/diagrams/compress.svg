<svg viewBox="0 0 360 226" role="img" aria-label="The same 1,024-dimension vector takes 4,096 bytes as float32, 1,024 bytes as int8, 64 bytes as a product-quantisation code and 128 bytes as binary. Recall drops as bits drop, so the search oversamples candidates from the compressed codes and rescores them with the full vectors kept on SSD."><text class="tl l a" x="6" y="14" style="--d:0s">One 1,024-dim vector, stored four ways</text><text class="mono l a" x="6" y="42" style="--d:0.2s">float32</text><rect x="100" y="30" width="190" height="18" rx="3" class="bar grow acc" style="--d:0.25s"/><text class="mono l a" x="298" y="42" style="--d:0.3s">4,096 B</text><text class="mono l a" x="6" y="76" style="--d:0.35s">int8 (scalar)</text><rect x="100" y="64" width="48" height="18" rx="3" class="bar grow soft" style="--d:0.4s"/><text class="mono l a" x="298" y="76" style="--d:0.44999999999999996s">1,024 B</text><text class="mono l a" x="6" y="110" style="--d:0.5s">binary, 1 bit</text><rect x="100" y="98" width="10" height="18" rx="3" class="bar grow warn" style="--d:0.55s"/><text class="mono l a" x="298" y="110" style="--d:0.6s">128 B</text><text class="mono l a" x="6" y="144" style="--d:0.6499999999999999s">PQ, 64 codes</text><rect x="100" y="132" width="10" height="18" rx="3" class="bar grow acc" style="--d:0.7s"/><text class="mono l a" x="298" y="144" style="--d:0.75s">64 B</text><g class="a" style="--d:1.1s"><rect class="bx fail" x="6" y="172" width="168" height="24" rx="6"/><text class="tl" x="90" y="188" text-anchor="middle">recall drops as bits drop</text></g><g class="a" style="--d:1.3s"><rect class="bx pass" x="186" y="172" width="168" height="24" rx="6"/><text class="tl" x="270" y="188" text-anchor="middle">rescore with full vectors</text></g><text class="tl l a" x="6" y="216" style="--d:1.5s">Oversample ×4 on compressed codes, re-rank with float32 from SSD</text></svg>