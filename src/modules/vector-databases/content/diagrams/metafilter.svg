<svg viewBox="0 0 360 250" role="img" aria-label="A query vector comes with a structured filter: motor, Maharashtra, circular, effective from April 2025. Of 20 lakh chunks, 10,000 match. Post-filtering the top 10 leaves nothing; pre-filtering scans the 10,000 matches exactly and returns 10; filtered ANN checks the filter during the graph walk and returns 10. Expected matches left in a post-filtered top 10 are 5 at 50% selectivity, 0.5 at 5% and 0.05 at 0.5%."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="110" height="26" rx="6"/><text class="tl" x="63" y="25" text-anchor="middle">query vector</text></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="124" y="8" width="228" height="26" rx="6"/><text class="mono" x="238" y="25" text-anchor="middle">motor ∧ MH ∧ circular ∧ ≥ Apr 2025</text></g><text class="sb a" x="8" y="54" style="--d:0.4s">20,00,000 chunks · 10,000 match (0.5%)</text><g class="a" style="--d:0.5s"><rect class="bx fail" x="8" y="62" width="132" height="24" rx="6"/><text class="tl" x="74" y="78" text-anchor="middle">post-filter</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M142 74L154 74" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx fail" x="156" y="62" width="196" height="24" rx="6"/><text class="mono" x="254" y="78" text-anchor="middle">top 10 → 0 left</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="8" y="92" width="132" height="24" rx="6"/><text class="tl" x="74" y="108" text-anchor="middle">pre-filter</text></g><g class="a" style="--d:0.9s"><path class="ln " d="M142 104L154 104" marker-end="url(#arr)"/></g><g class="a" style="--d:1s"><rect class="bx pass" x="156" y="92" width="196" height="24" rx="6"/><text class="mono" x="254" y="108" text-anchor="middle">10,000 exact → 10</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="8" y="122" width="132" height="24" rx="6"/><text class="tl" x="74" y="138" text-anchor="middle">filtered ANN</text></g><g class="a" style="--d:1.2s"><path class="ln " d="M142 134L154 134" marker-end="url(#arr)"/></g><g class="a" style="--d:1.3s"><rect class="bx pass" x="156" y="122" width="196" height="24" rx="6"/><text class="mono" x="254" y="138" text-anchor="middle">filter in walk → 10</text></g><text class="tl l a" x="8" y="172" style="--d:1.4s">Matches left in a post-filtered top 10</text><text class="tl a" x="64" y="194" style="text-anchor:end;--d:1.5s">50%</text><rect x="70" y="182" width="220" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="70" y="182" width="220" height="16" rx="3" class="bar grow warn" style="--d:1.6s"/><text class="mono l a" x="298" y="194" style="--d:1.8s">5</text><text class="tl a" x="64" y="216" style="text-anchor:end;--d:1.6s">5%</text><rect x="70" y="204" width="220" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="70" y="204" width="22" height="16" rx="3" class="bar grow fail" style="--d:1.7000000000000002s"/><text class="mono l a" x="298" y="216" style="--d:1.9000000000000001s">0.5</text><text class="tl a" x="64" y="238" style="text-anchor:end;--d:1.7s">0.5%</text><rect x="70" y="226" width="220" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="70" y="226" width="2.2" height="16" rx="3" class="bar grow fail" style="--d:1.8s"/><text class="mono l a" x="298" y="238" style="--d:2s">0.05</text></svg>