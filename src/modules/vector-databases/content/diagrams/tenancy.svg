<svg viewBox="0 0 360 262" role="img" aria-label="Priya, a user at client t042 in the pune-credit group, sends a query. The tenant comes from her verified token. Inside the database, before ranking, a row-level security policy or namespace keeps only tenant t042, and an ACL condition keeps only chunks shared with t042:pune-credit, so the top 10 are all allowed and the page is full. With 2,400 access revocations a day, a nightly ACL sync leaves about 1,440 stale-permission exposures a day, an hourly sync about 60, and syncing on change about 2."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="190" height="26" rx="6"/><text class="mono" x="103" y="25" text-anchor="middle">Priya · t042 · pune-credit</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M200 21L214 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="216" y="8" width="136" height="26" rx="6"/><text class="tl" x="284" y="25" text-anchor="middle">tenant from token</text></g><g class="a" style="--d:.5s"><rect class="bx soft" x="8" y="44" width="344" height="74" rx="7"/><text class="sb" x="18" y="60">inside the database, before ranking</text></g><g class="a" style="--d:0.7s"><rect class="bx warn" x="18" y="66" width="160" height="22" rx="6"/><text class="mono" x="98" y="81" text-anchor="middle">tenant_id = t042</text></g><g class="a" style="--d:0.8s"><rect class="bx " x="186" y="66" width="156" height="22" rx="6"/><text class="tl" x="264" y="81" text-anchor="middle">RLS or namespace</text></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="18" y="92" width="160" height="22" rx="6"/><text class="mono" x="98" y="107" text-anchor="middle">acl && t042:pune-credit</text></g><g class="a" style="--d:1s"><rect class="bx " x="186" y="92" width="156" height="22" rx="6"/><text class="tl" x="264" y="107" text-anchor="middle">ACL in the query</text></g><g class="a" style="--d:1.1s"><path class="ln " d="M180 120L180 132" marker-end="url(#arr)"/></g><g class="a" style="--d:1.2s"><rect class="bx pass" x="8" y="134" width="344" height="24" rx="6"/><text class="tl" x="180" y="150" text-anchor="middle">top 10: every chunk allowed, page full</text></g><text class="tl l a" x="8" y="180" style="--d:1.4s">Stale-permission exposures a day</text><text class="tl a" x="124" y="200" style="text-anchor:end;--d:1.5s">Nightly ACL sync</text><rect x="130" y="189" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="189" width="180" height="16" rx="3" class="bar grow fail" style="--d:1.6s"/><text class="mono l a" x="316" y="201" style="--d:1.8s">1,440</text><text class="tl a" x="124" y="224" style="text-anchor:end;--d:1.6s">Hourly sync</text><rect x="130" y="213" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="213" width="7.5" height="16" rx="3" class="bar grow warn" style="--d:1.7s"/><text class="mono l a" x="316" y="225" style="--d:1.9s">60</text><text class="tl a" x="124" y="248" style="text-anchor:end;--d:1.7s">Sync on change</text><rect x="130" y="237" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="237" width="2" height="16" rx="3" class="bar grow pass" style="--d:1.8s"/><text class="mono l a" x="316" y="249" style="--d:2s">2</text></svg>