<svg viewBox="0 0 360 228" role="img" aria-label="Four layers narrow one million candidates to one thousand, one hundred, then ten."><text class="mono a" x="6" y="35" style="--d:0s">binary scan</text><rect x="112" y="22" width="170" height="20" rx="3" class="bar grow " style="--d:0.1s"/><text class="mono l a" x="288" y="37" style="--d:0.4s">1,000,000</text><path d="M160 44 v14" class="ln a" style="--d:0.3s" marker-end="url(#arr)"/><text class="mono a" x="6" y="79" style="--d:0.25s">int8 rescore</text><rect x="112" y="66" width="95" height="20" rx="3" class="bar grow " style="--d:0.4s"/><text class="mono l a" x="213" y="81" style="--d:0.7s">1,000</text><path d="M160 88 v14" class="ln a" style="--d:0.6s" marker-end="url(#arr)"/><text class="mono a" x="6" y="123" style="--d:0.5s">full precision</text><rect x="112" y="110" width="70" height="20" rx="3" class="bar grow " style="--d:0.7s"/><text class="mono l a" x="188" y="125" style="--d:1s">100</text><path d="M160 132 v14" class="ln a" style="--d:0.8999999999999999s" marker-end="url(#arr)"/><text class="mono a" x="6" y="167" style="--d:0.75s">cross-encoder</text><rect x="112" y="154" width="45" height="20" rx="3" class="bar grow pass" style="--d:0.9999999999999999s"/><text class="mono l a" x="163" y="169" style="--d:1.2999999999999998s">10</text><text class="tl m a" x="180" y="204" style="--d:1.6s">Each layer is costlier per item but sees far fewer items</text><text class="sb a" x="180" y="220" style="--d:1.7s">bar length on a log scale</text></svg>