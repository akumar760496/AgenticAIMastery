<svg viewBox="0 0 360 226" role="img" aria-label="Vector stores fall into four families: Postgres with pgvector, a dedicated open-source engine, a managed serverless service, or an existing search engine. Choose on your constraints of scale, filters, data residency, operations time and cost, then benchmark two finalists on your own queries."><text class="tl l a" x="6" y="14" style="--d:0s">Four families, one decision</text><g class="a" style="--d:0.15s"><rect class="bx soft" x="6" y="24" width="150" height="24" rx="6"/><text class="tl" x="81" y="40" text-anchor="middle">Postgres + pgvector</text></g><text class="mono l a" x="164" y="40" style="--d:0.2s">already run it; to ~1 crore</text><g class="a" style="--d:0.27s"><rect class="bx acc" x="6" y="54" width="150" height="24" rx="6"/><text class="tl" x="81" y="70" text-anchor="middle">Open-source engine</text></g><text class="mono l a" x="164" y="70" style="--d:0.32s">Qdrant, Milvus, Weaviate</text><g class="a" style="--d:0.39s"><rect class="bx soft" x="6" y="84" width="150" height="24" rx="6"/><text class="tl" x="81" y="100" text-anchor="middle">Managed serverless</text></g><text class="mono l a" x="164" y="100" style="--d:0.44s">Pinecone and others</text><g class="a" style="--d:0.51s"><rect class="bx soft" x="6" y="114" width="150" height="24" rx="6"/><text class="tl" x="81" y="130" text-anchor="middle">Search engine</text></g><text class="mono l a" x="164" y="130" style="--d:0.56s">OpenSearch, Elasticsearch</text><text class="tl l a" x="6" y="158" style="--d:0.8s">Decide on your constraints, not on a table of benchmarks</text><g class="a" style="--d:0.9s"><rect class="bx warn" x="6" y="166" width="64" height="22" rx="6"/><text class="mono" x="38" y="181" text-anchor="middle">scale</text></g><g class="a" style="--d:0.98s"><rect class="bx warn" x="76" y="166" width="64" height="22" rx="6"/><text class="mono" x="108" y="181" text-anchor="middle">filters</text></g><g class="a" style="--d:1.06s"><rect class="bx warn" x="146" y="166" width="64" height="22" rx="6"/><text class="mono" x="178" y="181" text-anchor="middle">residency</text></g><g class="a" style="--d:1.1400000000000001s"><rect class="bx warn" x="216" y="166" width="64" height="22" rx="6"/><text class="mono" x="248" y="181" text-anchor="middle">ops time</text></g><g class="a" style="--d:1.22s"><rect class="bx warn" x="286" y="166" width="64" height="22" rx="6"/><text class="mono" x="318" y="181" text-anchor="middle">cost</text></g><g class="a" style="--d:1.4s"><rect class="bx pass" x="6" y="196" width="348" height="24" rx="6"/><text class="tl" x="180" y="212" text-anchor="middle">then benchmark 2 finalists on your own queries</text></g></svg>