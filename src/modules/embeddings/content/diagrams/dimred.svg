<svg viewBox="0 0 360 218" role="img" aria-label="Bytes per vector: 6,144 for float32 at 1,536 dimensions, 1,024 after Matryoshka truncation to 256, 1,536 as int8, and 192 as binary."><text class="tl a" x="6" y="16" style="--d:0s;fill:var(--ink)">float32 · 1,536 dims</text><rect x="6" y="22" width="250" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="6" y="22" width="250" height="16" rx="3" class="bar grow " style="--d:0.3s"/><text class="mono l a" x="262" y="35" style="--d:0.6s">6,144 B</text><text class="tl a" x="6" y="58" style="--d:0.12s;fill:var(--ink)">Matryoshka · 256 dims</text><rect x="6" y="64" width="250" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="6" y="64" width="41.666666666666664" height="16" rx="3" class="bar grow " style="--d:0.44999999999999996s"/><text class="mono l a" x="262" y="77" style="--d:0.75s">1,024 B</text><text class="tl a" x="6" y="100" style="--d:0.24s;fill:var(--ink)">int8 · 1,536 dims</text><rect x="6" y="106" width="250" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="6" y="106" width="62.5" height="16" rx="3" class="bar grow " style="--d:0.6s"/><text class="mono l a" x="262" y="119" style="--d:0.8999999999999999s">1,536 B</text><text class="tl a" x="6" y="142" style="--d:0.36s;fill:var(--ink)">binary · 1,536 dims</text><rect x="6" y="148" width="250" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="6" y="148" width="7.8125" height="16" rx="3" class="bar grow " style="--d:0.75s"/><text class="mono l a" x="262" y="161" style="--d:1.0499999999999998s">192 B</text><g class="a" style="--d:1.4s"><rect class="bx acc" x="6" y="184" width="348" height="28" rx="6"/><text class="mono" x="180" y="202.5" text-anchor="middle">10M vectors: 61 GB float32 → 1.9 GB binary</text></g></svg>