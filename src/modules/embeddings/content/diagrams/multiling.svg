<svg viewBox="0 0 360 244" role="img" aria-label="Three queries with one meaning, in English, Hindi in Devanagari and Roman-script Hinglish, pass through Unicode normalisation and transliteration into one multilingual model and reach the same English article. Recall@5 with an English-only model is 88% for English, 8% for Hindi and 35% for Hinglish; with a multilingual model, normalisation and Hindi copies it is 87%, 84% and 80%. The English-only overall of 54.8% hid the Hindi slice at 8%."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="150" height="24" rx="6"/><text class="mono" x="83" y="24" text-anchor="middle">refund status?</text></g><g class="a" style="--d:0.1s"><rect class="bx soft" x="8" y="36" width="150" height="24" rx="6"/><text class="tl" x="83" y="52" text-anchor="middle">पैसा कब आएगा</text></g><g class="a" style="--d:0.2s"><rect class="bx warn" x="8" y="64" width="150" height="24" rx="6"/><text class="mono" x="83" y="80" text-anchor="middle">paisa kab aayega</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M160 20L198 44" marker-end="url(#arr)"/></g><g class="a" style="--d:0.35s"><path class="ln " d="M160 48L198 48" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><path class="ln " d="M160 76L198 52" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="200" y="8" width="152" height="24" rx="6"/><text class="tl" x="276" y="24" text-anchor="middle">NFC + transliterate</text></g><g class="a" style="--d:0.6s"><rect class="bx acc" x="200" y="36" width="152" height="24" rx="6"/><text class="tl" x="276" y="52" text-anchor="middle">multilingual model</text></g><g class="a" style="--d:0.7s"><rect class="bx pass" x="200" y="64" width="152" height="24" rx="6"/><text class="tl" x="276" y="80" text-anchor="middle">→ English article</text></g><text class="tl l a" x="8" y="114" style="--d:0.9s">Recall@5 by language: English-only vs multilingual</text><text class="tl a" x="84" y="138" style="text-anchor:end;--d:1s">English</text><rect x="90" y="124" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="124" width="184.8" height="10" rx="3" class="bar grow warn" style="--d:1.1s"/><text class="mono l a" x="306" y="133" style="--d:1.2s">88%</text><rect x="90" y="136" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="136" width="182.7" height="10" rx="3" class="bar grow pass" style="--d:1.3s"/><text class="mono l a" x="306" y="145" style="--d:1.4s">87%</text><text class="tl a" x="84" y="168" style="text-anchor:end;--d:1.1s">Hindi</text><rect x="90" y="154" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="154" width="16.8" height="10" rx="3" class="bar grow warn" style="--d:1.2000000000000002s"/><text class="mono l a" x="306" y="163" style="--d:1.3s">8%</text><rect x="90" y="166" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="166" width="176.4" height="10" rx="3" class="bar grow pass" style="--d:1.4000000000000001s"/><text class="mono l a" x="306" y="175" style="--d:1.5s">84%</text><text class="tl a" x="84" y="198" style="text-anchor:end;--d:1.2s">Hinglish</text><rect x="90" y="184" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="184" width="73.5" height="10" rx="3" class="bar grow warn" style="--d:1.3s"/><text class="mono l a" x="306" y="193" style="--d:1.4s">35%</text><rect x="90" y="196" width="210" height="10" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="196" width="168" height="10" rx="3" class="bar grow pass" style="--d:1.5s"/><text class="mono l a" x="306" y="205" style="--d:1.5999999999999999s">80%</text><g class="a" style="--d:1.8s"><rect class="bx warn" x="8" y="216" width="344" height="22" rx="6"/><text class="tl" x="180" y="231" text-anchor="middle">overall 54.8% hid a Hindi slice at 8%</text></g></svg>