<svg viewBox="0 0 360 234" role="img" aria-label="A single-vector model compresses each passage into one vector. Late interaction keeps one vector per token: each query token finds its best-matching passage token, and the scores are summed, called MaxSim. ColPali applies the same idea to patches of a page image, with no OCR."><text class="tl l a" x="6" y="14" style="--d:0s">Single vector: one summary per passage</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="22" width="120" height="24" rx="6"/><text class="mono" x="66" y="38" text-anchor="middle">query → 1 vector</text></g><text class="mono l a" x="136" y="38" style="--d:0.15s">·</text><g class="a" style="--d:0.2s"><rect class="bx soft" x="150" y="22" width="204" height="24" rx="6"/><text class="mono" x="252" y="38" text-anchor="middle">passage → 1 vector</text></g><text class="tl l a" x="6" y="70" style="--d:0.4s">Late interaction: one vector per token</text><g class="a" style="--d:0.5s"><rect class="bx acc" x="6" y="78" width="80" height="22" rx="6"/><text class="mono" x="46" y="93" text-anchor="middle">GST</text></g><g class="a" style="--d:0.6s"><rect class="bx acc" x="6" y="104" width="80" height="22" rx="6"/><text class="mono" x="46" y="119" text-anchor="middle">invoice</text></g><g class="a" style="--d:0.7s"><rect class="bx acc" x="6" y="130" width="80" height="22" rx="6"/><text class="mono" x="46" y="145" text-anchor="middle">download</text></g><g class="a" style="--d:0.6s"><rect class="bx soft" x="250" y="78" width="104" height="18" rx="6"/><text class="mono" x="302" y="91" text-anchor="middle">Tax</text></g><g class="a" style="--d:0.6799999999999999s"><rect class="bx soft" x="250" y="98" width="104" height="18" rx="6"/><text class="mono" x="302" y="111" text-anchor="middle">documents</text></g><g class="a" style="--d:0.76s"><rect class="bx pass" x="250" y="118" width="104" height="18" rx="6"/><text class="mono" x="302" y="131" text-anchor="middle">GST</text></g><g class="a" style="--d:0.84s"><rect class="bx pass" x="250" y="138" width="104" height="18" rx="6"/><text class="mono" x="302" y="151" text-anchor="middle">invoice</text></g><g class="a" style="--d:0.9199999999999999s"><rect class="bx soft" x="250" y="158" width="104" height="18" rx="6"/><text class="mono" x="302" y="171" text-anchor="middle">Reports</text></g><g class="a" style="--d:1s"><path d="M86 89 L250 127 M86 115 L250 147 M86 141 L250 167" class="ln acc"/></g><text class="tl l a" x="96" y="196" style="--d:1.2s">score = sum of each query token’s best match (MaxSim)</text><g class="a" style="--d:1.4s"><rect class="bx warn" x="6" y="206" width="348" height="22" rx="6"/><text class="tl" x="180" y="221" text-anchor="middle">ColPali: the same idea over page-image patches, no OCR</text></g></svg>