<svg viewBox="0 0 360 222" role="img" aria-label="During contrastive training the positive example moves toward the anchor and negatives, including a hard negative, move away."><circle class="a" cx="180" cy="110" r="40" style="fill:none;stroke:var(--pass);stroke-dasharray:3 3;--d:.2s"/><g class="a" style="--d:0s"><circle cx="180" cy="110" r="9" style="fill:var(--accent)"/><text class="sb" x="180" y="134">anchor</text></g><g class="mv" style="--dx:-88px;--dy:34px;--d:1.1s"><g class="a" style="--d:0.3s"><circle cx="296" cy="54" r="8" style="fill:var(--pass)"/><text class="sb" x="296" y="41">positive</text></g></g><g class="mv" style="--dx:-62px;--dy:-34px;--d:1.2000000000000002s"><g class="a" style="--d:0.42s"><circle cx="122" cy="64" r="8" style="fill:var(--fail)"/><text class="sb" x="122" y="51">negative</text></g></g><g class="mv" style="--dx:74px;--dy:40px;--d:1.3s"><g class="a" style="--d:0.54s"><circle cx="222" cy="154" r="8" style="fill:var(--warn)"/><text class="sb" x="222" y="141">hard negative</text></g></g><g class="mv" style="--dx:-52px;--dy:36px;--d:1.4000000000000001s"><g class="a" style="--d:0.6599999999999999s"><circle cx="96" cy="160" r="8" style="fill:var(--fail)"/><text class="sb" x="96" y="147">negative</text></g></g><text class="tl m a" x="180" y="214" style="--d:2.2s">Training pulls true matches in and pushes look-alikes out</text></svg>