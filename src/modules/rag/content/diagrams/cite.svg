<svg viewBox="0 0 360 236" role="img" aria-label="A staff member asks about paternity leave. Two versions of the leave policy are retrieved; the 2023 version is superseded and filtered out. The answer cites the 2026 policy after each sentence. The system checks that the cited text, 10 working days, appears in that source; a sentence with no source would be dropped. The answer ends with the source and its effective date."><g class="a" style="--d:0s"><rect class="bx " x="6" y="8" width="348" height="24" rx="6"/><text class="tl" x="180" y="24" text-anchor="middle">“How many days of paternity leave do I get?”</text></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="6" y="40" width="170" height="24" rx="6"/><text class="mono" x="91" y="56" text-anchor="middle">[S1] Leave §5 · 2026</text></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="184" y="40" width="170" height="24" rx="6"/><text class="mono" x="269" y="56" text-anchor="middle">[S2] Leave §5 · 2023</text></g><g class="a" style="--d:0.45s"><rect class="bx fail" x="184" y="68" width="170" height="20" rx="6"/><text class="tl" x="269" y="82" text-anchor="middle">superseded → filtered</text></g><g class="a" style="--d:.6s"><rect class="bx" x="6" y="96" width="348" height="48" rx="6"/><text class="tl l" x="16" y="115" style="fill:var(--ink)">You get 10 working days of paternity leave [S1],</text><text class="tl l" x="16" y="132" style="fill:var(--ink)">to be taken within 3 months of the birth [S1].</text></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="6" y="152" width="230" height="22" rx="6"/><text class="tl" x="121" y="167" text-anchor="middle">“10 working days” found in S1</text></g><g class="a" style="--d:1s"><circle cx="248" cy="163" r="9" class="bd-pass"/><path d="M244 163l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:1.1s"><rect class="bx warn" x="6" y="180" width="230" height="22" rx="6"/><text class="tl" x="121" y="195" text-anchor="middle">no source → sentence dropped</text></g><g class="a" style="--d:1.3s"><rect class="bx soft" x="6" y="208" width="348" height="22" rx="6"/><text class="tl" x="180" y="223" text-anchor="middle">Sources: Leave policy §5, effective 1 Apr 2026</text></g></svg>