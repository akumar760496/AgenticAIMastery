<svg viewBox="0 0 360 228" role="img" aria-label="Each page of a loan PDF is checked for a text layer. If there is one, the text is extracted; if not, the page is a scan and goes to OCR in English and Hindi. Layout detection puts two columns in reading order, tables become Markdown rows with headers, running headers and footers are dropped, and page and section numbers are kept for citations. Near-empty pages go to a review queue."><g class="a" style="--d:0s"><rect class="bx " x="6" y="8" width="108" height="26" rx="6"/><text class="tl" x="60" y="25" text-anchor="middle">loan_2023.pdf</text></g><text class="tl l a" x="6" y="48" style="--d:0.2s">per page:</text><g class="a" style="--d:0.3s"><rect class="bx soft" x="6" y="56" width="108" height="24" rx="6"/><text class="mono" x="60" y="72" text-anchor="middle">text layer?</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M116 68L132 48" marker-end="url(#arr)"/></g><g class="a" style="--d:0.45s"><rect class="bx pass" x="134" y="34" width="110" height="24" rx="6"/><text class="tl" x="189" y="50" text-anchor="middle">yes → extract</text></g><g class="a" style="--d:0.5s"><path class="ln " d="M116 68L132 88" marker-end="url(#arr)"/></g><g class="a" style="--d:0.55s"><rect class="bx warn" x="134" y="76" width="110" height="24" rx="6"/><text class="tl" x="189" y="92" text-anchor="middle">no → OCR</text></g><g class="a" style="--d:0.65s"><rect class="bx soft" x="250" y="34" width="104" height="24" rx="6"/><text class="mono" x="302" y="50" text-anchor="middle">layout order</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="250" y="76" width="104" height="24" rx="6"/><text class="mono" x="302" y="92" text-anchor="middle">eng + hin</text></g><text class="tl l a" x="6" y="124" style="--d:0.8s">Structure kept</text><g class="a" style="--d:0.9s"><rect class="bx acc" x="6" y="132" width="170" height="24" rx="6"/><text class="mono" x="91" y="148" text-anchor="middle">| Tenure | Rate |</text></g><g class="a" style="--d:1s"><rect class="bx acc" x="184" y="132" width="170" height="24" rx="6"/><text class="mono" x="269" y="148" text-anchor="middle">two columns in order</text></g><g class="a" style="--d:1.1s"><rect class="bx acc" x="6" y="162" width="170" height="24" rx="6"/><text class="tl" x="91" y="178" text-anchor="middle">headers, footers dropped</text></g><g class="a" style="--d:1.2s"><rect class="bx acc" x="184" y="162" width="170" height="24" rx="6"/><text class="tl" x="269" y="178" text-anchor="middle">page 7 · §4.2 kept</text></g><g class="a" style="--d:1.4s"><rect class="bx warn" x="6" y="196" width="348" height="24" rx="6"/><text class="tl" x="180" y="212" text-anchor="middle">near-empty page → review queue</text></g></svg>