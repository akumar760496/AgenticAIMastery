<svg viewBox="0 0 360 230" role="img" aria-label="Fixed 1,024-token chunks cut a policy clause in half, so the exception to the pre-existing disease exclusion lands in another chunk. Chunking by clause at about 400 tokens, with the section path prepended to each chunk, keeps the rule and its exception together. The search matches the small chunk and returns the whole clause."><text class="tl l a" x="6" y="16" style="--d:0s">Fixed 1,024 tokens</text><g class="a" style="--d:.1s"><rect class="bx soft" x="6" y="24" width="348" height="30" rx="5"/><line x1="186" x2="186" y1="24" y2="54" class="ln fail" style="stroke-width:2"/></g><text class="mono l a" x="14" y="43" style="--d:0.2s">§4.2 pre-existing …</text><text class="mono l a" x="196" y="43" style="--d:0.25s">… except after 36 months</text><g class="a" style="--d:0.35s"><rect class="bx fail" x="6" y="58" width="348" height="20" rx="6"/><text class="tl" x="180" y="72" text-anchor="middle">cut mid-clause: the exception lands in another chunk</text></g><text class="tl l a" x="6" y="100" style="--d:0.5s">By clause, 400 tokens, with the section path</text><g class="a" style="--d:0.6s"><rect class="bx pass" x="6" y="108" width="348" height="26" rx="5"/><text class="mono" x="14" y="125">[Excl › 4.2]</text><text class="tl l" x="104" y="125">pre-existing … except after 36 months</text></g><g class="a" style="--d:0.75s"><rect class="bx " x="6" y="138" width="348" height="26" rx="5"/><text class="mono" x="14" y="155">[Excl › 4.3]</text><text class="tl l" x="104" y="155">cosmetic treatment …</text></g><g class="a" style="--d:0.8999999999999999s"><rect class="bx " x="6" y="168" width="348" height="26" rx="5"/><text class="mono" x="14" y="185">[Defs › 2.7]</text><text class="tl l" x="104" y="185">pre-existing disease means …</text></g><g class="a" style="--d:1.2s"><rect class="bx acc" x="6" y="202" width="348" height="22" rx="6"/><text class="tl" x="180" y="217" text-anchor="middle">search the small chunk · return the whole clause</text></g></svg>