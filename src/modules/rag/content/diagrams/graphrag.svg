<svg viewBox="0 0 360 210" role="img" aria-label="An LLM extracts entities and relations from 5,000 reports into a graph, which is clustered into communities with a summary each. Local search walks the neighbours of entities in the question; global search combines community summaries to answer questions about the whole corpus."><g class="a" style="--d:0s"><rect class="bx soft" x="6" y="8" width="100" height="24" rx="6"/><text class="mono" x="56" y="24" text-anchor="middle">5,000 reports</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M108 20L122 20" marker-end="url(#arr)"/></g><g class="a" style="--d:0.15s"><rect class="bx acc" x="124" y="8" width="110" height="24" rx="6"/><text class="mono" x="179" y="24" text-anchor="middle">LLM extracts</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M236 20L250 20" marker-end="url(#arr)"/></g><g class="a" style="--d:0.25s"><rect class="bx acc" x="252" y="8" width="102" height="24" rx="6"/><text class="mono" x="303" y="24" text-anchor="middle">graph</text></g><g class="a" style="--d:.4s"><path d="M60 70 L110 56 L150 90 L90 110 Z M150 90 L230 64 M230 64 L280 96 L250 124 M280 96 L310 58" class="ln"/></g><circle cx="60" cy="70" r="7" class="bx acc a" style="--d:0.45s"/><circle cx="110" cy="56" r="7" class="bx acc a" style="--d:0.5s"/><circle cx="150" cy="90" r="7" class="bx acc a" style="--d:0.55s"/><circle cx="90" cy="110" r="7" class="bx acc a" style="--d:0.6000000000000001s"/><circle cx="230" cy="64" r="7" class="bx warn a" style="--d:0.65s"/><circle cx="280" cy="96" r="7" class="bx warn a" style="--d:0.7s"/><circle cx="250" cy="124" r="7" class="bx warn a" style="--d:0.75s"/><circle cx="310" cy="58" r="7" class="bx warn a" style="--d:0.8s"/><text class="mono l a" x="56" y="140" style="--d:0.8s">community A</text><text class="mono l a" x="240" y="146" style="--d:0.85s">community B</text><g class="a" style="--d:1s"><rect class="bx pass" x="6" y="156" width="168" height="24" rx="6"/><text class="tl" x="90" y="172" text-anchor="middle">local: entity neighbours</text></g><g class="a" style="--d:1.1s"><rect class="bx warn" x="186" y="156" width="168" height="24" rx="6"/><text class="tl" x="270" y="172" text-anchor="middle">global: community summaries</text></g><text class="tl l a" x="6" y="202" style="--d:1.3s">Vector RAG finds passages; GraphRAG answers across them</text></svg>