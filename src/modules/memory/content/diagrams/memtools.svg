<svg viewBox="0 0 360 200" role="img" aria-label="Session 1 writes progress to a memory file; after the context resets, session 2 reads it and resumes at item 13. A path that escapes the memory root is blocked."><text class="tl l a" x="6" y="14" style="--d:0s">Session 1</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="20" width="104" height="24" rx="6"/><text class="mono" x="58" y="36" text-anchor="middle">view /memories</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M112 32L126 32" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx " x="128" y="20" width="82" height="24" rx="6"/><text class="mono" x="169" y="36" text-anchor="middle">items 1–12</text></g><g class="a" style="--d:0.45s"><path class="ln " d="M212 32L226 32" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="228" y="20" width="126" height="24" rx="6"/><text class="mono" x="291" y="36" text-anchor="middle">create progress.md</text></g><g class="a" style="--d:.8s"><line x1="6" x2="352" y1="60" y2="60" class="ln" style="stroke-dasharray:5 4"/><text class="tag-t" x="180" y="74" style="fill:var(--ink-2)">context resets</text></g><text class="tl l a" x="6" y="96" style="--d:1s">Session 2</text><g class="a" style="--d:1.1s"><rect class="bx acc" x="6" y="102" width="112" height="24" rx="6"/><text class="mono" x="62" y="118" text-anchor="middle">view progress.md</text></g><g class="a" style="--d:1.25s"><path class="ln " d="M120 114L132 114" marker-end="url(#arr)"/></g><g class="a" style="--d:1.3s"><rect class="bx pass" x="134" y="102" width="82" height="24" rx="6"/><text class="mono" x="175" y="118" text-anchor="middle">resume at 13</text></g><g class="a" style="--d:1.45s"><path class="ln " d="M218 114L226 114" marker-end="url(#arr)"/></g><g class="a" style="--d:1.5s"><rect class="bx acc" x="228" y="102" width="126" height="24" rx="6"/><text class="mono" x="291" y="118" text-anchor="middle">str_replace 24/30</text></g><g class="a" style="--d:1.8s"><rect class="bx fail" x="6" y="142" width="250" height="24" rx="6"/><text class="mono" x="131" y="158" text-anchor="middle">/memories/../config.env</text></g><g class="a" style="--d:2s"><circle cx="270" cy="154" r="9" class="bd-fail"/><path d="M266.5 150.5l7 7M273.5 150.5l-7 7" class="bd-mark"/></g><g class="a" style="--d:2.0s"><text class="tag-t fail" x="286" y="158" style="text-anchor:start">blocked</text></g><text class="tl m a" x="180" y="190" style="--d:2.2s">Resolve the path, then check it stays under the root</text></svg>