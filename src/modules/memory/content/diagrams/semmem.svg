ight="14" rx="3" class="skel" style="opacity:.45"/><rect x="118" y="158" width="1.5" height="14" rx="3" class="bar grow pass" style="--d:1.9s"/><text class="mono a" x="126" y="169" style="--d:2.1s">180 tokens</text><g class="a" style="--d:2.2s"><rect class="bx soft" x="6" y="186" width="346" height="24" rx="6"/><text class="mono" x="179" y="202" text-anchor="middle">namespace (“wealth”, “inv-2231”) · one per user</text></g></svg>