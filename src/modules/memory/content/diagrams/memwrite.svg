<svg viewBox="0 0 360 220" role="img" aria-label="Of ten candidate memories four are saved, three sensitive ones are blocked and one old address is invalidated. An erasure removes rows, vectors, the summary and the cache, keeping one audit line."><text class="tl l a" x="6" y="14" style="--d:0s">10 candidate memories</text><g class="a" style="--d:0.05s"><rect class="bx soft" x="6" y="20" width="66" height="22" rx="6"/><text class="mono" x="39" y="35" text-anchor="middle">Hindi</text></g><g class="a" style="--d:0.1s"><rect class="bx soft" x="76" y="20" width="66" height="22" rx="6"/><text class="mono" x="109" y="35" text-anchor="middle">email</text></g><g class="a" style="--d:0.15000000000000002s"><rect class="bx soft" x="146" y="20" width="66" height="22" rx="6"/><text class="mono" x="179" y="35" text-anchor="middle">SMS off</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="216" y="20" width="66" height="22" rx="6"/><text class="mono" x="249" y="35" text-anchor="middle">OTP</text></g><g class="a" style="--d:0.25s"><rect class="bx soft" x="286" y="20" width="66" height="22" rx="6"/><text class="mono" x="319" y="35" text-anchor="middle">PAN</text></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="6" y="48" width="66" height="22" rx="6"/><text class="mono" x="39" y="63" text-anchor="middle">new addr</text></g><g class="a" style="--d:0.35000000000000003s"><rect class="bx soft" x="76" y="48" width="66" height="22" rx="6"/><text class="mono" x="109" y="63" text-anchor="middle">old addr</text></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="146" y="48" width="66" height="22" rx="6"/><text class="mono" x="179" y="63" text-anchor="middle">app crash</text></g><g class="a" style="--d:0.45s"><rect class="bx soft" x="216" y="48" width="66" height="22" rx="6"/><text class="mono" x="249" y="63" text-anchor="middle">gold rate</text></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="286" y="48" width="66" height="22" rx="6"/><text class="mono" x="319" y="63" text-anchor="middle">hospital</text></g><g class="a" style="--d:.8s"><rect class="bx pass" x="6" y="20" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx pass" x="76" y="20" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx pass" x="146" y="20" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx fail" x="216" y="20" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx fail" x="286" y="20" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx pass" x="6" y="48" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx warn" x="76" y="48" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/><rect class="bx fail" x="286" y="48" width="66" height="22" rx="6" style="fill:none;stroke-width:2"/></g><g class="a" style="--d:1.0s"><text class="tl l" x="6" y="92"><tspan style="fill:var(--pass)">4 saved</tspan> · <tspan style="fill:var(--fail)">3 blocked</tspan> · <tspan style="fill:var(--warn)">1 invalidated</tspan> · 2 one-offs skipped</text></g><text class="tl l a" x="6" y="118" style="--d:1.2s">Erasure request</text><g class="a" style="--d:1.3s"><rect class="bx " x="6" y="126" width="82" height="24" rx="6"/><text class="mono" x="47" y="142" text-anchor="middle">rows 4</text></g><g class="a" style="--d:1.5s"><circle cx="80" cy="126" r="9" class="bd-pass"/><path d="M76 126l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:1.42s"><rect class="bx " x="94" y="126" width="82" height="24" rx="6"/><text class="mono" x="135" y="142" text-anchor="middle">vectors 4</text></g><g class="a" style="--d:1.62s"><circle cx="168" cy="126" r="9" class="bd-pass"/><path d="M164 126l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:1.54s"><rect class="bx " x="182" y="126" width="82" height="24" rx="6"/><text class="mono" x="223" y="142" text-anchor="middle">summary 1</text></g><g class="a" style="--d:1.74s"><circle cx="256" cy="126" r="9" class="bd-pass"/><path d="M252 126l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:1.6600000000000001s"><rect class="bx " x="270" y="126" width="82" height="24" rx="6"/><text class="mono" x="311" y="142" text-anchor="middle">cache 1</text></g><g class="a" style="--d:1.8599999999999999s"><circle cx="344" cy="126" r="9" class="bd-pass"/><path d="M340 126l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:2s"><rect class="bx acc" x="6" y="166" width="346" height="24" rx="6"/><text class="mono" x="179" y="182" text-anchor="middle">audit log keeps 1 line: erasure · user · count · time</text></g><text class="tl m a" x="180" y="212" style="--d:2.2s">Delete every copy; keep proof of deletion, not the data</text></svg>