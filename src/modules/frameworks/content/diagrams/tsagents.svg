<svg viewBox="0 0 360 204" role="img" aria-label="TypeScript agents usually have two layers: the Vercel AI SDK for model calls, streaming and Zod-typed tools across providers, and Mastra on top for agents, workflows that can suspend and resume, memory and evals. They run in Next.js routes with a useChat UI or in Node workers. The same UPI-dispute agent takes 24 lines."><text class="tl l a" x="6" y="14" style="--d:0s">TypeScript agents: two layers</text><g class="a " style="--d:0.1s"><rect class="bx acc" x="6" y="22" width="348" height="52" rx="7"/><text class="lb" x="180" y="45">Vercel AI SDK</text><text class="sb" x="180" y="60">generateText · streamText · tool() with Zod · any provider</text></g><g class="a " style="--d:0.3s"><rect class="bx " x="6" y="82" width="348" height="52" rx="7"/><text class="lb" x="180" y="105">Mastra (on top of the AI SDK)</text><text class="sb" x="180" y="120">agents · workflows with suspend/resume · memory · evals</text></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="6" y="144" width="110" height="22" rx="6"/><text class="mono" x="61" y="159" text-anchor="middle">Next.js route</text></g><g class="a" style="--d:0.6s"><rect class="bx soft" x="124" y="144" width="110" height="22" rx="6"/><text class="mono" x="179" y="159" text-anchor="middle">useChat UI</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="242" y="144" width="112" height="22" rx="6"/><text class="mono" x="298" y="159" text-anchor="middle">Node worker</text></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="6" y="174" width="348" height="24" rx="6"/><text class="tl" x="180" y="190" text-anchor="middle">same UPI-dispute agent: 24 lines</text></g></svg>