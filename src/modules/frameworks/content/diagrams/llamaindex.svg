<svg viewBox="0 0 360 204" role="img" aria-label="LlamaIndex has a data layer of readers, the LlamaParse parser, indexes and query engines, and an agent layer of FunctionAgent, multi-agent AgentWorkflow and event-driven workflows. A query engine becomes a tool for the agent, and a run’s Context can be saved and resumed. The same UPI-dispute agent, with NPCI rules retrieval, takes 27 lines."><text class="tl l a" x="6" y="14" style="--d:0s">LlamaIndex: data layer + agent layer</text><g class="a " style="--d:0.1s"><rect class="bx acc" x="6" y="22" width="348" height="52" rx="7"/><text class="lb" x="180" y="45">Data</text><text class="sb" x="180" y="60">readers · LlamaParse · indexes · query engines</text></g><g class="a " style="--d:0.3s"><rect class="bx " x="6" y="82" width="348" height="52" rx="7"/><text class="lb" x="180" y="105">Agents and Workflows</text><text class="sb" x="180" y="120">FunctionAgent · AgentWorkflow · event-driven steps · Context</text></g><g class="a" style="--d:0.5s"><rect class="bx pass" x="6" y="144" width="168" height="22" rx="6"/><text class="tl" x="90" y="159" text-anchor="middle">query engine as a tool</text></g><g class="a" style="--d:0.6s"><rect class="bx soft" x="186" y="144" width="168" height="22" rx="6"/><text class="tl" x="270" y="159" text-anchor="middle">save Context, resume later</text></g><g class="a" style="--d:0.8s"><rect class="bx pass" x="6" y="174" width="348" height="24" rx="6"/><text class="tl" x="180" y="190" text-anchor="middle">same UPI-dispute agent + NPCI rules: 27 lines</text></g></svg>