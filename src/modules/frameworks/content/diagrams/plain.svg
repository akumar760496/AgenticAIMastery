<svg viewBox="0 0 360 214" role="img" aria-label="A plain agent loop calls the model with messages and tools, checks the stop reason, runs any requested tools behind an approval gate, and loops. It is about 45 lines with no extra dependencies, but you own retries, persistence, resume, tracing, streaming and parallel tool calls. Start here and add a framework when a need appears."><g class="a " style="--d:0s"><rect class="bx " x="8" y="6" width="150" height="40" rx="7"/><text class="lb" x="83" y="23">call the model</text><text class="sb" x="83" y="38">messages + tools</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M160 26L190 26" marker-end="url(#arr)"/></g><g class="a " style="--d:0.3s"><rect class="bx acc" x="192" y="6" width="160" height="40" rx="7"/><text class="lb" x="272" y="23">stop_reason?</text><text class="sb" x="272" y="38">tool_use or end</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M272 48L272 66" marker-end="url(#arr)"/></g><g class="a " style="--d:0.5s"><rect class="bx warn" x="192" y="68" width="160" height="40" rx="7"/><text class="lb" x="272" y="85">run the tools</text><text class="sb" x="272" y="100">approval gate here</text></g><path class="ln a" d="M192 88 H84 V48" style="--d:.6s" marker-end="url(#arr)"/><text class="tl l a" x="8" y="136" style="--d:0.8s">About 45 lines, no dependencies beyond the SDK.</text><text class="tl l a" x="8" y="154" style="--d:0.9s">You also own: retries, persistence, resume,</text><text class="tl l a" x="8" y="170" style="--d:0.95s">tracing, streaming, parallel tool calls.</text><g class="a" style="--d:1.1s"><rect class="bx pass" x="8" y="182" width="344" height="24" rx="6"/><text class="tl" x="180" y="198" text-anchor="middle">start here; add a framework when a need appears</text></g></svg>