<svg viewBox="0 0 360 202" role="img" aria-label="Google’s Agent Development Kit composes LLM agents with workflow agents: sequential, parallel and loop. A runner and session service hold state. It supports Python, TypeScript, Go, Java and Kotlin, has a web UI and evaluation command, deploys to Cloud Run or Agent Engine, and speaks A2A to agents in other frameworks."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="344" height="36" rx="7"/><text class="lb" x="180" y="21">SequentialAgent</text><text class="sb" x="180" y="36">run sub-agents in order</text></g><g class="a " style="--d:0.2s"><rect class="bx " x="8" y="50" width="110" height="36" rx="7"/><text class="lb" x="63" y="65">ParallelAgent</text><text class="sb" x="63" y="80">fan out</text></g><g class="a " style="--d:0.3s"><rect class="bx " x="125" y="50" width="110" height="36" rx="7"/><text class="lb" x="180" y="65">LoopAgent</text><text class="sb" x="180" y="80">until done</text></g><g class="a " style="--d:0.4s"><rect class="bx pass" x="242" y="50" width="110" height="36" rx="7"/><text class="lb" x="297" y="65">LlmAgent</text><text class="sb" x="297" y="80">model + tools</text></g><text class="tl l a" x="8" y="108" style="--d:0.6s">Runner + SessionService hold state</text><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="116" width="344" height="22" rx="6"/><text class="mono" x="180" y="131" text-anchor="middle">Python · TypeScript · Go · Java · Kotlin</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="8" y="144" width="344" height="22" rx="6"/><text class="tl" x="180" y="159" text-anchor="middle">adk web · adk eval · deploy to Cloud Run or Agent Engine</text></g><g class="a" style="--d:0.9s"><rect class="bx acc" x="8" y="172" width="344" height="22" rx="6"/><text class="tl" x="180" y="187" text-anchor="middle">A2A to agents in other frameworks</text></g></svg>