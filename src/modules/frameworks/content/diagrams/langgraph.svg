<svg viewBox="0 0 360 210" role="img" aria-label="LangGraph runs the agent as a graph of nodes, such as a model node and a tool node, with an interrupt that waits for a human. A checkpointer saves every step for a thread, so after a crash or a pause at step 5 the run resumes from step 4, even hours later, with a resume command carrying the approval."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="100" height="36" rx="7"/><text class="lb" x="58" y="21">agent</text><text class="sb" x="58" y="36">model node</text></g><g class="a" style="--d:0.1s"><path class="ln " d="M110 24L130 24" marker-end="url(#arr)"/></g><g class="a " style="--d:0.2s"><rect class="bx " x="132" y="6" width="100" height="36" rx="7"/><text class="lb" x="182" y="21">tools</text><text class="sb" x="182" y="36">tool node</text></g><path class="ln a" d="M182 44 V56 H58 V44" style="--d:.3s" marker-end="url(#arr)"/><g class="a " style="--d:0.4s"><rect class="bx warn" x="252" y="6" width="100" height="36" rx="7"/><text class="lb" x="302" y="21">interrupt</text><text class="sb" x="302" y="36">wait for human</text></g><g class="a" style="--d:0.35s"><path class="ln " d="M234 24L250 24" marker-end="url(#arr)"/></g><text class="tl l a" x="8" y="80" style="--d:0.5s">Each step saved by the checkpointer</text><g class="a" style="--d:0.6s"><rect class="bx pass" x="8" y="88" width="62" height="22" rx="6"/><text class="mono" x="39" y="103" text-anchor="middle">step 1</text></g><g class="a" style="--d:0.6799999999999999s"><rect class="bx pass" x="78" y="88" width="62" height="22" rx="6"/><text class="mono" x="109" y="103" text-anchor="middle">step 2</text></g><g class="a" style="--d:0.76s"><rect class="bx pass" x="148" y="88" width="62" height="22" rx="6"/><text class="mono" x="179" y="103" text-anchor="middle">step 3</text></g><g class="a" style="--d:0.84s"><rect class="bx pass" x="218" y="88" width="62" height="22" rx="6"/><text class="mono" x="249" y="103" text-anchor="middle">step 4</text></g><g class="a" style="--d:0.9199999999999999s"><rect class="bx soft" x="288" y="88" width="62" height="22" rx="6"/><text class="mono" x="319" y="103" text-anchor="middle">step 5</text></g><text class="tl l a" x="8" y="136" style="--d:1s">Crash or pause at step 5: resume from step 4</text><g class="a" style="--d:1.1s"><rect class="bx soft" x="8" y="146" width="344" height="22" rx="6"/><text class="mono" x="180" y="161" text-anchor="middle">thread_id = case-8812 · Postgres checkpointer</text></g><g class="a" style="--d:1.2s"><rect class="bx acc" x="8" y="176" width="344" height="24" rx="6"/><text class="tl" x="180" y="192" text-anchor="middle">resume hours later: Command(resume="approve")</text></g></svg>