<svg viewBox="0 0 360 210" role="img" aria-label="The Claude Agent SDK packages the Claude Code harness as a library, with built-in tools such as Read, Write, Bash and WebFetch, plus your own tools served from an in-process MCP server. A PreToolUse hook can deny a dispute unless a reviewer approved it, and allowed tools, permission mode and turn limits set its boundaries. It runs Claude models only and is strongest for autonomous work needing files, code and a shell."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="344" height="40" rx="7"/><text class="lb" x="180" y="23">Claude Agent SDK</text><text class="sb" x="180" y="38">the Claude Code harness as a library</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="8" y="54" width="80" height="22" rx="6"/><text class="mono" x="48" y="69" text-anchor="middle">Read</text></g><g class="a" style="--d:0.26s"><rect class="bx soft" x="95" y="54" width="80" height="22" rx="6"/><text class="mono" x="135" y="69" text-anchor="middle">Write</text></g><g class="a" style="--d:0.32s"><rect class="bx soft" x="182" y="54" width="80" height="22" rx="6"/><text class="mono" x="222" y="69" text-anchor="middle">Bash</text></g><g class="a" style="--d:0.38s"><rect class="bx soft" x="269" y="54" width="80" height="22" rx="6"/><text class="mono" x="309" y="69" text-anchor="middle">WebFetch</text></g><g class="a" style="--d:0.5s"><rect class="bx pass" x="8" y="84" width="344" height="22" rx="6"/><text class="mono" x="180" y="99" text-anchor="middle">your tools: in-process MCP server “bank”</text></g><g class="a" style="--d:0.6s"><rect class="bx warn" x="8" y="114" width="344" height="22" rx="6"/><text class="tl" x="180" y="129" text-anchor="middle">PreToolUse hook: deny raise_dispute unless approved</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="144" width="344" height="22" rx="6"/><text class="mono" x="180" y="159" text-anchor="middle">allowed_tools · permission_mode · max_turns</text></g><text class="tl l a" x="8" y="186" style="--d:0.9s">Claude models only; strongest for autonomous work</text><text class="tl l a" x="8" y="202" style="--d:0.95s">that needs files, code and a shell.</text></svg>