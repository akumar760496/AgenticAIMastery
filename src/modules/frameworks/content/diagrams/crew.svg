<svg viewBox="0 0 360 196" role="img" aria-label="CrewAI defines agents by role, goal and backstory, gives each a task, and runs them as a crew, sequentially or with a manager, with Flows for tighter control. Microsoft Agent Framework, version 1.0 from April 2026, merges AutoGen and Semantic Kernel for .NET and Python. Several agents cost several times the tokens of one."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="6" width="168" height="40" rx="7"/><text class="lb" x="92" y="23">Investigator</text><text class="sb" x="92" y="38">role, goal, backstory</text></g><g class="a " style="--d:0.1s"><rect class="bx acc" x="184" y="6" width="168" height="40" rx="7"/><text class="lb" x="268" y="23">Writer</text><text class="sb" x="268" y="38">role, goal, backstory</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M92 48L92 64" marker-end="url(#arr)"/></g><g class="a" style="--d:0.25s"><path class="ln " d="M268 48L268 64" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="8" y="66" width="168" height="22" rx="6"/><text class="mono" x="92" y="81" text-anchor="middle">Task: investigate</text></g><g class="a" style="--d:0.35s"><rect class="bx warn" x="184" y="66" width="168" height="22" rx="6"/><text class="tl" x="268" y="81" text-anchor="middle">Task: reply (human input)</text></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="8" y="96" width="344" height="22" rx="6"/><text class="mono" x="180" y="111" text-anchor="middle">Crew(process=sequential) · Flows for control</text></g><text class="tl l a" x="8" y="136" style="--d:0.7s">Microsoft Agent Framework (1.0, April 2026) merges</text><text class="tl l a" x="8" y="152" style="--d:0.75s">AutoGen and Semantic Kernel: .NET and Python.</text><g class="a" style="--d:0.9s"><rect class="bx warn" x="8" y="164" width="344" height="24" rx="6"/><text class="tl" x="180" y="180" text-anchor="middle">several agents cost several times the tokens</text></g></svg>