<svg viewBox="0 0 360 218" role="img" aria-label="Pydantic AI defines an agent with a model, a dependency type such as a bank client, and an output type. Tools get typed arguments, and the result is a validated Pydantic model; invalid output is sent back for a retry. It works with any major provider, and durable runs are available through Temporal, DBOS or Prefect."><g class="a" style="--d:0s"><rect class="bx acc" x="8" y="6" width="344" height="24" rx="6"/><text class="mono" x="180" y="22" text-anchor="middle">Agent(model, deps_type=Bank, output_type=Reply)</text></g><g class="a " style="--d:0.2s"><rect class="bx " x="8" y="40" width="168" height="44" rx="7"/><text class="lb" x="92" y="59">deps</text><text class="sb" x="92" y="74">bank client, injected</text></g><g class="a " style="--d:0.3s"><rect class="bx " x="184" y="40" width="168" height="44" rx="7"/><text class="lb" x="268" y="59">tools</text><text class="sb" x="268" y="74">typed arguments</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M180 86L180 102" marker-end="url(#arr)"/></g><g class="a " style="--d:0.5s"><rect class="bx pass" x="80" y="104" width="200" height="40" rx="7"/><text class="lb" x="180" y="121">Reply</text><text class="sb" x="180" y="136">validated Pydantic model</text></g><text class="tl l a" x="8" y="166" style="--d:0.7s">Invalid output is sent back for a retry</text><text class="tl l a" x="8" y="182" style="--d:0.8s">Any provider: "anthropic:…", "openai:…", "google:…"</text><g class="a" style="--d:1s"><rect class="bx soft" x="8" y="190" width="344" height="22" rx="6"/><text class="tl" x="180" y="205" text-anchor="middle">durable runs via Temporal, DBOS or Prefect</text></g></svg>