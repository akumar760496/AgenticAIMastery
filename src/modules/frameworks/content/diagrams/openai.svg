<svg viewBox="0 0 360 190" role="img" aria-label="In the OpenAI Agents SDK a triage agent on a small model hands off to a disputes agent with its own tools and instructions. An input guardrail can trip and stop the run, for example on a card number. Sessions keep conversation memory, and tracing is on by default. Other models work through LiteLLM, but it fits OpenAI models best."><g class="a " style="--d:0s"><rect class="bx " x="8" y="6" width="130" height="40" rx="7"/><text class="lb" x="73" y="23">Triage</text><text class="sb" x="73" y="38">small model</text></g><g class="a" style="--d:0.2s"><path class="ln acc" d="M140 26L168 26" marker-end="url(#arrA)"/></g><text class="sb a" x="154" y="18" style="--d:.2s">handoff</text><g class="a " style="--d:0.3s"><rect class="bx acc" x="170" y="6" width="182" height="40" rx="7"/><text class="lb" x="261" y="23">Disputes</text><text class="sb" x="261" y="38">tools + instructions</text></g><g class="a" style="--d:0.5s"><rect class="bx warn" x="8" y="58" width="344" height="22" rx="6"/><text class="tl" x="180" y="73" text-anchor="middle">input guardrail: card number? tripwire stops the run</text></g><g class="a" style="--d:0.6s"><rect class="bx soft" x="8" y="86" width="344" height="22" rx="6"/><text class="mono" x="180" y="101" text-anchor="middle">session: SQLiteSession("customer-4471")</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="114" width="344" height="22" rx="6"/><text class="tl" x="180" y="129" text-anchor="middle">tracing on by default</text></g><text class="mono l a" x="8" y="154" style="--d:0.9s">Runner.run_sync(triage, question, session=session)</text><text class="tl l a" x="8" y="178" style="--d:1s">Other models via LiteLLM; best with OpenAI’s own</text></svg>