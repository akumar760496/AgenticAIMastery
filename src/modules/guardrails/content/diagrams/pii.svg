<svg viewBox="0 0 360 250" role="img" aria-label="A Hinglish support message holds a PAN, an Aadhaar number, a phone number and a name. Regex with context words finds the PAN, regex plus the Verhoeff checksum finds the Aadhaar number, a regex finds the phone and a named-entity model finds the name. Each is replaced with a typed placeholder, so the model and the logs see only placeholders while the real values sit in a vault for 30 days. The reply restores only what this user is allowed to see."><g class="a" style="--d:0s"><rect class="bx " x="6" y="8" width="348" height="40" rx="6"/><text class="tl" x="180" y="32" text-anchor="middle"></text></g><g class="a" style="--d:.1s"><text class="tl l" x="16" y="25" style="fill:var(--ink)">“Mera PAN ABCPK1234F hai, Aadhaar 2345 6789 0124,</text><text class="tl l" x="16" y="40" style="fill:var(--ink)">call me on 98765 43210 — Priya Kulkarni”</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M180 50L180 64" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="6" y="68" width="72" height="24" rx="6"/><text class="mono" x="42" y="84" text-anchor="middle">PAN</text></g><g class="a" style="--d:0.55s"><rect class="bx " x="84" y="68" width="124" height="24" rx="6"/><text class="mono" x="146" y="84" text-anchor="middle">regex + context</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M210 80L222 80" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx acc" x="224" y="68" width="130" height="24" rx="6"/><text class="mono" x="289" y="84" text-anchor="middle">&lt;IN_PAN_1&gt;</text></g><g class="a" style="--d:0.65s"><rect class="bx soft" x="6" y="98" width="72" height="24" rx="6"/><text class="mono" x="42" y="114" text-anchor="middle">Aadhaar</text></g><g class="a" style="--d:0.7000000000000001s"><rect class="bx " x="84" y="98" width="124" height="24" rx="6"/><text class="mono" x="146" y="114" text-anchor="middle">regex + Verhoeff</text></g><g class="a" style="--d:0.75s"><path class="ln " d="M210 110L222 110" marker-end="url(#arr)"/></g><g class="a" style="--d:0.85s"><rect class="bx acc" x="224" y="98" width="130" height="24" rx="6"/><text class="mono" x="289" y="114" text-anchor="middle">&lt;IN_AADHAAR_1&gt;</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="6" y="128" width="72" height="24" rx="6"/><text class="mono" x="42" y="144" text-anchor="middle">phone</text></g><g class="a" style="--d:0.8500000000000001s"><rect class="bx " x="84" y="128" width="124" height="24" rx="6"/><text class="mono" x="146" y="144" text-anchor="middle">regex</text></g><g class="a" style="--d:0.8999999999999999s"><path class="ln " d="M210 140L222 140" marker-end="url(#arr)"/></g><g class="a" style="--d:1s"><rect class="bx acc" x="224" y="128" width="130" height="24" rx="6"/><text class="mono" x="289" y="144" text-anchor="middle"><PHONE_1></text></g><g class="a" style="--d:0.95s"><rect class="bx soft" x="6" y="158" width="72" height="24" rx="6"/><text class="mono" x="42" y="174" text-anchor="middle">name</text></g><g class="a" style="--d:1s"><rect class="bx " x="84" y="158" width="124" height="24" rx="6"/><text class="mono" x="146" y="174" text-anchor="middle">NER model</text></g><g class="a" style="--d:1.0499999999999998s"><path class="ln " d="M210 170L222 170" marker-end="url(#arr)"/></g><g class="a" style="--d:1.15s"><rect class="bx warn" x="224" y="158" width="130" height="24" rx="6"/><text class="mono" x="289" y="174" text-anchor="middle">&lt;PERSON_1&gt;</text></g><g class="a" style="--d:1.4s"><rect class="bx pass" x="6" y="192" width="168" height="24" rx="6"/><text class="tl" x="90" y="208" text-anchor="middle">model + logs: placeholders</text></g><g class="a" style="--d:1.5s"><rect class="bx warn" x="186" y="192" width="168" height="24" rx="6"/><text class="tl" x="270" y="208" text-anchor="middle">vault: real values, 30 days</text></g><g class="a" style="--d:1.7s"><rect class="bx soft" x="6" y="222" width="348" height="22" rx="6"/><text class="tl" x="180" y="237" text-anchor="middle">reply restores only what this user may see</text></g></svg>