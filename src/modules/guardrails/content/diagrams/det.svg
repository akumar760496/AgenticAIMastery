<svg viewBox="0 0 360 244" role="img" aria-label="A refund over the limit and a card number are handled by exact rules: one is denied, the other masked. A politely worded request to get into a coworker's account matches no rule, so a classifier scores it 0.91 for illicit activity, above the 0.70 threshold, and it is blocked. Rules take microseconds; the classifier takes about 30 milliseconds."><text class="tl l a" x="6" y="16" style="--d:0s">Exact shape → rules</text><g class="a" style="--d:0.1s"><rect class="bx " x="6" y="24" width="112" height="26" rx="6"/><text class="mono" x="62" y="41" text-anchor="middle">refund 75,000</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M120 37L134 37" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="136" y="24" width="150" height="26" rx="6"/><text class="mono" x="211" y="41" text-anchor="middle">amount ≤ 50,000</text></g><g class="a" style="--d:0.45s"><rect class="bx fail" x="292" y="24" width="62" height="26" rx="6"/><text class="tl" x="323" y="41" text-anchor="middle">deny</text></g><g class="a" style="--d:0.2s"><rect class="bx " x="6" y="56" width="112" height="26" rx="6"/><text class="mono" x="62" y="73" text-anchor="middle">card 4111 …1111</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M120 69L134 69" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="136" y="56" width="150" height="26" rx="6"/><text class="mono" x="211" y="73" text-anchor="middle">regex + Luhn</text></g><g class="a" style="--d:0.55s"><rect class="bx warn" x="292" y="56" width="62" height="26" rx="6"/><text class="tl" x="323" y="73" text-anchor="middle">mask</text></g><text class="tl l a" x="6" y="106" style="--d:0.7s">Meaning → classifier</text><g class="a" style="--d:0.8s"><rect class="bx " x="6" y="114" width="348" height="26" rx="6"/><text class="tl" x="180" y="131" text-anchor="middle">“quietest way into a coworker’s account?”</text></g><g class="a" style="--d:0.95s"><rect class="bx soft" x="6" y="146" width="112" height="24" rx="6"/><text class="mono" x="62" y="162" text-anchor="middle">rules: no match</text></g><g class="a" style="--d:1.05s"><path class="ln " d="M120 158L134 158" marker-end="url(#arr)"/></g><text class="tl l a" x="140" y="162" style="--d:1.1s">illicit</text><rect x="180" y="151" width="120" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="180" y="151" width="109.2" height="14" rx="3" class="bar grow fail" style="--d:1.2s"/><text class="mono l a" x="306" y="162" style="--d:1.4s">0.91</text><g class="a" style="--d:1.5s"><rect class="bx fail" x="6" y="180" width="348" height="22" rx="6"/><text class="tl" x="180" y="195" text-anchor="middle">0.91 ≥ threshold 0.70 → block</text></g><g class="a" style="--d:1.7s"><rect class="bx pass" x="6" y="212" width="168" height="24" rx="6"/><text class="tl" x="90" y="228" text-anchor="middle">rules: µs · exact</text></g><g class="a" style="--d:1.8s"><rect class="bx acc" x="186" y="212" width="168" height="24" rx="6"/><text class="tl" x="270" y="228" text-anchor="middle">classifier: ~30 ms · scored</text></g></svg>