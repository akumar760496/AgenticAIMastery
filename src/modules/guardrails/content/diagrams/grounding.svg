<svg viewBox="0 0 360 200" role="img" aria-label="A draft answer is split into claims and each is checked against the retrieved policy text. The waiting period is supported with a score of 0.93; the ₹40,000 limit scores 0.12 and is flagged. A small checker scores every claim, and only claims between 0.2 and 0.8 go to an LLM judge. Flagged answers are regenerated once, then replaced by a safe reply."><g class="a" style="--d:0s"><rect class="bx soft" x="6" y="8" width="348" height="24" rx="6"/><text class="tl" x="180" y="24" text-anchor="middle">Draft: covered after 2 years, ₹40,000 per eye</text></g><text class="tl l a" x="6" y="50" style="--d:0.2s">Split into claims, check each against the retrieved text</text><g class="a" style="--d:0.3s"><rect class="bx " x="6" y="58" width="200" height="22" rx="6"/><text class="tl" x="106" y="73" text-anchor="middle">2-year waiting period</text></g><g class="a" style="--d:0.4s"><rect class="bx pass" x="214" y="58" width="140" height="22" rx="6"/><text class="mono" x="284" y="73" text-anchor="middle">supported 0.93</text></g><g class="a" style="--d:0.5s"><rect class="bx " x="6" y="86" width="200" height="22" rx="6"/><text class="tl" x="106" y="101" text-anchor="middle">₹40,000 per eye</text></g><g class="a" style="--d:0.6s"><rect class="bx fail" x="214" y="86" width="140" height="22" rx="6"/><text class="mono" x="284" y="101" text-anchor="middle">supported 0.12</text></g><text class="tl l a" x="6" y="130" style="--d:0.8s">Small checker for every claim; LLM judge for the unsure band</text><g class="a" style="--d:0.9s"><rect class="bx pass" x="6" y="138" width="110" height="22" rx="6"/><text class="mono" x="61" y="153" text-anchor="middle">≥ 0.8 pass</text></g><g class="a" style="--d:1s"><rect class="bx warn" x="124" y="138" width="110" height="22" rx="6"/><text class="mono" x="179" y="153" text-anchor="middle">0.2–0.8 judge</text></g><g class="a" style="--d:1.1s"><rect class="bx fail" x="242" y="138" width="112" height="22" rx="6"/><text class="mono" x="298" y="153" text-anchor="middle">≤ 0.2 flag</text></g><g class="a" style="--d:1.3s"><rect class="bx acc" x="6" y="170" width="348" height="24" rx="6"/><text class="tl" x="180" y="186" text-anchor="middle">flagged → regenerate once → else “could not confirm”</text></g></svg>