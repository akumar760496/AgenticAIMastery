<svg viewBox="0 0 360 222" role="img" aria-label="The first request writes an 8,000-token prefix to cache; the second reuses it, cutting input cost from 10,200 to 1,000 units."><text class="tl a" style="text-anchor:start;--d:0s" x="6" y="20" style="--d:0s">Request 1: prefix written to cache</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="6" y="28" width="250" height="32" rx="5"/><text class="tl m" x="131" y="48" style="fill:var(--ink)">system + tools + docs · 8,000 tok</text></g><g class="a" style="--d:0.25s"><rect class="bx soft" x="260" y="28" width="94" height="32" rx="5"/><text class="tl m" x="307" y="48">user · 200 tok</text></g><text class="tl a" style="text-anchor:start;--d:0.6s" x="6" y="82" style="--d:0.6s">Request 2: same prefix, cache hit</text><g class="a" style="--d:0.7s"><rect class="bx pass" x="6" y="90" width="250" height="32" rx="5"/><text class="tl m" x="131" y="110" style="fill:var(--ink)">reused from cache · 8,000 tok</text></g><g class="a" style="--d:0.85s"><rect class="bx soft" x="260" y="90" width="94" height="32" rx="5"/><text class="tl m" x="307" y="110">user · 200 tok</text></g><text class="tl a" x="110" y="158" style="text-anchor:end;--d:1.1s">No caching</text><rect x="116" y="147" width="160" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="116" y="147" width="128.62745098039215" height="14" rx="3" class="bar grow " style="--d:1.2s"/><text class="mono a" style="--d:1.5s" x="282" y="158" style="--d:1.5s">8,200 units</text><text class="tl a" x="110" y="182" style="text-anchor:end;--d:1.25s">Request 1 (write)</text><rect x="116" y="171" width="160" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="116" y="171" width="160" height="14" rx="3" class="bar grow " style="--d:1.3499999999999999s"/><text class="mono a" style="--d:1.65s" x="282" y="182" style="--d:1.65s">10,200 units</text><text class="tl a" x="110" y="206" style="text-anchor:end;--d:1.4000000000000001s">Request 2 (hit)</text><rect x="116" y="195" width="160" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="116" y="195" width="15.686274509803921" height="14" rx="3" class="bar grow " style="--d:1.5s"/><text class="mono a" style="--d:1.8s" x="282" y="206" style="--d:1.8s">1,000 units</text></svg>