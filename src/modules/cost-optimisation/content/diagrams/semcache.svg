<svg viewBox="0 0 360 242" role="img" aria-label="A paraphrased question, activate roaming, is embedded and found to be 0.94 similar to a cached question, How do I turn on roaming, so the stored answer is served with no LLM call. An account question, what is my bill, skips the cache. Answers are served only if similarity is at least 0.90, the scope matches and the entry has not expired. Of 1,00,000 questions a day, 45,600 are answered from the cache and LLM calls fall to 54,400."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="150" height="24" rx="6"/><text class="tl" x="83" y="24" text-anchor="middle">“activate roaming?”</text></g><g class="a" style="--d:0.15s"><path class="ln " d="M160 20L170 20" marker-end="url(#arr)"/></g><g class="a" style="--d:0.25s"><rect class="bx " x="172" y="8" width="76" height="24" rx="6"/><text class="mono" x="210" y="24" text-anchor="middle">embed</text></g><g class="a" style="--d:0.35s"><path class="ln " d="M250 20L260 20" marker-end="url(#arr)"/></g><g class="a" style="--d:0.45s"><rect class="bx pass" x="262" y="8" width="90" height="24" rx="6"/><text class="mono" x="307" y="24" text-anchor="middle">sim 0.94</text></g><g class="a" style="--d:0.6s"><rect class="bx soft" x="8" y="40" width="244" height="24" rx="6"/><text class="tl" x="130" y="56" text-anchor="middle">nearest: “How do I turn on roaming?”</text></g><g class="a" style="--d:0.75s"><rect class="bx pass" x="262" y="40" width="90" height="24" rx="6"/><text class="tl" x="307" y="56" text-anchor="middle">hit · no LLM</text></g><g class="a" style="--d:0.9s"><rect class="bx soft" x="8" y="72" width="150" height="24" rx="6"/><text class="tl" x="83" y="88" text-anchor="middle">“what is my bill?”</text></g><g class="a" style="--d:1s"><path class="ln " d="M160 84L170 84" marker-end="url(#arr)"/></g><g class="a" style="--d:1.1s"><rect class="bx warn" x="172" y="72" width="76" height="24" rx="6"/><text class="tl" x="210" y="88" text-anchor="middle">account</text></g><g class="a" style="--d:1.2s"><path class="ln " d="M250 84L260 84" marker-end="url(#arr)"/></g><g class="a" style="--d:1.3s"><rect class="bx warn" x="262" y="72" width="90" height="24" rx="6"/><text class="tl" x="307" y="88" text-anchor="middle">skip cache</text></g><g class="a" style="--d:1.45s"><rect class="bx soft" x="8" y="104" width="344" height="22" rx="6"/><text class="tl" x="180" y="119" text-anchor="middle">serve only if similarity ≥ 0.90, same scope, not expired</text></g><text class="tl l a" x="8" y="148" style="--d:1.6s">LLM calls a day (1,00,000 questions)</text><text class="tl a" x="104" y="172" style="text-anchor:end;--d:1.7s">No cache</text><rect x="110" y="161" width="200" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="110" y="161" width="200" height="16" rx="3" class="bar grow " style="--d:1.8s"/><text class="mono l a" x="316" y="173" style="--d:2s">1,00,000</text><text class="tl a" x="104" y="200" style="text-anchor:end;--d:1.9s">Semantic cache</text><rect x="110" y="189" width="200" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="110" y="189" width="108.80000000000001" height="16" rx="3" class="bar grow pass" style="--d:2s"/><text class="mono l a" x="316" y="201" style="--d:2.2s">54,400</text><g class="a" style="--d:2.3s"><rect class="bx pass" x="8" y="214" width="344" height="22" rx="6"/><text class="tl" x="180" y="229" text-anchor="middle">45,600 paraphrased repeats answered from the cache</text></g></svg>