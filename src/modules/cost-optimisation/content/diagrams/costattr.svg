<svg viewBox="0 0 360 206" role="img" aria-label="Every LLM call is tagged with team, feature, customer, run id and model, so spend can be totalled by any tag: here 46% GST invoice drafting, 31% the support agent, 15% reconciliation runs and 8% one free-tier customer. The same tags drive guards: a ₹50 budget per run, a daily cap per customer, and an alert at 80% of budget."><text class="tl l a" x="6" y="14" style="--d:0s">Tag every call, then total by any tag</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="6" y="22" width="348" height="24" rx="6"/><text class="mono" x="180" y="38" text-anchor="middle">team · feature · customer · run_id · model</text></g><text class="mono l a" x="6" y="70" style="--d:0.25s">GST invoice drafting</text><rect x="168" y="60" width="147" height="14" rx="3" class="bar grow acc" style="--d:0.3s"/><text class="mono l a" x="323" y="71" style="--d:0.35s">46%</text><text class="mono l a" x="6" y="92" style="--d:0.35s">support agent</text><rect x="168" y="82" width="99" height="14" rx="3" class="bar grow acc" style="--d:0.4s"/><text class="mono l a" x="275" y="93" style="--d:0.44999999999999996s">31%</text><text class="mono l a" x="6" y="114" style="--d:0.45s">reconciliation runs</text><rect x="168" y="104" width="48" height="14" rx="3" class="bar grow warn" style="--d:0.5s"/><text class="mono l a" x="224" y="115" style="--d:0.55s">15%</text><text class="mono l a" x="6" y="136" style="--d:0.55s">customer c-118 (free)</text><rect x="168" y="126" width="26" height="14" rx="3" class="bar grow fail" style="--d:0.6000000000000001s"/><text class="mono l a" x="202" y="137" style="--d:0.65s">8%</text><text class="tl l a" x="6" y="168" style="--d:0.8s">Guards on the same tags</text><g class="a" style="--d:0.9s"><rect class="bx pass" x="6" y="176" width="110" height="22" rx="6"/><text class="mono" x="61" y="191" text-anchor="middle">run ≤ ₹50</text></g><g class="a" style="--d:1s"><rect class="bx pass" x="124" y="176" width="110" height="22" rx="6"/><text class="mono" x="179" y="191" text-anchor="middle">customer/day</text></g><g class="a" style="--d:1.1s"><rect class="bx warn" x="242" y="176" width="112" height="22" rx="6"/><text class="mono" x="298" y="191" text-anchor="middle">alert at 80%</text></g></svg>