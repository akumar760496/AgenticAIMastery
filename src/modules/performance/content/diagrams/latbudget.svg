<svg viewBox="0 0 360 248" role="img" aria-label="Before: an intent call, three tools one after another, retrieval and a 2.4-second answer run in sequence, and nothing is visible until 4.7 seconds. After: the intent step is merged into the answer call, the three tools run in parallel and the answer streams, so a status line appears at 0.3 seconds, the first words at 1.55 seconds and the answer finishes at 3.45 seconds. At p95, first words fall from 7.7 to 2.6 seconds against a 3-second budget, and total time from 7.7 to 5.0 seconds against a 5.5-second budget."><text class="tl l a" x="8" y="12" style="--d:0s">Before: every step waits for the last</text><rect class="a" x="62" y="20" width="35" height="16" rx="3" style="fill:var(--accent);--d:0.1s"/><rect class="a" x="98" y="20" width="92" height="16" rx="3" style="fill:var(--warn);--d:0.22s"/><rect class="a" x="191" y="20" width="8" height="16" rx="3" style="fill:var(--ink-2);--d:0.33999999999999997s"/><rect class="a" x="200" y="20" width="143" height="16" rx="3" style="fill:var(--accent);--d:0.45999999999999996s"/><text class="tl a" x="56" y="33" style="text-anchor:end;--d:0.1s">4.7 s</text><text class="sb l a" x="62" y="50" style="--d:0.6s">intent · 3 tools in turn · retrieval · answer</text><text class="tl l a" x="8" y="72" style="--d:0.8s">After: one LLM hop, parallel tools, streamed</text><rect class="a" x="62" y="80" width="18" height="4" rx="3" style="fill:var(--warn);--d:0.9s"/><rect class="a" x="62" y="86" width="27" height="4" rx="3" style="fill:var(--warn);--d:0.9500000000000001s"/><rect class="a" x="62" y="92" width="48" height="4" rx="3" style="fill:var(--warn);--d:1s"/><rect class="a" x="110" y="80" width="8" height="16" rx="3" style="fill:var(--ink-2);--d:1.05s"/><rect class="a" x="119" y="80" width="150" height="16" rx="3" style="fill:var(--accent);--d:1.15s"/><text class="tl a" x="56" y="93" style="text-anchor:end;--d:1.1s">3.45 s</text><path class="ln a" d="M80 76 L80 101" style="stroke:var(--pass);--d:1.3s"/><text class="mono l a" x="78" y="110" style="--d:1.35s">status 0.3 s</text><path class="ln a" d="M155 76 L155 113" style="stroke:var(--pass);--d:1.45s"/><text class="mono l a" x="153" y="122" style="--d:1.5s">first words 1.55 s</text><text class="tl l a" x="8" y="142" style="--d:1.6s">p95 against the budget (dashed)</text><text class="tl a" x="56" y="168" style="text-anchor:end;--d:1.7s">first words</text><rect class="a" x="62" y="154" width="231" height="9" rx="3" style="fill:var(--fail);--d:1.75s"/><rect class="a" x="62" y="165" width="78" height="9" rx="3" style="fill:var(--pass);--d:1.8499999999999999s"/><text class="mono l a" x="298" y="163" style="--d:1.8s">7.7 s</text><text class="mono l a" x="145" y="174" style="--d:1.9s">2.6 s</text><path class="ln a" d="M152 150 L152 178" style="stroke-dasharray:3 3;--d:1.95s"/><text class="tl a" x="56" y="202" style="text-anchor:end;--d:2s">total</text><rect class="a" x="62" y="188" width="231" height="9" rx="3" style="fill:var(--fail);--d:2.05s"/><rect class="a" x="62" y="199" width="150" height="9" rx="3" style="fill:var(--pass);--d:2.15s"/><text class="mono l a" x="298" y="197" style="--d:2.1s">7.7 s</text><text class="mono l a" x="217" y="208" style="--d:2.2s">5 s</text><path class="ln a" d="M227 184 L227 212" style="stroke-dasharray:3 3;--d:2.25s"/><g class="a" style="--d:2.4s"><rect class="bx soft" x="8" y="220" width="344" height="22" rx="6"/><text class="tl" x="180" y="235" text-anchor="middle">budget: first words ≤ 3 s, total ≤ 5.5 s at p95</text></g></svg>