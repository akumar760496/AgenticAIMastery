<svg viewBox="0 0 360 206" role="img" aria-label="With static batching, a batch waits for its longest request, leaving slots idle. Continuous batching refills a slot with a new request as soon as one finishes. PagedAttention stores the KV cache in pages, so more sequences fit on each GPU, and throughput is several times higher."><text class="tl l a" x="6" y="14" style="--d:0s">Static batch: wait for the longest request</text><rect x="6" y="22" width="150" height="10" rx="3" class="bar grow acc" style="--d:0.1s"/><rect x="156" y="22" width="110" height="10" rx="3" class="bar grow warn" style="--d:0.2s"/><rect x="6" y="36" width="260" height="10" rx="3" class="bar grow acc" style="--d:0.15000000000000002s"/><rect x="266" y="36" width="2" height="10" rx="3" class="bar grow warn" style="--d:0.25s"/><rect x="6" y="50" width="90" height="10" rx="3" class="bar grow acc" style="--d:0.2s"/><rect x="96" y="50" width="170" height="10" rx="3" class="bar grow warn" style="--d:0.30000000000000004s"/><text class="mono l a" x="274" y="40" style="--d:0.35s">idle slots</text><text class="tl l a" x="6" y="90" style="--d:0.5s">Continuous batching: refill a slot every step</text><rect x="6" y="98" width="150" height="10" rx="3" class="bar grow acc" style="--d:0.6s"/><rect x="158" y="98" width="110" height="10" rx="3" class="bar grow pass" style="--d:0.75s"/><rect x="6" y="112" width="260" height="10" rx="3" class="bar grow acc" style="--d:0.65s"/><rect x="6" y="126" width="90" height="10" rx="3" class="bar grow acc" style="--d:0.7s"/><rect x="98" y="126" width="170" height="10" rx="3" class="bar grow pass" style="--d:0.85s"/><text class="mono l a" x="274" y="116" style="--d:0.85s">new requests</text><g class="a" style="--d:1s"><rect class="bx soft" x="6" y="148" width="168" height="22" rx="6"/><text class="tl" x="90" y="163" text-anchor="middle">PagedAttention: KV in pages</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="186" y="148" width="168" height="22" rx="6"/><text class="tl" x="270" y="163" text-anchor="middle">more sequences per GPU</text></g><g class="a" style="--d:1.3s"><rect class="bx acc" x="6" y="176" width="348" height="24" rx="6"/><text class="tl" x="180" y="192" text-anchor="middle">throughput 10× static on the same GPU (illustrative)</text></g></svg>