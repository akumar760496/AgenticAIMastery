<svg viewBox="0 0 360 212" role="img" aria-label="A 70B model needs 140 GB of weights in BF16, 70 GB in FP8 and about 38 GB in 4-bit. With room for the KV cache on 80 GB GPUs, that is 4, 2 or 1 GPU. On this workload FP8 costs about 0.3 points of quality and 4-bit about 1.5 points. An FP8 KV cache fits more sequences on each GPU."><text class="tl l a" x="6" y="14" style="--d:0s">A 70B model’s weights</text><text class="mono l a" x="6" y="38" style="--d:0.15s">BF16</text><rect x="110" y="26" width="200" height="16" rx="3" class="bar grow warn" style="--d:0.2s"/><text class="mono l a" x="316" y="38" style="--d:0.25s">140 GB</text><text class="mono l a" x="6" y="64" style="--d:0.27s">FP8</text><rect x="110" y="52" width="100" height="16" rx="3" class="bar grow acc" style="--d:0.32s"/><text class="mono l a" x="216" y="64" style="--d:0.37s">70 GB</text><text class="mono l a" x="6" y="90" style="--d:0.39s">INT4 (AWQ/GPTQ)</text><rect x="110" y="78" width="54" height="16" rx="3" class="bar grow pass" style="--d:0.44s"/><text class="mono l a" x="170" y="90" style="--d:0.49s">38 GB</text><text class="tl l a" x="6" y="118" style="--d:0.6s">80 GB GPUs needed, with room for the KV cache</text><g class="a" style="--d:0.7s"><rect class="bx fail" x="6" y="126" width="110" height="22" rx="6"/><text class="mono" x="61" y="141" text-anchor="middle">BF16: 4</text></g><g class="a" style="--d:0.8s"><rect class="bx warn" x="124" y="126" width="110" height="22" rx="6"/><text class="mono" x="179" y="141" text-anchor="middle">FP8: 2</text></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="242" y="126" width="112" height="22" rx="6"/><text class="mono" x="298" y="141" text-anchor="middle">INT4: 1</text></g><g class="a" style="--d:1s"><rect class="bx soft" x="6" y="156" width="168" height="22" rx="6"/><text class="tl" x="90" y="171" text-anchor="middle">quality −0.3 pt (FP8)</text></g><g class="a" style="--d:1.1s"><rect class="bx soft" x="186" y="156" width="168" height="22" rx="6"/><text class="tl" x="270" y="171" text-anchor="middle">−1.5 pt (INT4)</text></g><g class="a" style="--d:1.2s"><rect class="bx acc" x="6" y="184" width="348" height="22" rx="6"/><text class="tl" x="180" y="199" text-anchor="middle">FP8 KV cache: more sequences per GPU</text></g></svg>