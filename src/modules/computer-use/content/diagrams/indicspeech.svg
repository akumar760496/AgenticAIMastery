ss="mono l a" x="280" y="209" style="--d:1.43s">15% → 11%</text><g class="a" style="--d:1.5s"><rect class="bx pass" x="8" y="226" width="344" height="24" rx="6"/><text class="tl" x="180" y="242" text-anchor="middle">amounts right 55% → 91% · to a person 55% → 17%</text></g></svg>