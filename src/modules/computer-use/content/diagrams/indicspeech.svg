<svg viewBox="0 0 360 258" role="img" aria-label="A caller says “premium saadhe teen hazaar hai na?”, Hindi mixed with English. Language identification tags the turn as Hindi-English, an Indic-tuned recogniser adapted to 8 kHz phone audio transcribes it, and the amount is normalised to ₹3,500. On the insurer’s own calls, switching from an English-first model to an Indic-tuned one with per-turn language identification, custom vocabulary and telephony tuning cuts word error rate from 30% to 10% in Hindi, 51% to 14% in Hinglish, 66% to 16% in Tamil, 60% to 14% in Bengali and 15% to 11% in English. Amounts captured correctly rise from 55% to 91%, and calls needing a person fall from 55% to 17%."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="344" height="24" rx="6"/><text class="mono" x="180" y="24" text-anchor="middle">“premium saadhe teen hazaar hai na?”</text></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="8" y="42" width="92" height="24" rx="6"/><text class="mono" x="54" y="58" text-anchor="middle">LID: hi-en</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M102 54L116 54" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx acc" x="118" y="42" width="142" height="24" rx="6"/><text class="tl" x="189" y="58" text-anchor="middle">Indic ASR · 8 kHz</text></g><g class="a" style="--d:0.5s"><path class="ln " d="M262 54L276 54" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6s"><rect class="bx pass" x="278" y="42" width="74" height="24" rx="6"/><text class="mono" x="315" y="58" text-anchor="middle">₹3,500</text></g><text class="tl l a" x="8" y="90" style="--d:0.7s">WER on your own calls: English-first → Indic, all on</text><text class="tl a" x="76" y="113" style="text-anchor:end;--d:0.8s">Hindi</text><rect x="82" y="100" width="190" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="82" y="100" width="81.42857142857143" height="7" rx="3" class="bar grow fail" style="--d:0.8500000000000001s"/