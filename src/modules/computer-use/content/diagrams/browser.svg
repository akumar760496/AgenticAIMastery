<svg viewBox="0 0 360 198" role="img" aria-label="A browser agent can observe a page as a screenshot, about 1,500 tokens that show layout; as raw HTML, about 25,000 noisy tokens; or as an accessibility tree, about 3,000 tokens of roles, names and element references such as a Download statement button. Known steps such as navigation and login are best scripted, with the agent handling the unknown parts."><g class="a" style="--d:0s"><rect class="bx acc" x="8" y="6" width="140" height="26" rx="6"/><text class="tl" x="78" y="23" text-anchor="middle">Screenshot</text></g><text class="tl l a" x="156" y="23" style="--d:0.05s">~1.5k tokens · sees layout</text><g class="a" style="--d:0.12s"><rect class="bx fail" x="8" y="40" width="140" height="26" rx="6"/><text class="tl" x="78" y="57" text-anchor="middle">Raw HTML</text></g><text class="tl l a" x="156" y="57" style="--d:0.16999999999999998s">~25k tokens · noisy</text><g class="a" style="--d:0.24s"><rect class="bx pass" x="8" y="74" width="140" height="26" rx="6"/><text class="tl" x="78" y="91" text-anchor="middle">Accessibility tree</text></g><text class="tl l a" x="156" y="91" style="--d:0.29s">~3k · roles, names, refs</text><g class="a" style="--d:0.5s"><rect class="bx soft" x="8" y="112" width="344" height="24" rx="6"/><text class="mono" x="180" y="128" text-anchor="middle">button "Download statement" [ref=e42]</text></g><text class="tl l a" x="8" y="156" style="--d:0.7s">Known steps in code, the agent for the unknown:</text><g class="a" style="--d:0.8s"><rect class="bx soft" x="8" y="164" width="168" height="24" rx="6"/><text class="tl" x="92" y="180" text-anchor="middle">page.goto(), login</text></g><g class="a" style="--d:0.9s"><rect class="bx acc" x="184" y="164" width="168" height="24" rx="6"/><text class="tl" x="268" y="180" text-anchor="middle">agent: find the notice</text></g></svg>