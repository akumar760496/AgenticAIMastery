<svg viewBox="0 0 360 208" role="img" aria-label="Layers of safety for agents that act on screens: a sandboxed virtual machine without a personal profile, an allowlist of the sites the task needs, credentials filled from a vault so the agent never sees them, screening so text on screen is never treated as an instruction, human confirmation for payments, submissions and deletions, and limits and logs. Each layer fails sometimes, so all are used together."><g class="a" style="--d:0s"><rect class="bx acc" x="8" y="6" width="130" height="24" rx="6"/><text class="tl" x="73" y="22" text-anchor="middle">Sandbox</text></g><text class="tl l a" x="146" y="22" style="--d:0.05s">isolated VM, no personal profile</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="8" y="36" width="130" height="24" rx="6"/><text class="tl" x="73" y="52" text-anchor="middle">Allowlist</text></g><text class="tl l a" x="146" y="52" style="--d:0.15000000000000002s">only the sites the task needs</text><g class="a" style="--d:0.2s"><rect class="bx acc" x="8" y="66" width="130" height="24" rx="6"/><text class="tl" x="73" y="82" text-anchor="middle">No raw secrets</text></g><text class="tl l a" x="146" y="82" style="--d:0.25s">vault fills credentials</text><g class="a" style="--d:0.30000000000000004s"><rect class="bx warn" x="8" y="96" width="130" height="24" rx="6"/><text class="tl" x="73" y="112" text-anchor="middle">Screen for injection</text></g><text class="tl l a" x="146" y="112" style="--d:0.35000000000000003s">text on screen is not an instruction</text><g class="a" style="--d:0.4s"><rect class="bx warn" x="8" y="126" width="130" height="24" rx="6"/><text class="tl" x="73" y="142" text-anchor="middle">Confirm</text></g><text class="tl l a" x="146" y="142" style="--d:0.45s">payments, submissions, deletions</text><g class="a" style="--d:0.5s"><rect class="bx soft" x="8" y="156" width="130" height="24" rx="6"/><text class="tl" x="73" y="172" text-anchor="middle">Limits and logs</text></g><text class="tl l a" x="146" y="172" style="--d:0.55s">steps, spend, full recording</text><text class="tl m a" x="180" y="200" style="--d:0.8s">Layers, because each one fails sometimes</text></svg>