<svg viewBox="0 0 360 204" role="img" aria-label="A phone photo of a document is deskewed, cropped and resized, then read both by a vision model and by OCR. Where they agree the fields are accepted; where they disagree the document goes to human review."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="110" height="70" rx="6" transform="rotate(-4 63 41)"/><text class="sb" x="63" y="44">phone photo</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M122 40L144 40" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="146" y="28" width="90" height="24" rx="6"/><text class="tl" x="191" y="44" text-anchor="middle">deskew, crop</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M238 40L256 40" marker-end="url(#arr)"/></g><g class="a" style="--d:0.45s"><rect class="bx acc" x="258" y="28" width="94" height="24" rx="6"/><text class="tl" x="305" y="44" text-anchor="middle">resize</text></g><g class="a" style="--d:0.55s"><path class="ln " d="M180 58L120 92" marker-end="url(#arr)"/></g><g class="a" style="--d:0.55s"><path class="ln " d="M300 58L300 92" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6s"><rect class="bx pass" x="8" y="94" width="168" height="24" rx="6"/><text class="tl" x="92" y="110" text-anchor="middle">vision model reads it</text></g><g class="a" style="--d:0.65s"><rect class="bx soft" x="184" y="94" width="168" height="24" rx="6"/><text class="tl" x="268" y="110" text-anchor="middle">OCR reads it</text></g><g class="a" style="--d:0.75s"><path class="ln " d="M92 120L170 140" marker-end="url(#arr)"/></g><g class="a" style="--d:0.75s"><path class="ln " d="M268 120L190 140" marker-end="url(#arr)"/></g><g class="a" style="--d:0.85s"><rect class="bx pass" x="60" y="142" width="240" height="24" rx="6"/><text class="tl" x="180" y="158" text-anchor="middle">compare: agree → accept</text></g><g class="a" style="--d:0.95s"><rect class="bx warn" x="60" y="172" width="240" height="24" rx="6"/><text class="tl" x="180" y="188" text-anchor="middle">disagree → human review</text></g></svg>