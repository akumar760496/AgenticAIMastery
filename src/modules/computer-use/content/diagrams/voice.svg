<svg viewBox="0 0 360 196" role="img" aria-label="A cascaded voice agent’s latency budget: about 60 milliseconds of network, 250 to detect the end of the turn, 120 for speech-to-text, 200 to the LLM’s first token and 150 to first audio, about 780 in total. Under 500 milliseconds feels natural, up to 800 is fine and over 1.5 seconds feels broken. Stream everything and let callers interrupt. Word error rates are about 5 to 8 percent for Hindi but over 20 percent for Bhojpuri and Maithili."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="10" width="26.46153846153846" height="30" rx="4"/></g><text class="sb l a" x="10" y="56" style="--d:0.1s">network 60</text><g class="a" style="--d:0.12s"><rect class="bx warn" x="34.46153846153846" y="10" width="110.25641025641025" height="30" rx="4"/></g><text class="sb l a" x="36.46153846153846" y="70" style="--d:0.22s">end of turn 250</text><g class="a" style="--d:0.24s"><rect class="bx acc" x="144.7179487179487" y="10" width="52.92307692307692" height="30" rx="4"/></g><text class="sb l a" x="146.7179487179487" y="56" style="--d:0.33999999999999997s">speech-to-text 120</text><g class="a" style="--d:0.36s"><rect class="bx acc" x="197.64102564102564" y="10" width="88.2051282051282" height="30" rx="4"/></g><text class="sb l a" x="199.64102564102564" y="70" style="--d:0.45999999999999996s">LLM first token 200</text><g class="a" style="--d:0.48s"><rect class="bx acc" x="285.8461538461538" y="10" width="66.15384615384615" height="30" rx="4"/></g><text class="sb l a" x="287.8461538461538" y="56" style="--d:0.58s">first audio 150</text><text class="tl l a" x="8" y="98" style="--d:0.8s">Total ≈ 780 ms, end of speech to first audio</text><text class="tl l a" x="8" y="122" style="--d:0.9s">< 500 ms natural · 500–800 fine · > 1.5 s broken</text><g class="a" style="--d:1s"><rect class="bx pass" x="8" y="134" width="344" height="24" rx="6"/><text class="tl" x="180" y="150" text-anchor="middle">stream everything; let callers interrupt (barge-in)</text></g><g class="a" style="--d:1.1s"><rect class="bx warn" x="8" y="164" width="344" height="24" rx="6"/><text class="tl" x="180" y="180" text-anchor="middle">Hindi ~5–8% WER · Bhojpuri, Maithili 20%+</text></g></svg>