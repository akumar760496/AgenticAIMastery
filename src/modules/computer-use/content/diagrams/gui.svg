<svg viewBox="0 0 360 210" role="img" aria-label="A GUI agent takes a screenshot, finds the target on screen, clicks at pixel coordinates, takes another screenshot and checks the result. Per-step accuracy compounds: 95 percent per step over 18 steps gives 40 percent task success; 99.5 percent gives 91 percent."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="200" height="120" rx="6"/><rect class="bx" x="20" y="22" width="176" height="14" rx="3"/><rect class="bx" x="20" y="44" width="120" height="14" rx="3"/><rect class="bx acc" x="120" y="96" width="76" height="20" rx="4"/><text class="sb" x="158" y="110">Submit</text></g><circle class="a" cx="158" cy="106" r="5" style="fill:var(--warn);--d:.5s"/><text class="tl l a" x="220" y="22" style="--d:0.2s">1 screenshot</text><text class="tl l a" x="220" y="44" style="--d:0.3s">2 model finds target</text><text class="tl l a" x="220" y="66" style="--d:0.4s">3 click (158, 106)</text><text class="tl l a" x="220" y="88" style="--d:0.5s">4 screenshot again</text><text class="tl l a" x="220" y="110" style="--d:0.6s">5 check it worked</text><text class="tl l a" x="8" y="150" style="--d:0.7s">Per-step accuracy compounds over a task:</text><text class="tl a" x="120" y="176" style="text-anchor:end;--d:.8s">95% × 18 steps</text><rect x="126" y="165" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="165" width="72" height="14" rx="3" class="bar grow fail" style="--d:0.9s"/><text class="mono l a" x="312" y="176" style="--d:1s">40%</text><text class="tl a" x="120" y="200" style="text-anchor:end;--d:.9s">99.5% × 18 steps</text><rect x="126" y="189" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="189" width="163.8" height="14" rx="3" class="bar grow pass" style="--d:1s"/><text class="mono l a" x="312" y="200" style="--d:1.1s">91%</text></svg>