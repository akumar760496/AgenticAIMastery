<svg viewBox="0 0 360 208" role="img" aria-label="A generator drafts and an evaluator checks the draft against ten rules and sends back a critique. Draft 1 passes 6 rules, draft 2 passes 9 and draft 3 passes all 10, so the loop stops at round 3 of 5."><g class="a " style="--d:0s"><rect class="bx acc" x="8" y="10" width="110" height="44" rx="7"/><text class="lb" x="63" y="29">Generator</text><text class="sb" x="63" y="44">drafts, revises</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M120 24L236 24" marker-end="url(#arr)"/></g><text class="tl a" x="178" y="18" style="text-anchor:middle;--d:.3s">draft</text><g class="a " style="--d:0.3s"><rect class="bx pass" x="238" y="10" width="114" height="44" rx="7"/><text class="lb" x="295" y="29">Evaluator</text><text class="sb" x="295" y="44">10 rules + checklist</text></g><g class="a" style="--d:.5s"><path class="ln acc" d="M238 44 L120 44" marker-end="url(#arrA)"/></g><text class="tl a" x="178" y="60" style="text-anchor:middle;--d:.6s">critique: 4 failed rules</text><text class="tl a" x="34" y="96" style="text-anchor:end;--d:0.8s">v1</text><rect x="40" y="85" width="250" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="40" y="85" width="150" height="14" rx="3" class="bar grow warn" style="--d:0.9s"/><text class="mono l a" x="296" y="96" style="--d:1s">6 / 10</text><text class="tl a" x="34" y="124" style="text-anchor:end;--d:1.05s">v2</text><rect x="40" y="113" width="250" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="40" y="113" width="225" height="14" rx="3" class="bar grow " style="--d:1.15s"/><text class="mono l a" x="296" y="124" style="--d:1.25s">9 / 10</text><text class="tl a" x="34" y="152" style="text-anchor:end;--d:1.3s">v3</text><rect x="40" y="141" width="250" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="40" y="141" width="250" height="14" rx="3" class="bar grow pass" style="--d:1.4s"/><text class="mono l a" x="296" y="152" style="--d:1.5s">10 / 10</text><g class="a" style="--d:1.8s"><rect class="bx pass" x="40" y="176" width="250" height="24" rx="6"/><text class="tl" x="165" y="192" text-anchor="middle">all rules pass → stop at round 3 of 5</text></g></svg>