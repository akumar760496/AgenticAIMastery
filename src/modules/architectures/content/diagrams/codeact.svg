<svg viewBox="0 0 360 220" role="img" aria-label="Calling one tool per turn takes 600 turns, about 36 lakh tokens and 20 minutes to reconcile 200 orders. Writing one short program per turn, which loops over orders and calls the payment and courier tools as functions, takes 6 turns, 60,000 tokens and 2 minutes. The code runs in a sandbox with no network, allow-listed tools and a time limit."><text class="tl l a" x="6" y="14" style="--d:0s">One tool call per turn</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="22" width="52" height="20" rx="6"/><text class="mono" x="32" y="36" text-anchor="middle">call</text></g><g class="a" style="--d:0.15000000000000002s"><rect class="bx soft" x="64" y="22" width="52" height="20" rx="6"/><text class="mono" x="90" y="36" text-anchor="middle">call</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="122" y="22" width="52" height="20" rx="6"/><text class="mono" x="148" y="36" text-anchor="middle">call</text></g><g class="a" style="--d:0.25s"><rect class="bx soft" x="180" y="22" width="52" height="20" rx="6"/><text class="mono" x="206" y="36" text-anchor="middle">call</text></g><g class="a" style="--d:0.30000000000000004s"><rect class="bx soft" x="238" y="22" width="52" height="20" rx="6"/><text class="mono" x="264" y="36" text-anchor="middle">call</text></g><g class="a" style="--d:0.35s"><rect class="bx soft" x="296" y="22" width="52" height="20" rx="6"/><text class="mono" x="322" y="36" text-anchor="middle">…</text></g><text class="mono l a" x="6" y="58" style="--d:0.4s">600 turns · 36 lakh tokens · 20 min</text><text class="tl l a" x="6" y="86" style="--d:0.6s">One program per turn</text><g class="a" style="--d:.7s"><rect class="bx acc" x="6" y="94" width="348" height="62" rx="6"/></g><text class="mono a" x="16" y="112" style="font-size:10px;--d:0.8s;white-space:pre">for o in orders(date="2026-09-26"):</text><text class="mono a" x="16" y="128" style="font-size:10px;--d:0.9s;white-space:pre">    p = payment(o.id); c = courier(o.awb)</text><text class="mono a" x="16" y="144" style="font-size:10px;--d:1s;white-space:pre">    if p.status != c.status: flag(o.id)</text><text class="mono l a" x="6" y="176" style="--d:1.2s">6 turns · 60,000 tokens · 2 min</text><g class="a" style="--d:1.4s"><rect class="bx warn" x="6" y="188" width="348" height="24" rx="6"/><text class="tl" x="180" y="204" text-anchor="middle">runs in a sandbox: no network, allow-listed tools, time limit</text></g></svg>