<svg viewBox="0 0 360 232" role="img" aria-label="The agent plans a ₹25,000 refund. Because it is above the limit, the run pauses and its state is saved. A reviewer card offers approve, edit or reject, and the run resumes from the saved step with the decision. Pausing every refund means 1,000 reviews a day; pausing only refunds over ₹10,000 means about 90."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="82" height="26" rx="6"/><text class="tl" x="49" y="25" text-anchor="middle">agent plans</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M92 21L106 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="108" y="8" width="128" height="26" rx="6"/><text class="mono" x="172" y="25" text-anchor="middle">refund ₹25,000</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M238 21L252 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx warn" x="254" y="8" width="98" height="26" rx="6"/><text class="tl" x="303" y="25" text-anchor="middle">pause · saved</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M303 36L303 50" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="236" y="52" width="116" height="26" rx="6"/><text class="tl" x="294" y="69" text-anchor="middle">reviewer card</text></g><g class="a" style="--d:0.8s"><path class="ln " d="M234 65L212 65" marker-end="url(#arr)"/></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="8" y="52" width="70" height="26" rx="6"/><text class="tl" x="43" y="69" text-anchor="middle">approve</text></g><g class="a" style="--d:1s"><rect class="bx soft" x="84" y="52" width="52" height="26" rx="6"/><text class="tl" x="110" y="69" text-anchor="middle">edit</text></g><g class="a" style="--d:1.1s"><rect class="bx fail" x="142" y="52" width="66" height="26" rx="6"/><text class="tl" x="175" y="69" text-anchor="middle">reject</text></g><g class="a" style="--d:1.3s"><rect class="bx pass" x="8" y="90" width="344" height="24" rx="6"/><text class="tl" x="180" y="106" text-anchor="middle">resume from the saved step with the decision</text></g><text class="tl l a" x="8" y="140" style="--d:1.4s">Reviews per 1,000 refunds</text><text class="tl a" x="124" y="160" style="text-anchor:end;--d:1.5s">Every refund</text><rect x="130" y="149" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="149" width="180" height="16" rx="3" class="bar grow warn" style="--d:1.6s"/><text class="mono l a" x="316" y="161" style="--d:1.8s">1,000</text><text class="tl a" x="124" y="188" style="text-anchor:end;--d:1.7s">Over ₹10,000</text><rect x="130" y="177" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="177" width="16.2" height="16" rx="3" class="bar grow pass" style="--d:1.8s"/><text class="mono l a" x="316" y="189" style="--d:2s">90</text><g class="a" style="--d:2.1s"><rect class="bx soft" x="8" y="204" width="344" height="22" rx="6"/><text class="tl" x="180" y="219" text-anchor="middle">the few risky refunds get a careful look</text></g></svg>