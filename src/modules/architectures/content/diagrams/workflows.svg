<svg viewBox="0 0 360 208" role="img" aria-label="A router sends claims to three specialised paths, 55, 30 and 15 percent. Accuracy rises from 73 percent with one generic prompt to 93 percent with a router and a gate."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="10" width="70" height="26" rx="6"/><text class="mono" x="43" y="27" text-anchor="middle">claim</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M80 23L100 23" marker-end="url(#arr)"/></g><g class="a" style="--d:.3s"><path class="bx acc" d="M126 4 L150 23 L126 42 L102 23 Z"/><text class="sb" x="126" y="56">router</text></g><path class="ln draw " pathLength="1" d="M150 23 C164 23,164 19,180 19" style="--d:0.5s"/><g class="a" style="--d:0.6s"><rect class="bx pass" x="182" y="6" width="170" height="26" rx="6"/><text class="tl" x="267" y="23" text-anchor="middle">cashless · 55%</text></g><path class="ln draw " pathLength="1" d="M150 23 C164 23,164 53,180 53" style="--d:0.6s"/><g class="a" style="--d:0.72s"><rect class="bx " x="182" y="40" width="170" height="26" rx="6"/><text class="tl" x="267" y="57" text-anchor="middle">reimbursement · 30%</text></g><path class="ln draw " pathLength="1" d="M150 23 C164 23,164 87,180 87" style="--d:0.7s"/><g class="a" style="--d:0.84s"><rect class="bx " x="182" y="74" width="170" height="26" rx="6"/><text class="tl" x="267" y="91" text-anchor="middle">other · 15%</text></g><text class="tl a" x="124" y="140" style="text-anchor:end;--d:1s">One generic prompt</text><rect x="130" y="129" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="129" width="131.4" height="16" rx="3" class="bar grow warn" style="--d:1.1s"/><text class="mono l a" x="316" y="141" style="--d:1.3s">73%</text><text class="tl a" x="124" y="168" style="text-anchor:end;--d:1.2s">Router + gate</text><rect x="130" y="157" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="157" width="167.4" height="16" rx="3" class="bar grow pass"