<svg viewBox="0 0 360 234" role="img" aria-label="A long prompt holds three tagged documents of a loan file, about 2,50,000 tokens, marked for prompt caching. The question comes last. The model first quotes the relevant clauses, then answers from the quotes. Accuracy on 50 test questions rises from 80 to 89 percent."><text class="tl l a" x="6" y="14" style="--d:0s">One prompt, 2,50,000 tokens</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="22" width="348" height="24" rx="6"/><text class="mono" x="180" y="38" text-anchor="middle"><doc id=1 src="agreement.pdf" p=1-120></text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="6" y="50" width="348" height="24" rx="6"/><text class="mono" x="180" y="66" text-anchor="middle"><doc id=2 src="sanction_letter.pdf"></text></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="6" y="78" width="348" height="24" rx="6"/><text class="mono" x="180" y="94" text-anchor="middle"><doc id=3 src="addendum_2025.pdf"></text></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="6" y="108" width="348" height="24" rx="6"/><text class="tl" x="180" y="124" text-anchor="middle">cache_control: reuse this prefix</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M180 134L180 146" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx " x="6" y="148" width="348" height="26" rx="6"/><text class="tl" x="180" y="165" text-anchor="middle">Question last: “Which prepayment charge applies after the addendum?”</text></g><g class="a" style="--d:0.9s"><rect class="bx warn" x="6" y="182" width="170" height="24" rx="6"/><text class="tl" x="91" y="198" text-anchor="middle">1 · quote the clauses</text></g><g class="a" style="--d:1s"><path class="ln " d="M178 194L190 194" marker-end="url(#arr)"/></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="192" y="182" width="162" height="24" rx="6"/><text class="tl" x="273" y="198" text-anchor="middle">2 · answer from quotes</text></g><text class="tl l a" x="6" y="226" style="--d:1.3s">Accuracy on 50 questions: 80% → 89%</text></svg>