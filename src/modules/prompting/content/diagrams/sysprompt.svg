<svg viewBox="0 0 360 232" role="img" aria-label="A structured system prompt has six sections: role and goal, context, rules, tool guidance, output format, and what to do when unsure. Stable text goes first so it can be cached, and variables and the question go last. Illustrative task accuracy rises from 66 percent with a vague prompt to 90 percent with a structured one."><g class="a" style="--d:0s"><rect class="bx acc" x="8" y="6" width="200" height="22" rx="6"/><text class="tl" x="108" y="21" text-anchor="middle">Role and goal</text></g><g class="a" style="--d:0.1s"><rect class="bx soft" x="8" y="34" width="200" height="22" rx="6"/><text class="tl" x="108" y="49" text-anchor="middle">Context and data</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="8" y="62" width="200" height="22" rx="6"/><text class="tl" x="108" y="77" text-anchor="middle">Rules and limits</text></g><g class="a" style="--d:0.30000000000000004s"><rect class="bx soft" x="8" y="90" width="200" height="22" rx="6"/><text class="tl" x="108" y="105" text-anchor="middle">Tools: when to use each</text></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="8" y="118" width="200" height="22" rx="6"/><text class="tl" x="108" y="133" text-anchor="middle">Output format</text></g><g class="a" style="--d:0.5s"><rect class="bx warn" x="8" y="146" width="200" height="22" rx="6"/><text class="tl" x="108" y="161" text-anchor="middle">When unsure: ask or escalate</text></g><text class="tl a" x="222" y="22" style="text-anchor:start;--d:.7s">stable text first</text><text class="tl a" x="222" y="38" style="text-anchor:start;--d:.7s">(cacheable)</text><text class="tl a" x="222" y="150" style="text-anchor:start;--d:.8s">variables and the</text><text class="tl a" x="222" y="166" style="text-anchor:start;--d:.8s">question last</text><path class="ln draw acc" pathLength="1" d="M214 46 L214 140" style="--d:0.75s"/><text class="tl a" x="120" y="198" style="text-anchor:end;--d:1s">Vague prompt</text><rect x="126" y="187" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="187" width="118.80000000000001" height="14" rx="3" class="bar grow warn" style="--d:1.1s"/><text class="mono l a" x="312" y="198" style="--d:1.2s">66%</text><text class="tl a" x="120" y="222" style="text-anchor:end;--d:1.1s">Structured</text><rect x="126" y="211" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="211" width="162" height="14" rx="3" class="bar grow pass" style="--d:1.2s"/><text class="mono l a" x="312" y="222" style="--d:1.3s">90%</text></svg>