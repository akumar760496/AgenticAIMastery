<svg viewBox="0 0 360 212" role="img" aria-label="Parsed output is validated against types and business rules. A failure goes back to the model with the specific error, such as a total that does not match its line items. Illustrative share of clean records: 82 percent with no retry, 94 percent after one retry with the specific error, 99 percent after three."><g class="a " style="--d:0s"><rect class="bx " x="8" y="8" width="110" height="40" rx="7"/><text class="lb" x="63" y="25">Model output</text><text class="sb" x="63" y="40">parsed JSON</text></g><g class="a" style="--d:0.15s"><path class="ln " d="M120 28L136 28" marker-end="url(#arr)"/></g><g class="a " style="--d:0.2s"><rect class="bx acc" x="138" y="8" width="110" height="40" rx="7"/><text class="lb" x="193" y="25">Validate</text><text class="sb" x="193" y="40">types + rules</text></g><g class="a" style="--d:0.35s"><path class="ln " d="M250 28L266 28" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx pass" x="268" y="16" width="84" height="24" rx="6"/><text class="tl" x="310" y="32" text-anchor="middle">valid ✓</text></g><g class="a" style="--d:.55s"><path class="ln fail" d="M193 50 C193 82,63 82,63 52" marker-end="url(#arr)" style="fill:none"/></g><g class="a" style="--d:0.65s"><rect class="bx fail" x="38" y="84" width="250" height="22" rx="6"/><text class="tl" x="163" y="99" text-anchor="middle">“total_inr 11,800 ≠ items 11,200”</text></g><text class="tl l a" x="8" y="130" style="--d:0.8s">Records clean after the loop</text><text class="tl a" x="120" y="149" style="text-anchor:end;--d:0.9s">no retry</text><rect x="126" y="139" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="139" width="147.6" height="13" rx="3" class="bar grow warn" style="--d:1s"/><text class="mono l a" x="312" y="149" style="--d:1.1s">82%</text><text class="tl a" x="120" y="173" style="text-anchor:end;--d:1s">1 retry, specific error</text><rect x="126" y="163" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="163" width="169.2" height="13" rx="3" class="bar grow warn" style="--d:1.1s"/><text class="mono l a" x="312" y="173" style="--d:1.2000000000000002s">94%</text><text class="tl a" x="120" y="197" style="text-anchor:end;--d:1.1s">3 retries</text><rect x="126" y="187" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="187" width="178.2" height="13" rx="3" class="bar grow pass" style="--d:1.2s"/><text class="mono l a" x="312" y="197" style="--d:1.3s">99%</text></svg>