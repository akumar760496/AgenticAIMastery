les retrieved for each query</text><g class="a" style="--d:1.1s"><rect class="bx pass" x="8" y="138" width="80" height="22" rx="6"/><text class="tl" x="48" y="153" text-anchor="middle">refund</text></g><g class="a" style="--d:1.1800000000000002s"><rect class="bx pass" x="95" y="138" width="80" height="22" rx="6"/><text class="tl" x="135" y="153" text-anchor="middle">delivery</text></g><g class="a" style="--d:1.26s"><rect class="bx pass" x="182" y="138" width="80" height="22" rx="6"/><text class="tl" x="222" y="153" text-anchor="middle">damage</text></g><g class="a" style="--d:1.34s"><rect class="bx pass" x="269" y="138" width="80" height="22" rx="6"/><text class="tl" x="309" y="153" text-anchor="middle">billing</text></g><text class="tl a" x="120" y="190" style="text-anchor:end;--d:1.5s">Accuracy</text><rect x="126" y="179" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="179" width="163.8" height="14" rx="3" class="bar grow pass" style="--d:1.6s"/><text class="mono l a" x="312" y="190" style="--d:1.7s">91%</text></svg>