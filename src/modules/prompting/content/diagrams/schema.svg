<svg viewBox="0 0 360 212" role="img" aria-label="A strict JSON schema for an invoice is enforced by the decoder, which only allows tokens that keep the output valid. Illustrative share of outputs matching the schema: 85 percent when the prompt only asks for JSON, 94 percent in JSON mode, and 100 percent with a strict schema."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="170" height="100" rx="8"/><text class="sb" x="18" y="24" style="text-anchor:start">{ "gstin": string,</text><text class="sb" x="18" y="40" style="text-anchor:start">  "invoice_no": string,</text><text class="sb" x="18" y="56" style="text-anchor:start">  "total_inr": number,</text><text class="sb" x="18" y="72" style="text-anchor:start">  "items": [ … ] }</text><text class="sb" x="18" y="94" style="text-anchor:start;fill:var(--accent)">JSON Schema, strict</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M180 56L196 56" marker-end="url(#arr)"/></g><g class="a " style="--d:0.4s"><rect class="bx acc" x="198" y="30" width="154" height="50" rx="7"/><text class="lb" x="275" y="52">Decoder</text><text class="sb" x="275" y="67">only valid tokens</text></g><text class="tl l a" x="8" y="130" style="--d:0.7s">Outputs that match the schema</text><text class="tl a" x="120" y="149" style="text-anchor:end;--d:0.8s">Prompt: “JSON only”</text><rect x="126" y="139" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="139" width="153" height="13" rx="3" class="bar grow warn" style="--d:0.9s"/><text class="mono l a" x="312" y="149" style="--d:1s">85%</text><text class="tl a" x="120" y="173" style="text-anchor:end;--d:0.9s">JSON mode</text><rect x="126" y="163" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="163" width="169.2" height="13" rx="3" class="bar grow warn" style="--d:1s"/><text class="mono l a" x="312" y="173" style="--d:1.1s">94%</text><text class="tl a" x="120" y="197" style="text-anchor:end;--d:1s">Strict schema</text><rect x="126" y="187" width="180" height="13" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="187" width="180" height="13" rx="3" class="bar grow pass" style="--d:1.1s"/><text class="mono l a" x="312" y="197" style="--d:1.2s">100%</text></svg>