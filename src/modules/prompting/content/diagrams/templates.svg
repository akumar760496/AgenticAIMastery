<svg viewBox="0 0 360 226" role="img" aria-label="A Jinja2 template includes shared rules, wraps untrusted ticket text in tags and escapes it, and fails on missing variables. Every change runs 300 golden cases in CI. A change that breaks an intent seen in 3 percent of traffic is caught 46 percent of the time with 20 cases and over 99 percent with 300."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="344" height="74" rx="8"/><text class="sb" x="18" y="24" style="text-anchor:start">{% include "rules.j2" %}</text><text class="sb" x="18" y="42" style="text-anchor:start">&lt;ticket&gt;{{ ticket | e }}&lt;/ticket&gt;   ← untrusted, wrapped</text><text class="sb" x="18" y="60" style="text-anchor:start">Customer tier: {{ tier }}   ← StrictUndefined</text></g><g class="a" style="--d:0.3s"><path class="ln " d="M180 82L180 98" marker-end="url(#arr)"/></g><g class="a " style="--d:0.4s"><rect class="bx acc" x="96" y="100" width="168" height="40" rx="7"/><text class="lb" x="180" y="117">CI: 300 golden cases</text><text class="sb" x="180" y="132">on every prompt change</text></g><text class="tl a" x="120" y="172" style="text-anchor:end;--d:.8s">20 cases</text><rect x="126" y="161" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="161" width="82.8" height="14" rx="3" class="bar grow warn" style="--d:0.9s"/><text class="mono l a" x="312" y="172" style="--d:1s">46%</text><text class="tl a" x="120" y="196" style="text-anchor:end;--d:.9s">300 cases</text><rect x="126" y="185" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="185" width="178.2" height="14" rx="3" class="bar grow pass" style="--d:1s"/><text class="mono l a" x="312" y="196" style="--d:1.1s">>99%</text><text class="tl m a" x="180" y="218" style="--d:1.2s">Chance a change that breaks 3% of intents is caught</text></svg>