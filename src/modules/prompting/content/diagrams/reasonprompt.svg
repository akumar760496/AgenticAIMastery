<svg viewBox="0 0 360 248" role="img" aria-label="Two prompts for a reasoning model. A scaffold says think step by step and asks for about 900 tokens of shown working; the better prompt states the goal, the limits and a self-check, and asks for the answer only as JSON. Effort is set per task: lookups go to a fast model, reconciliations run at high effort. For 10,000 tasks a day the scaffold at high effort costs ₹41,948, goals at high effort ₹36,295, and goals with routing ₹25,900, with accuracy of 96.2% against 95.7%."><g class="a" style="--d:0s"><rect class="bx fail" x="8" y="8" width="168" height="26" rx="6"/><text class="tl" x="92" y="25" text-anchor="middle">“think step by step…”</text></g><g class="a" style="--d:0.2s"><rect class="bx pass" x="184" y="8" width="168" height="26" rx="6"/><text class="tl" x="268" y="25" text-anchor="middle">goal · limits · self-check</text></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="8" y="40" width="168" height="22" rx="6"/><text class="tl" x="92" y="55" text-anchor="middle">+900 tokens of working</text></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="184" y="40" width="168" height="22" rx="6"/><text class="tl" x="268" y="55" text-anchor="middle">answer only, as JSON</text></g><text class="tl l a" x="8" y="82" style="--d:0.5s">Effort per task</text><g class="a" style="--d:0.6s"><rect class="bx pass" x="8" y="88" width="168" height="26" rx="6"/><text class="tl" x="92" y="105" text-anchor="middle">lookup → fast model</text></g><g class="a" style="--d:0.7s"><rect class="bx warn" x="184" y="88" width="168" height="26" rx="6"/><text class="tl" x="268" y="105" text-anchor="middle">reconcile → effort high</text></g><text class="tl l a" x="8" y="136" style="--d:0.9s">Cost per day, 10,000 tasks</text><text class="tl a" x="124" y="158" style="text-anchor:end;--d:1.0s">Scaffold, all high</text><rect x="130" y="147" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="147" width="180" height="16" rx="3" class="bar grow warn" style="--d:1.1s"/><text class="mono l a" x="316" y="159" style="--d:1.3s">₹41,948</text><text class="tl a" x="124" y="182" style="text-anchor:end;--d:1.2s">Goals, all high</text><rect x="130" y="171" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="171" width="155.7" height="16" rx="3" class="bar grow acc" style="--d:1.3s"/><text class="mono l a" x="316" y="183" style="--d:1.5s">₹36,295</text><text class="tl a" x="124" y="206" style="text-anchor:end;--d:1.4s">Goals + routing</text><rect x="130" y="195" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="195" width="111.06" height="16" rx="3" class="bar grow pass" style="--d:1.5s"/><text class="mono l a" x="316" y="207" style="--d:1.7s">₹25,900</text><g class="a" style="--d:1.8s"><rect class="bx soft" x="8" y="220" width="344" height="22" rx="6"/><text class="tl" x="180" y="235" text-anchor="middle">96.2% vs 95.7% accurate, at 62% of the cost</text></g></svg>