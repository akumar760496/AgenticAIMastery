<svg viewBox="0 0 360 226" role="img" aria-label="A Hinglish message asks when a 3,500-rupee refund will arrive. The model returns JSON with English keys and an English intent label, the amount as the number 3500, and a reply language. The reply comes back in Hinglish. Intent accuracy on Hinglish rises from 78 to 90 percent."><g class="a" style="--d:0s"><rect class="bx " x="6" y="8" width="348" height="26" rx="6"/><text class="tl" x="180" y="25" text-anchor="middle">“bhai 3500 ka refund kab aayega? order 8812”</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M180 36L180 48" marker-end="url(#arr)"/></g><g class="a" style="--d:.3s"><rect class="bx" x="6" y="50" width="348" height="84" rx="6"/></g><text class="mono a" x="16" y="70" style="font-size:10.5px;--d:0.4s;white-space:pre">{ "intent": "refund_status",</text><text class="mono a" x="16" y="88" style="font-size:10.5px;--d:0.52s;white-space:pre">  "amount_inr": 3500,</text><text class="mono a" x="16" y="106" style="font-size:10.5px;--d:0.64s;white-space:pre">  "order_id": "8812",</text><text class="mono a" x="16" y="124" style="font-size:10.5px;--d:0.76s;white-space:pre">  "reply_lang": "hi-Latn" }</text><g class="a" style="--d:1s"><rect class="bx acc" x="6" y="142" width="170" height="22" rx="6"/><text class="tl" x="91" y="157" text-anchor="middle">keys and enums in English</text></g><g class="a" style="--d:1.1s"><rect class="bx acc" x="184" y="142" width="170" height="22" rx="6"/><text class="tl" x="269" y="157" text-anchor="middle">“teen hazaar paanch sau” → 3500</text></g><g class="a" style="--d:1.3s"><rect class="bx pass" x="6" y="172" width="348" height="26" rx="6"/><text class="tl" x="180" y="189" text-anchor="middle">Reply: “Aapka ₹3,500 ka refund 2 din mein aa jayega.”</text></g><text class="tl l a" x="6" y="218" style="--d:1.5s">Hinglish intent accuracy: 78% → 90%</text></svg>