<svg viewBox="0 0 360 212" role="img" aria-label="Explicit thumbs from 1.5% of chats, plus implicit signals such as retries, rephrasing and handoffs to a human, are joined to traces and clustered into failure patterns. Each pattern feeds the eval set, a prompt or retrieval fix, and training data, and the next release is measured on the eval set. Only consented, redacted data is used for training."><text class="tl l a" x="6" y="14" style="--d:0s">Signals from 2 lakh chats a week</text><g class="a" style="--d:0.1s"><rect class="bx soft" x="6" y="22" width="110" height="22" rx="6"/><text class="mono" x="61" y="37" text-anchor="middle">thumbs: 1.5%</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="124" y="22" width="110" height="22" rx="6"/><text class="mono" x="179" y="37" text-anchor="middle">retry, rephrase</text></g><g class="a" style="--d:0.3s"><rect class="bx soft" x="242" y="22" width="112" height="22" rx="6"/><text class="mono" x="298" y="37" text-anchor="middle">handoff to human</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M180 48L180 60" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="6" y="62" width="348" height="24" rx="6"/><text class="tl" x="180" y="78" text-anchor="middle">join to traces → cluster into failure patterns</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M180 88L180 100" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx pass" x="6" y="102" width="110" height="24" rx="6"/><text class="mono" x="61" y="118" text-anchor="middle">eval set</text></g><g class="a" style="--d:0.8s"><rect class="bx pass" x="124" y="102" width="110" height="24" rx="6"/><text class="mono" x="179" y="118" text-anchor="middle">prompt / RAG fix</text></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="242" y="102" width="112" height="24" rx="6"/><text class="mono" x="298" y="118" text-anchor="middle">tuning data</text></g><path d="M300 128 C 330 150, 330 170, 180 176 C 40 176, 20 150, 40 130" class="ln acc a" style="--d:1s;fill:none"/><text class="mono l a" x="110" y="172" style="--d:1.1s">next release, measured on the eval set</text><g class="a" style="--d:1.2s"><rect class="bx warn" x="6" y="186" width="348" height="20" rx="6"/><text class="tl" x="180" y="200" text-anchor="middle">only consented, redacted data for training (DPDP)</text></g></svg>