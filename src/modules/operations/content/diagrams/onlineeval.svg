<svg viewBox="0 0 360 222" role="img" aria-label="A daily judge pass rate on sampled live traffic holds near 92 percent for seven days, then drops to 87 and 86 percent, below the 88 percent alert line. Two percent of traces are judged, and cheap deterministic checks run on every trace."><line class="grid-l" x1="36" x2="352" y1="105" y2="105"/><text class="sb" x="30" y="109" style="text-anchor:end">85%</text><line class="grid-l" x1="36" x2="352" y1="60" y2="60"/><text class="sb" x="30" y="64" style="text-anchor:end">90%</text><line class="grid-l" x1="36" x2="352" y1="15" y2="15"/><text class="sb" x="30" y="19" style="text-anchor:end">95%</text><line x1="36" x2="352" y1="78" y2="78" style="stroke:var(--fail);stroke-dasharray:4 3;stroke-width:1.2"/><text class="tag-t fail" x="352" y="73" style="text-anchor:end">alert below 88%</text><path class="ln draw acc" pathLength="1" d="M40 42 L73 33 L106 42 L139 51 L172 33 L205 42 L238 42 L271 87 L304 96 L337 96" style="--d:0.2s"/><circle class="a" cx="40" cy="42" r="3.5" style="fill:var(--accent);--d:0.3s"/><circle class="a" cx="73" cy="33" r="3.5" style="fill:var(--accent);--d:0.38s"/><circle class="a" cx="106" cy="42" r="3.5" style="fill:var(--accent);--d:0.45999999999999996s"/><circle class="a" cx="139" cy="51" r="3.5" style="fill:var(--accent);--d:0.54s"/><circle class="a" cx="172" cy="33" r="3.5" style="fill:var(--accent);--d:0.62s"/><circle class="a" cx="205" cy="42" r="3.5" style="fill:var(--accent);--d:0.7s"/><circle class="a" cx="238" cy="42" r="3.5" style="fill:var(--accent);--d:0.78s"/><circle class="a" cx="271" cy="87" r="3.5" style="fill:var(--fail);--d:0.8600000000000001s"/><circle class="a" cx="304" cy="96" r="3.5" style="fill:var(--fail);--d:0.94s"/><circle class="a" cx="337" cy="96" r="3.5" style="fill:var(--fail);--d:1.02s"/><text class="sb" x="40" y="178">day 1</text><text class="sb" x="337" y="178">day 10</text><g class="a" style="--d:1.2s"><rect class="bx soft" x="8" y="190" width="344" height="24" rx="6"/>