<svg viewBox="0 0 360 204" role="img" aria-label="Traffic is split 95 percent control and 5 percent canary, on a ladder of 1, 5, 25 and 100 percent. At the 5 percent stage the canary succeeds on 90.2 percent of requests against 94.1 percent for control, so the guardrail triggers a rollback."><text class="tl l a" x="8" y="14" style="--d:0s">Traffic split</text><rect x="8" y="22" width="327" height="22" rx="3" class="bar grow " style="--d:0.1s"/><rect x="337" y="22" width="15" height="22" rx="3" class="bar grow warn" style="--d:0.2s"/><text class="sb a" x="170" y="37" style="text-anchor:middle;fill:var(--bg);--d:.3s">control 95%</text><text class="sb a" x="344" y="60" style="text-anchor:middle;--d:.3s">5%</text><g class="a" style="--d:0.4s"><rect class="bx soft" x="8" y="76" width="78" height="24" rx="6"/><text class="mono" x="47" y="92" text-anchor="middle">1%</text></g><g class="a" style="--d:0.45s"><path class="ln " d="M88 88L94 88" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="96" y="76" width="78" height="24" rx="6"/><text class="mono" x="135" y="92" text-anchor="middle">5%</text></g><g class="a" style="--d:0.55s"><path class="ln " d="M176 88L182 88" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6000000000000001s"><rect class="bx soft" x="184" y="76" width="78" height="24" rx="6"/><text class="mono" x="223" y="92" text-anchor="middle">25%</text></g><g class="a" style="--d:0.65s"><path class="ln " d="M264 88L270 88" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7000000000000001s"><rect class="bx soft" x="272" y="76" width="78" height="24" rx="6"/><text class="mono" x="311" y="92" text-anchor="middle">100%</text></g><text class="tl a" x="120" y="132" style="text-anchor:end;--d:.9s">Control success</text><rect x="126" y="121" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="121" width="169.38" height="14" rx="3" class="bar grow pass" style="--d:1s"/><text class="mono l a" x="312" y="132" style="--d:1.1s">94.1%</text><text class="tl a" x="120" y="156" style="text-anchor:end;--d:1s">Canary success</text><rect x="126" y="145" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="145" width="162.36" height="14" rx="3" class="bar grow fail" style="--d:1.1s"/><text class="mono l a" x="312" y="156" style="--d:1.2s">90.2%</text><g class="a" style="--d:1.4s"><rect class="bx fail" x="8" y="172" width="344" height="24" rx="6"/><text class="tl" x="180" y="188" text-anchor="middle">guardrail breached → roll back at the 5% stage</text></g></svg>