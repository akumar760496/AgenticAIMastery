<svg viewBox="0 0 360 202" role="img" aria-label="A circuit breaker opens after 5 consecutive failures and fails fast, sends one probe after 30 seconds in the half-open state, and closes again if the probe succeeds. While it is open, requests go to a secondary model or a cached answer. Each call has an 8-second timeout, far below the 10-minute SDK default."><g class="a " style="--d:0s"><rect class="bx pass" x="8" y="20" width="100" height="46" rx="7"/><text class="lb" x="58" y="40">Closed</text><text class="sb" x="58" y="55">calls pass</text></g><g class="a " style="--d:0.3s"><rect class="bx fail" x="130" y="20" width="100" height="46" rx="7"/><text class="lb" x="180" y="40">Open</text><text class="sb" x="180" y="55">fail fast</text></g><g class="a " style="--d:0.6s"><rect class="bx warn" x="252" y="20" width="100" height="46" rx="7"/><text class="lb" x="302" y="40">Half-open</text><text class="sb" x="302" y="55">one probe</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M110 36L128 36" marker-end="url(#arr)"/></g><text class="sb a" x="119" y="16" style="--d:.25s">5 fails</text><g class="a" style="--d:0.5s"><path class="ln " d="M232 36L250 36" marker-end="url(#arr)"/></g><text class="sb a" x="241" y="16" style="--d:.55s">30 s</text><g class="a" style="--d:.8s"><path class="ln pass" d="M302 68 C302 96,58 96,58 70" marker-end="url(#arr)" style="fill:none"/></g><text class="tl a" x="180" y="104" style="text-anchor:middle;--d:.85s">probe succeeds → close</text><text class="tl l a" x="8" y="130" style="--d:1s">While open, requests go to the fallback</text><g class="a" style="--d:1.1s"><rect class="bx acc" x="8" y="138" width="168" height="24" rx="6"/><text class="mono" x="92" y="154" text-anchor="middle">secondary model</text></g><g class="a" style="--d:1.2s"><rect class="bx soft" x="184" y="138" width="168" height="24" rx="6"/><text class="mono" x="268" y="154" text-anchor="middle">cached answer</text></g><g class="a" style="--d:1.4s"><rect class="bx warn" x="8" y="170" width="344" height="24" rx="6"/><text class="tl" x="180" y="186" text-anchor="middle">timeout 8 s per call · SDK default is 10 min</text></g></svg>