<svg viewBox="0 0 360 218" role="img" aria-label="A ten-step claims job crashes during step 7. The event history holds the results of steps 1 to 6, so a durable workflow replays it and continues at step 7, re-running one step instead of seven for a plain script."><g class="a" style="--d:0s"><rect class="bx pass" x="8" y="10" width="64" height="26" rx="6"/><text class="tl" x="40" y="27" text-anchor="middle">fetch</text></g><g class="a" style="--d:0.05s"><rect class="bx pass" x="78" y="10" width="64" height="26" rx="6"/><text class="tl" x="110" y="27" text-anchor="middle">policy</text></g><g class="a" style="--d:0.1s"><rect class="bx pass" x="148" y="10" width="64" height="26" rx="6"/><text class="tl" x="180" y="27" text-anchor="middle">OCR</text></g><g class="a" style="--d:0.15000000000000002s"><rect class="bx pass" x="218" y="10" width="64" height="26" rx="6"/><text class="tl" x="250" y="27" text-anchor="middle">summary</text></g><g class="a" style="--d:0.2s"><rect class="bx pass" x="288" y="10" width="64" height="26" rx="6"/><text class="tl" x="320" y="27" text-anchor="middle">fraud</text></g><g class="a" style="--d:0.25s"><rect class="bx pass" x="8" y="50" width="64" height="26" rx="6"/><text class="tl" x="40" y="67" text-anchor="middle">decide</text></g><g class="a" style="--d:0.30000000000000004s"><rect class="bx fail" x="78" y="50" width="64" height="26" rx="6"/><text class="tl" x="110" y="67" text-anchor="middle">approve</text></g><g class="a" style="--d:0.35000000000000003s"><rect class="bx soft" x="148" y="50" width="64" height="26" rx="6"/><text class="tl" x="180" y="67" text-anchor="middle">refund</text></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="218" y="50" width="64" height="26" rx="6"/><text class="tl" x="250" y="67" text-anchor="middle">notify</text></g><g class="a" style="--d:0.45s"><rect class="bx soft" x="288" y="50" width="64" height="26" rx="6"/><text class="tl" x="320" y="67" text-anchor="middle">close</text></g><text class="tl l a" x="8" y="100" style="--d:0.7s">Event history: steps 1–6 recorded</text><g class="a" style="--d:0.9s"><rect class="bx fail" x="8" y="108" width="344" height="24" rx="6"/><text class="tl" x="180" y="124" text-anchor="middle">crash during step 7 (waiting for approval)</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="8" y="138" width="344" height="24" rx="6"/><text class="tl" x="180" y="154" text-anchor="middle">resume: replay history, continue at step 7</text></g><text class="tl a" x="120" y="186" style="text-anchor:end;--d:1.3s">Plain script</text><rect x="126" y="175" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="175" width="125.99999999999999" height="14" rx="3" class="bar grow warn" style="--d:1.4s"/><text class="mono l a" x="312" y="186" style="--d:1.5s">7 re-run</text><text class="tl a" x="120" y="208" style="text-anchor:end;--d:1.4s">Durable</text><rect x="126" y="197" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="126" y="197" width="18" height="14" rx="3" class="bar grow pass" style="--d:1.5s"/><text class="mono l a" x="312" y="208" style="--d:1.6s">1 re-run</text></svg>