<svg viewBox="0 0 360 222" role="img" aria-label="Task goes into a black-box agent; only the final state is checked, then success, latency and cost are reported."><g class="a " style="--d:0s"><rect class="bx " x="8" y="78" width="84" height="58" rx="7"/><text class="lb" x="50" y="104">Task</text><text class="sb" x="50" y="119">goal + input</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M94 107L120 107" marker-end="url(#arr)"/></g><g class="a dark-t" style="--d:0.4s"><rect class="bx dark" x="122" y="56" width="116" height="102" rx="7"/><text class="lb" x="180" y="104">Agent</text><text class="sb" x="180" y="119">internals not scored</text></g><g class="a" style="--d:0.7s"><path class="ln " d="M240 107L266 107" marker-end="url(#arr)"/></g><g class="a " style="--d:0.85s"><rect class="bx " x="268" y="78" width="84" height="58" rx="7"/><text class="lb" x="310" y="104">Final state</text><text class="sb" x="310" y="119">DB · files · reply</text></g><g class="a" style="--d:1.15s"><circle cx="350" cy="78" r="9" class="bd-pass"/><path d="M346 78l3 3 5-6" class="bd-mark"/></g><g class="a" style="--d:1.4s"><rect class="bx soft" x="8" y="176" width="108" height="40" rx="6"/><text class="sb" x="62" y="191">Success</text><text class="lb" x="62" y="208" style="font-family:var(--mono);font-size:13px">42 / 50</text></g><g class="a" style="--d:1.5799999999999998s"><rect class="bx soft" x="124" y="176" width="108" height="40" rx="6"/><text class="sb" x="178" y="191">p95 latency</text><text class="lb" x="178" y="208" style="font-family:var(--mono);font-size:13px">38 s</text></g><g class="a" style="--d:1.7599999999999998s"><rect class="bx soft" x="240" y="176" width="108" height="40" rx="6"/><text class="sb" x="294" y="191">Cost / success</text><text class="lb" x="294" y="208" style="font-family:var(--mono);font-size:13px">$0.09</text></g></svg>