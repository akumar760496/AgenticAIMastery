<svg viewBox="0 0 360 256" role="img" aria-label="Cases come from production logs, tickets, subject experts and new failures. They are stratified by 12 intents, Hindi and risk, with adversarial and reviewed synthetic cases added, then labelled by two annotators against a rubric with adjudication. At 85% accuracy the 95% margin is about ±9.9 points with 50 cases, ±4.9 with 200 and ±2.2 with 1,000."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="78" height="24" rx="6"/><text class="mono" x="47" y="24" text-anchor="middle">prod logs</text></g><g class="a" style="--d:0.1s"><rect class="bx soft" x="92" y="8" width="66" height="24" rx="6"/><text class="mono" x="125" y="24" text-anchor="middle">tickets</text></g><g class="a" style="--d:0.2s"><rect class="bx soft" x="164" y="8" width="48" height="24" rx="6"/><text class="mono" x="188" y="24" text-anchor="middle">SMEs</text></g><g class="a" style="--d:0.3s"><rect class="bx warn" x="218" y="8" width="134" height="24" rx="6"/><text class="mono" x="285" y="24" text-anchor="middle">new failures</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M180 34L180 46" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx acc" x="8" y="48" width="344" height="24" rx="6"/><text class="tl" x="180" y="64" text-anchor="middle">stratify: 12 intents · Hindi · risk</text></g><g class="a" style="--d:0.7s"><rect class="bx fail" x="8" y="80" width="168" height="24" rx="6"/><text class="tl" x="92" y="96" text-anchor="middle">+ adversarial cases</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="184" y="80" width="168" height="24" rx="6"/><text class="tl" x="268" y="96" text-anchor="middle">+ reviewed synthetic</text></g><g class="a" style="--d:0.9s"><path class="ln " d="M180 106L180 118" marker-end="url(#arr)"/></g><g class="a" style="--d:1s"><rect class="bx pass" x="8" y="120" width="344" height="24" rx="6"/><text class="tl" x="180" y="136" text-anchor="middle">2 annotators · rubric · adjudicate</text></g><text class="tl l a" x="8" y="166" style="--d:1.2s">95% margin at 85% accuracy</text><text class="tl a" x="84" y="188" style="text-anchor:end;--d:1.3s">50 cases</text><rect x="90" y="176" width="210" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="176" width="207.9" height="16" rx="3" class="bar grow warn" style="--d:1.4s"/><text class="mono l a" x="306" y="189" style="--d:1.6s">±9.9</text><text class="tl a" x="84" y="214" style="text-anchor:end;--d:1.45s">200 cases</text><rect x="90" y="202" width="210" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="202" width="102.9" height="16" rx="3" class="bar grow warn" style="--d:1.5499999999999998s"/><text class="mono l a" x="306" y="215" style="--d:1.75s">±4.9</text><text class="tl a" x="84" y="240" style="text-anchor:end;--d:1.6s">1,000 cases</text><rect x="90" y="228" width="210" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="90" y="228" width="46.2" height="16" rx="3" class="bar grow pass" style="--d:1.7s"/><text class="mono l a" x="306" y="241" style="--d:1.9000000000000001s">±2.2</text></svg>