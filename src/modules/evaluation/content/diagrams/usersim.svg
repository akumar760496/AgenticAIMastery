<svg viewBox="0 0 360 214" role="img" aria-label="An LLM plays a user with a persona, a goal and hidden details it reveals only when asked. It talks to the agent over several turns, in Hinglish and impatiently. Each conversation is judged on the end state, such as whether the refund was raised, and each scenario is repeated k times to measure pass^k."><g class="a" style="--d:0s"><rect class="bx warn" x="6" y="8" width="168" height="24" rx="6"/><text class="tl" x="90" y="24" text-anchor="middle">simulated user (LLM)</text></g><g class="a" style="--d:0.1s"><rect class="bx acc" x="186" y="8" width="168" height="24" rx="6"/><text class="tl" x="270" y="24" text-anchor="middle">your agent</text></g><text class="mono l a" x="6" y="48" style="--d:0.2s">persona: impatient, Hinglish</text><text class="mono l a" x="6" y="64" style="--d:0.25s">goal: refund for failed UPI payment</text><text class="mono l a" x="6" y="80" style="--d:0.3s">hidden: UTR number, only if asked</text><g class="a" style="--d:0.5s"><rect class="bx " x="6" y="100" width="258" height="22" rx="6"/><text class="tl" x="135" y="115" text-anchor="middle">“paisa kat gaya, refund kab?”</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="96" y="126" width="258" height="22" rx="6"/><text class="tl" x="225" y="141" text-anchor="middle">“Please share the UTR number”</text></g><g class="a" style="--d:0.9s"><rect class="bx " x="6" y="152" width="258" height="22" rx="6"/><text class="tl" x="135" y="167" text-anchor="middle">“UTR 4178…, jaldi karo”</text></g><g class="a" style="--d:1.2s"><rect class="bx pass" x="6" y="184" width="168" height="24" rx="6"/><text class="tl" x="90" y="200" text-anchor="middle">end state: refund raised?</text></g><g class="a" style="--d:1.35s"><rect class="bx soft" x="186" y="184" width="168" height="24" rx="6"/><text class="tl" x="270" y="200" text-anchor="middle">repeat k times: pass^k</text></g></svg>