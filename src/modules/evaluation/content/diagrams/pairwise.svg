<svg viewBox="0 0 360 192" role="img" aria-label="Two answers, A from the current version and B from a new prompt, go to a judge in both orders; only consistent wins count, and split verdicts are ties. The win rate of B is 56% with a 95% interval of 53 to 59% on 800 questions, clear of 50%. On 200 questions the interval is 49 to 63%, which cannot rule out no difference."><g class="a" style="--d:0s"><rect class="bx soft" x="6" y="8" width="168" height="24" rx="6"/><text class="tl" x="90" y="24" text-anchor="middle">answer A (current)</text></g><g class="a" style="--d:0.1s"><rect class="bx acc" x="186" y="8" width="168" height="24" rx="6"/><text class="tl" x="270" y="24" text-anchor="middle">answer B (new prompt)</text></g><text class="tl l a" x="6" y="50" style="--d:0.25s">Judge sees A,B then B,A: count only consistent wins</text><g class="a" style="--d:0.35s"><rect class="bx pass" x="6" y="58" width="110" height="22" rx="6"/><text class="mono" x="61" y="73" text-anchor="middle">B wins both</text></g><g class="a" style="--d:0.45s"><rect class="bx warn" x="124" y="58" width="110" height="22" rx="6"/><text class="mono" x="179" y="73" text-anchor="middle">split → tie</text></g><g class="a" style="--d:0.55s"><rect class="bx fail" x="242" y="58" width="112" height="22" rx="6"/><text class="mono" x="298" y="73" text-anchor="middle">A wins both</text></g><text class="tl l a" x="6" y="102" style="--d:0.7s">Win rate of B with a 95% interval</text><rect x="20" y="112" width="320" height="14" rx="3" class="skel" style="opacity:.45"/><line x1="180" y1="106" x2="180" y2="132" class="ln warn a" style="--d:.8s"/><rect x="188" y="112" width="22" height="14" rx="3" class="bar grow acc" style="--d:.9s"/><circle cx="199" cy="119" r="4" class="bx pass a" style="--d:1s"/><text class="mono l a" x="172" y="146" style="--d:0.85s">50%</text><text class="mono l a" x="190" y="146" style="--d:1s">56% [53, 59]</text><g class="a" style="--d:1.2s"><rect class="bx warn" x="6" y="160" width="168" height="24" rx="6"/><text class="tl" x="90" y="176" text-anchor="middle">n=200: 49–63%, unsure</text></g><g class="a" style="--d:1.35s"><rect class="bx pass" x="186" y="160" width="168" height="24" rx="6"/><text class="tl" x="270" y="176" text-anchor="middle">n=800: 53–59%, ship</text></g></svg>