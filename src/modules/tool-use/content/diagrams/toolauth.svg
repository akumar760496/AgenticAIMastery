<svg viewBox="0 0 360 232" role="img" aria-label="The user consents through OAuth with PKCE and the token is stored in a vault. The agent calls a gateway that attaches the token, so the model never sees the secret. If a shared API key leaks, all 50,000 accounts are exposed; if one per-user token leaks, one account is exposed, with one scope, for 15 minutes."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="96" height="26" rx="6"/><text class="tl" x="56" y="25" text-anchor="middle">user consents</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M106 21L120 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><rect class="bx acc" x="122" y="8" width="112" height="26" rx="6"/><text class="mono" x="178" y="25" text-anchor="middle">OAuth + PKCE</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M236 21L250 21" marker-end="url(#arr)"/></g><g class="a" style="--d:0.5s"><rect class="bx soft" x="252" y="8" width="100" height="26" rx="6"/><text class="tl" x="302" y="25" text-anchor="middle">token → vault</text></g><g class="a" style="--d:0.7s"><rect class="bx soft" x="8" y="52" width="70" height="26" rx="6"/><text class="tl" x="43" y="69" text-anchor="middle">agent</text></g><g class="a" style="--d:0.8s"><path class="ln " d="M80 65L94 65" marker-end="url(#arr)"/></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="96" y="52" width="156" height="26" rx="6"/><text class="tl" x="174" y="69" text-anchor="middle">gateway adds token</text></g><g class="a" style="--d:1s"><path class="ln " d="M254 65L268 65" marker-end="url(#arr)"/></g><g class="a" style="--d:1.1s"><rect class="bx soft" x="270" y="52" width="82" height="26" rx="6"/><text class="tl" x="311" y="69" text-anchor="middle">API</text></g><g class="a" style="--d:1.2s"><rect class="bx warn" x="8" y="90" width="344" height="24" rx="6"/><text class="tl" x="180" y="106" text-anchor="middle">the model never sees the secret</text></g><text class="tl l a" x="8" y="140" style="--d:1.3s">Accounts exposed if one credential leaks</text><text class="tl a" x="124" y="160" style="text-anchor:end;--d:1.4s">Shared API key</text><rect x="130" y="149" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="149" width="180" height="16" rx="3" class="bar grow warn" style="--d:1.5s"/><text class="mono l a" x="316" y="161" style="--d:1.7s">50,000</text><text class="tl a" x="124" y="188" style="text-anchor:end;--d:1.6s">Per-user token</text><rect x="130" y="177" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="177" width="3" height="16" rx="3" class="bar grow pass" style="--d:1.7s"/><text class="mono l a" x="316" y="189" style="--d:1.9s">1</text><g class="a" style="--d:2s"><rect class="bx soft" x="8" y="204" width="344" height="22" rx="6"/><text class="tl" x="180" y="219" text-anchor="middle">per user · one scope per tool · 15 minutes</text></g></svg>