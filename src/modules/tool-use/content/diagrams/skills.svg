<svg viewBox="0 0 360 236" role="img" aria-label="Thirty skills are listed by name and description, about 3,000 tokens in total. When a customer disputes a 4,800-rupee card charge, the agent loads only the chargeback skill and runs its deadline script; the other skills stay unloaded."><text class="tl l a" x="6" y="14" style="--d:0s">Always loaded: name + description</text><g class="a" style="--d:0.1s"><rect class="bx acc" x="6" y="22" width="110" height="24" rx="6"/><text class="mono" x="61" y="38" text-anchor="middle">kyc-recheck</text></g><g class="a" style="--d:0.15s"><rect class="bx soft" x="120" y="22" width="234" height="24" rx="6"/><text class="tl" x="237" y="38" text-anchor="middle">Re-verify KYC when a PAN or address changes</text></g><g class="a" style="--d:0.2s"><rect class="bx acc" x="6" y="50" width="110" height="24" rx="6"/><text class="mono" x="61" y="66" text-anchor="middle">chargeback</text></g><g class="a" style="--d:0.25s"><rect class="bx soft" x="120" y="50" width="234" height="24" rx="6"/><text class="tl" x="237" y="66" text-anchor="middle">Respond to a card chargeback within the deadline</text></g><g class="a" style="--d:0.30000000000000004s"><rect class="bx acc" x="6" y="78" width="110" height="24" rx="6"/><text class="mono" x="61" y="94" text-anchor="middle">gst-invoice-fix</text></g><g class="a" style="--d:0.35s"><rect class="bx soft" x="120" y="78" width="234" height="24" rx="6"/><text class="tl" x="237" y="94" text-anchor="middle">Correct a GST invoice and reissue it</text></g><text class="mono l a" x="6" y="118" style="--d:0.5s">30 skills ≈ 3,000 tokens up front</text><g class="a" style="--d:0.6s"><path class="ln " d="M60 126L60 140" marker-end="url(#arr)"/></g><g class="a" style="--d:0.7s"><rect class="bx " x="6" y="142" width="348" height="26" rx="6"/><text class="tl" x="180" y="159" text-anchor="middle">task: “customer disputes a ₹4,800 card charge”</text></g><g class="a" style="--d:0.9s"><rect class="bx warn" x="6" y="176" width="170" height="24" rx="6"/><text class="tl" x="91" y="192" text-anchor="middle">loads chargeback/SKILL.md</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="184" y="176" width="170" height="24" rx="6"/><text class="tl" x="269" y="192" text-anchor="middle">runs deadline.py</text></g><g class="a" style="--d:1.3s"><rect class="bx soft" x="6" y="208" width="348" height="22" rx="6"/><text class="tl" x="180" y="223" text-anchor="middle">everything else stays unloaded</text></g></svg>