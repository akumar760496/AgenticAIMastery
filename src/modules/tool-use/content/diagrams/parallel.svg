<svg viewBox="0 0 360 230" role="img" aria-label="Five KYC calls take 3,800 ms in sequence; running the four lookups together and then open_account takes 1,600 ms."><text class="tl l a" x="8" y="18" style="--d:0s">Sequential</text><text class="mono a" style="text-anchor:start;--d:.7s" x="8" y="34" style="--d:0.7s">3,800 ms</text><rect x="92" y="8" width="38.800000000000004" height="16" rx="3" class="bar grow " style="--d:0.1s"/><rect x="132.8" y="8" width="45.6" height="16" rx="3" class="bar grow " style="--d:0.2s"/><rect x="180.4" y="8" width="59.2" height="16" rx="3" class="bar grow " style="--d:0.30000000000000004s"/><rect x="241.60000000000002" y="8" width="79.60000000000001" height="16" rx="3" class="bar grow " style="--d:0.4s"/><rect x="323.20000000000005" y="8" width="25.200000000000003" height="16" rx="3" class="bar grow pass" style="--d:0.5s"/><text class="tl l a" x="8" y="58" style="--d:0.8s">Parallel</text><rect x="92" y="44" width="40.800000000000004" height="14" rx="3" class="bar grow " style="--d:0.9s"/><text class="mono a" x="136.8" y="55" style="--d:1s">PAN 600</text><rect x="92" y="62" width="47.6" height="14" rx="3" class="bar grow " style="--d:0.98s"/><text class="mono a" x="143.6" y="73" style="--d:1.08s">CKYC 700</text><rect x="92" y="80" width="61.2" height="14" rx="3" class="bar grow " style="--d:1.06s"/><text class="mono a" x="157.2" y="91" style="--d:1.16s">Aadhaar 900</text><rect x="92" y="98" width="81.60000000000001" height="14" rx="3" class="bar grow " style="--d:1.1400000000000001s"/><text class="mono a" x="177.60000000000002" y="109" style="--d:1.24s">bureau 1200</text><rect x="173.60000000000002" y="116" width="27.200000000000003" height="14" rx="3" class="bar grow pass" style="--d:1.4s"/><text class="mono a" style="text-anchor:start;--d:1.5s" x="204.8" y="127" style="--d:1.5s">open_account 400</text><g class="a" style="--d:1.6s"><line x1="173.60000000000002" x2="173.60000000000002" y1="96" y2="136" class="ln dash" style="stroke:var(--warn)"/><text class="tag-t warn" x="173.60000000000002" y="148">waits for all four</text></g><g class="a" style="--d:1.8s"><rect class="bx acc" x="8" y="164" width="344" height="26" rx="6"/><text class="mono" x="180" y="181" text-anchor="middle">wall-clock = 1,200 + 400 = 1,600 ms (critical path)</text></g><g class="a" style="--d:2s"><rect class="bx soft" x="8" y="198" width="344" height="24" rx="6"/><text class="mono" x="180" y="214" text-anchor="middle">sum 3,800 ms → max 1,200 ms, then the dependent call</text></g></svg>