<svg viewBox="0 0 360 216" role="img" aria-label="A travel agent reads an airline agent’s card, sends a task that moves from working to input required and back, and receives a PNR artifact."><g class="a dark-t" style="--d:0s"><rect class="bx dark" x="8" y="10" width="110" height="40" rx="7"/><text class="lb" x="63" y="27">Travel agent</text><text class="sb" x="63" y="42">A2A client</text></g><g class="a " style="--d:0.1s"><rect class="bx " x="242" y="10" width="110" height="40" rx="7"/><text class="lb" x="297" y="27">Airline agent</text><text class="sb" x="297" y="42">opaque</text></g><g class="a" style="--d:0.2s"><path class="ln acc" d="M120 22L240 22" marker-end="url(#arrA)"/></g><text class="mono a" text-anchor="middle" x="180" y="17" style="--d:0.25s">GET agent-card.json</text><g class="a" style="--d:0.35s"><path class="ln " d="M240 40L120 40" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx soft" x="116" y="46" width="128" height="18" rx="6"/><text class="mono" x="180" y="59" text-anchor="middle">skill: rebook_flight</text></g><g class="a" style="--d:0.6s"><rect class="bx " x="8" y="88" width="72" height="24" rx="6"/><text class="mono" x="44" y="104" text-anchor="middle">WORKING</text></g><g class="a" style="--d:0.8s"><rect class="bx warn" x="84" y="88" width="114" height="24" rx="6"/><text class="mono" x="141" y="104" text-anchor="middle">INPUT_REQUIRED</text></g><g class="a" style="--d:1s"><rect class="bx " x="202" y="88" width="72" height="24" rx="6"/><text class="mono" x="238" y="104" text-anchor="middle">WORKING</text></g><g class="a" style="--d:1.2000000000000002s"><rect class="bx pass" x="278" y="88" width="86" height="24" rx="6"/><text class="mono" x="321" y="104" text-anchor="middle">COMPLETED</text></g><text class="tl l a" x="8" y="80" style="--d:0.55s">Task states</text><text class="sb a" x="137" y="130" style="--d:0.9s">“aisle or window?”</text><g class="a" style="--d:1.5s"><rect class="bx pass" x="8" y="146" width="344" height="26" rx="6"/><text class="mono" x="180" y="163" text-anchor="middle">artifact: PNR K7XQ2M · 42 s · 2 messages</text></g><g class="a" style="--d:1.7s"><rect class="bx soft" x="8" y="184" width="170" height="24" rx="6"/><text class="mono" x="93" y="200" text-anchor="middle">MCP: agent → tools</text></g><g class="a" style="--d:1.8s"><rect class="bx acc" x="182" y="184" width="170" height="24" rx="6"/><text class="mono" x="267" y="200" text-anchor="middle">A2A: agent → agent</text></g></svg>