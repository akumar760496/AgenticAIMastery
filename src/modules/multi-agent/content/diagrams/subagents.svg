<svg viewBox="0 0 360 280" role="img" aria-label="An orchestrator plans the job and sends six briefs, with the shared sector figures, to six sub-agents. Each sub-agent covers two companies in its own 120k-token context and returns about 1k tokens of cards. The orchestrator ends up holding only 11k tokens: its own plan and briefs plus the cards. One agent takes 127 minutes and 529k tokens but can hold only 38% of the filings in its window; six sub-agents take 27 minutes and 731k tokens and cover all 12 companies."><g class="a" style="--d:0s"><rect class="bx dark" x="8" y="8" width="344" height="24" rx="6"/><text class="tl" x="180" y="24" text-anchor="middle">orchestrator · plan + 6 briefs + sector figures</text></g><g class="a" style="--d:0.2s"><path class="ln " d="M35 33L35 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.35s"><rect class="bx soft" x="8" y="46" width="54" height="22" rx="6"/><text class="mono" x="35" y="61" text-anchor="middle">sub 1</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M93 33L93 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.41s"><rect class="bx soft" x="66" y="46" width="54" height="22" rx="6"/><text class="mono" x="93" y="61" text-anchor="middle">sub 2</text></g><g class="a" style="--d:0.30000000000000004s"><path class="ln " d="M151 33L151 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.47s"><rect class="bx soft" x="124" y="46" width="54" height="22" rx="6"/><text class="mono" x="151" y="61" text-anchor="middle">sub 3</text></g><g class="a" style="--d:0.35000000000000003s"><path class="ln " d="M209 33L209 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.53s"><rect class="bx soft" x="182" y="46" width="54" height="22" rx="6"/><text class="mono" x="209" y="61" text-anchor="middle">sub 4</text></g><g class="a" style="--d:0.4s"><path class="ln " d="M267 33L267 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.59s"><rect class="bx soft" x="240" y="46" width="54" height="22" rx="6"/><text class="mono" x="267" y="61" text-anchor="middle">sub 5</text></g><g class="a" style="--d:0.45s"><path class="ln " d="M325 33L325 45" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6499999999999999s"><rect class="bx soft" x="298" y="46" width="54" height="22" rx="6"/><text class="mono" x="325" y="61" text-anchor="middle">sub 6</text></g><text class="tl m a" x="180" y="84" style="--d:0.8s">each: 2 companies · own 120k context</text><g class="a" style="--d:1s"><rect class="bx pass" x="15" y="92" width="40" height="18" rx="6"/><text class="mono" x="35" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.05s"><rect class="bx pass" x="73" y="92" width="40" height="18" rx="6"/><text class="mono" x="93" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="131" y="92" width="40" height="18" rx="6"/><text class="mono" x="151" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.15s"><rect class="bx pass" x="189" y="92" width="40" height="18" rx="6"/><text class="mono" x="209" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.2s"><rect class="bx pass" x="247" y="92" width="40" height="18" rx="6"/><text class="mono" x="267" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.25s"><rect class="bx pass" x="305" y="92" width="40" height="18" rx="6"/><text class="mono" x="325" y="105" text-anchor="middle">1k</text></g><g class="a" style="--d:1.35s"><rect class="bx acc" x="8" y="118" width="344" height="22" rx="6"/><text class="tl" x="180" y="133" text-anchor="middle">fan-in: 6 × 1k of cards → orchestrator holds 11k</text></g><text class="tl a" x="124" y="167" style="text-anchor:end;--d:1.5s">1 agent, minutes</text><rect x="130" y="156" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="156" width="180" height="14" rx="3" class="bar grow warn" style="--d:1.55s"/><text class="mono l a" x="316" y="167" style="--d:1.7s">127</text><text class="tl a" x="124" y="189" style="text-anchor:end;--d:1.6s">6 sub-agents</text><rect x="130" y="178" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="178" width="38.267716535433074" height="14" rx="3" class="bar grow pass" style="--d:1.65s"/><text class="mono l a" x="316" y="189" style="--d:1.8s">27</text><text class="tl a" x="124" y="215" style="text-anchor:end;--d:1.8s">1 agent, tokens</text><rect x="130" y="204" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="204" width="130.13679890560874" height="14" rx="3" class="bar grow pass" style="--d:1.85s"/><text class="mono l a" x="316" y="215" style="--d:2s">529k</text><text class="tl a" x="124" y="237" style="text-anchor:end;--d:1.9s">6 sub-agents</text><rect x="130" y="226" width="180" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="226" width="180" height="14" rx="3" class="bar grow warn" style="--d:1.95s"/><text class="mono l a" x="316" y="237" style="--d:2.1s">731k</text><g class="a" style="--d:2.3s"><rect class="bx soft" x="8" y="250" width="344" height="22" rx="6"/><text class="tl" x="180" y="265" text-anchor="middle">4.7× faster, 1.4× the tokens, coverage 38% → 100%</text></g></svg>