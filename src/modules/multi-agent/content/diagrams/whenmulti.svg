<svg viewBox="0 0 360 222" role="img" aria-label="One agent reads five filings in 30 minutes with about 40k tokens; five sub-agents take 7 minutes but about 150k tokens."><text class="tl l a" x="8" y="16" style="--d:0s">One agent reads 5 filings in turn</text><rect x="8" y="24" width="50" height="20" rx="3" class="bar grow " style="--d:0.1s"/><rect x="60" y="24" width="50" height="20" rx="3" class="bar grow " style="--d:0.22s"/><rect x="112" y="24" width="50" height="20" rx="3" class="bar grow " style="--d:0.33999999999999997s"/><rect x="164" y="24" width="50" height="20" rx="3" class="bar grow " style="--d:0.45999999999999996s"/><rect x="216" y="24" width="50" height="20" rx="3" class="bar grow " style="--d:0.58s"/><text class="mono a" text-anchor="end" x="352" y="39" style="--d:0.7s">30 min</text><text class="mono a" x="8" y="62" style="--d:0.7s">≈ 40k tokens</text><text class="tl l a" x="8" y="90" style="--d:0.9s">Five sub-agents read them in parallel</text><rect x="8" y="98" width="50" height="9" rx="3" class="bar grow pass" style="--d:1s"/><rect x="8" y="110" width="50" height="9" rx="3" class="bar grow pass" style="--d:1.05s"/><rect x="8" y="122" width="50" height="9" rx="3" class="bar grow pass" style="--d:1.1s"/><rect x="8" y="134" width="50" height="9" rx="3" class="bar grow pass" style="--d:1.15s"/><rect x="8" y="146" width="50" height="9" rx="3" class="bar grow pass" style="--d:1.2s"/><rect x="60" y="98" width="10" height="57" rx="3" class="bar grow warn" style="--d:1.35s"/><text class="sb a" x="96" y="130" style="text-anchor:start;--d:1.4s">+1 min to merge</text><text class="mono a" text-anchor="end" x="352" y="130" style="--d:1.4s">7 min</text><text class="mono a" x="8" y="172" style="--d:1.5s">≈ 150k tokens</text><g class="a" style="--d:1.8s"><rect class="bx soft" x="8" y="184" width="344" height="30" rx="6"/><text class="tl m" x="180" y="203">4.3× faster for 3.75× the tokens</text></g></svg>