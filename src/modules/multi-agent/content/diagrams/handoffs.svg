<svg viewBox="0 0 360 210" role="img" aria-label="Triage transfers the chat to the card agent with a three-field payload instead of fourteen messages, and the card agent resolves it in two turns instead of six."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="10" width="344" height="24" rx="6"/><text class="tl" x="180" y="26" text-anchor="middle">“EMI bounced, card blocked?”</text></g><g class="a " style="--d:0.2s"><rect class="bx " x="8" y="50" width="90" height="44" rx="7"/><text class="lb" x="53" y="69">Triage</text><text class="sb" x="53" y="84">routes only</text></g><g class="a" style="--d:0.5s"><path class="ln acc" d="M100 76L258 76" marker-end="url(#arrA)"/></g><text class="sb a" x="179" y="68" style="--d:.55s">transfer_to_card_agent</text><g class="a " style="--d:0.7s"><rect class="bx acc" x="262" y="50" width="90" height="44" rx="7"/><text class="lb" x="307" y="69">Card agent</text><text class="sb" x="307" y="84">owns the chat</text></g><text class="tl a" x="104" y="132" style="text-anchor:end;--d:.9s">Full history</text><rect x="110" y="122" width="190" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="110" y="122" width="190" height="14" rx="3" class="bar grow warn" style="--d:1s"/><text class="mono l a" x="306" y="133" style="--d:1.2s">14 msgs</text><text class="tl a" x="104" y="156" style="text-anchor:end;--d:1.1s">Typed payload</text><rect x="110" y="146" width="190" height="14" rx="3" class="skel" style="opacity:.45"/><rect x="110" y="146" width="40.714285714285715" height="14" rx="3" class="bar grow " style="--d:1.2s"/><text class="mono l a" x="306" y="157" style="--d:1.4s">3 fields</text><g class="a" style="--d:1.5s"><rect class="bx fail" x="8" y="176" width="170" height="24" rx="6"/><text class="mono" x="93" y="192" text-anchor="middle">user repeats: 6 turns</text></g><g class="a" style="--d:1.7s"><rect class="bx pass" x="182" y="176" width="170" height="24" rx="6"/><text class="mono" x="267" y="192" text-anchor="middle">payload passed: 2 turns</text></g></svg>