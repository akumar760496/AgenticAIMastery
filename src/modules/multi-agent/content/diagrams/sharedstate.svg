<svg viewBox="0 0 360 222" role="img" aria-label="Without a reducer, three writers leave only 5 of 12 findings on the board; with an append reducer all 12 survive, and scoped reads cut each agent from 9k to 3k tokens."><text class="tl l a" x="8" y="16" style="--d:0s">No reducer: each write replaces the last</text><g class="a" style="--d:0.1s"><rect class="bx " x="8" y="24" width="92" height="22" rx="6"/><text class="mono" x="54" y="39" text-anchor="middle">carrier · 4</text></g><path class="ln draw " pathLength="1" d="M100 35 L150 60" style="--d:0.3s"/><g class="a" style="--d:0.2s"><rect class="bx " x="8" y="50" width="92" height="22" rx="6"/><text class="mono" x="54" y="65" text-anchor="middle">warehouse · 3</text></g><path class="ln draw " pathLength="1" d="M100 61 L150 60" style="--d:0.4s"/><g class="a" style="--d:0.30000000000000004s"><rect class="bx " x="8" y="76" width="92" height="22" rx="6"/><text class="mono" x="54" y="91" text-anchor="middle">weather · 5</text></g><path class="ln draw " pathLength="1" d="M100 87 L150 60" style="--d:0.5s"/><g class="a " style="--d:0.6s"><rect class="bx fail" x="152" y="38" width="90" height="44" rx="7"/><text class="lb" x="197" y="57">board</text><text class="sb" x="197" y="72">5 of 12 kept</text></g><text class="tl l a" x="8" y="122" style="--d:0.9s">Append reducer (operator.add)</text><g class="a " style="--d:1s"><rect class="bx pass" x="152" y="130" width="90" height="44" rx="7"/><text class="lb" x="197" y="149">board</text><text class="sb" x="197" y="164">12 of 12 kept</text></g><g class="a" style="--d:1.2s"><text class="tl" x="258" y="48" style="text-anchor:start">read everything</text><text class="mono" x="258" y="64">9k tokens each</text></g><g class="a" style="--d:1.4s"><text class="tl" x="258" y="140" style="text-anchor:start">scoped reads</text><text class="mono" x="258" y="156">3k tokens each</text></g><g class="a" style="--d:1.6s"><rect class="bx soft" x="8" y="190" width="344" height="24" rx="6"/><text class="mono" x="180" y="206" text-anchor="middle">provenance: agent + source on every entry</text></g></svg>