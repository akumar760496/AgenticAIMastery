<svg viewBox="0 0 360 212" role="img" aria-label="The lethal trifecta: an agent with private data, untrusted content and external communication can be steered to leak the data. Remove or gate one leg: scope the data, separate the reader of untrusted content, or require approval for sends. Map each capability to OWASP risks."><g class="a" style="--d:0s"><rect class="bx warn" x="110" y="6" width="140" height="26" rx="6"/><text class="tl" x="180" y="23" text-anchor="middle">private data</text></g><g class="a" style="--d:0.15s"><rect class="bx warn" x="8" y="96" width="150" height="26" rx="6"/><text class="tl" x="83" y="113" text-anchor="middle">untrusted content</text></g><g class="a" style="--d:0.3s"><rect class="bx warn" x="202" y="96" width="150" height="26" rx="6"/><text class="tl" x="277" y="113" text-anchor="middle">external comms</text></g><path class="ln draw fail" pathLength="1" d="M150 32 L90 96 M210 32 L270 96 M158 109 L202 109" style="--d:0.45s"/><text class="tag-t fail a" x="180" y="72" style="--d:.7s">lethal trifecta</text><text class="tl l a" x="8" y="148" style="--d:0.9s">Remove any one leg, or gate it:</text><g class="a" style="--d:1s"><rect class="bx pass" x="8" y="156" width="112" height="24" rx="6"/><text class="mono" x="64" y="172" text-anchor="middle">scope data</text></g><g class="a" style="--d:1.1s"><rect class="bx pass" x="124" y="156" width="112" height="24" rx="6"/><text class="mono" x="180" y="172" text-anchor="middle">separate reader</text></g><g class="a" style="--d:1.2s"><rect class="bx pass" x="240" y="156" width="112" height="24" rx="6"/><text class="mono" x="296" y="172" text-anchor="middle">approve sends</text></g><text class="tl m a" x="180" y="204" style="--d:1.4s">Map each capability to OWASP LLM and ASI risks</text></svg>