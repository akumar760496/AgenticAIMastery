<svg viewBox="0 0 360 236" role="img" aria-label="The agent presents its own workload identity together with the customer’s token to a token-exchange service, and receives a 15-minute token whose subject is the customer and whose actor is the UPI dispute agent. One stolen agent credential reaches all 12 of the bank’s systems with a shared admin account, 4 with its own least-privilege identity, and 3 with just-in-time elevation. With on-behalf-of tokens it can reach about 21 customers instead of 80 lakh."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="8" width="108" height="26" rx="6"/><text class="tl" x="62" y="25" text-anchor="middle">customer token</text></g><g class="a" style="--d:0.1s"><rect class="bx soft" x="8" y="42" width="108" height="26" rx="6"/><text class="tl" x="62" y="59" text-anchor="middle">agent identity</text></g><g class="a" style="--d:0.25s"><path class="ln " d="M118 21L136 30" marker-end="url(#arr)"/></g><g class="a" style="--d:0.3s"><path class="ln " d="M118 55L136 46" marker-end="url(#arr)"/></g><g class="a" style="--d:0.4s"><rect class="bx acc" x="138" y="25" width="84" height="26" rx="6"/><text class="tl" x="180" y="42" text-anchor="middle">exchange</text></g><g class="a" style="--d:0.5s"><path class="ln " d="M224 38L238 38" marker-end="url(#arr)"/></g><g class="a" style="--d:0.6s"><rect class="bx pass" x="240" y="25" width="112" height="26" rx="6"/><text class="tl" x="296" y="42" text-anchor="middle">sub + act</text></g><g class="a" style="--d:0.8s"><rect class="bx soft" x="8" y="78" width="344" height="22" rx="6"/><text class="mono" x="180" y="93" text-anchor="middle">token: sub=customer · act=upi-dispute · 15 min</text></g><text class="tl l a" x="8" y="124" style="--d:1s">Reach of one stolen agent credential</text><text class="tl a" x="124" y="146" style="text-anchor:end;--d:1.1s">Shared admin</text><rect x="130" y="135" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="135" width="180" height="16" rx="3" class="bar grow fail" style="--d:1.2s"/><text class="mono l a" x="316" y="147" style="--d:1.4s">12</text><text class="tl a" x="124" y="170" style="text-anchor:end;--d:1.2s">Own identity</text><rect x="130" y="159" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="159" width="60" height="16" rx="3" class="bar grow warn" style="--d:1.3s"/><text class="mono l a" x="316" y="171" style="--d:1.5s">4</text><text class="tl a" x="124" y="194" style="text-anchor:end;--d:1.3s">+ just-in-time</text><rect x="130" y="183" width="180" height="16" rx="3" class="skel" style="opacity:.45"/><rect x="130" y="183" width="45" height="16" rx="3" class="bar grow pass" style="--d:1.4s"/><text class="mono l a" x="316" y="195" style="--d:1.6s">3</text><g class="a" style="--d:1.8s"><rect class="bx pass" x="8" y="208" width="344" height="22" rx="6"/><text class="tl" x="180" y="223" text-anchor="middle">on-behalf-of: 21 customers reachable, not 80 lakh</text></g></svg>