<svg viewBox="0 0 360 214" role="img" aria-label="The agent’s code runs in a microVM with one CPU and a 60-second limit, on a host with no secrets or mounts, holding only a 15-minute scoped token. All network traffic goes through an egress proxy that allows pypi.org and blocks an attacker’s domain."><g class="a" style="--d:0s"><rect class="bx soft" x="8" y="6" width="220" height="130" rx="8"/><text class="sb" x="18" y="22" style="text-anchor:start">host: no secrets, no mounts</text></g><g class="a" style="--d:.2s"><rect class="bx acc" x="22" y="30" width="192" height="94" rx="8"/><text class="sb" x="32" y="46" style="text-anchor:start">microVM · 1 CPU · 60 s</text></g><g class="a" style="--d:0.35s"><rect class="bx soft" x="36" y="56" width="164" height="24" rx="6"/><text class="mono" x="118" y="72" text-anchor="middle">agent’s code</text></g><g class="a" style="--d:0.45s"><rect class="bx pass" x="36" y="88" width="164" height="24" rx="6"/><text class="mono" x="118" y="104" text-anchor="middle">scoped token, 15 min</text></g><g class="a " style="--d:0.6s"><rect class="bx warn" x="248" y="40" width="104" height="50" rx="7"/><text class="lb" x="300" y="62">Egress proxy</text><text class="sb" x="300" y="77">allowlist</text></g><g class="a" style="--d:0.7s"><path class="ln " d="M216 65L246 65" marker-end="url(#arr)"/></g><g class="a" style="--d:0.9s"><rect class="bx pass" x="248" y="104" width="104" height="22" rx="6"/><text class="tl" x="300" y="119" text-anchor="middle">pypi.org ✓</text></g><g class="a" style="--d:1s"><rect class="bx fail" x="248" y="130" width="104" height="22" rx="6"/><text class="tl" x="300" y="145" text-anchor="middle">attacker ✗</text></g><text class="tl m a" x="180" y="172" style="--d:1.2s">Untrusted code runs as if it were hostile</text><g class="a" style="--d:1.3s"><rect class="bx soft" x="8" y="182" width="344" height="24" rx="6"/><text class="tl" x="180" y="198" text-anchor="middle">no host env vars · no network except via the proxy</text></g></svg>