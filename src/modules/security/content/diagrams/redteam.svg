.6000000000000005" height="11" rx="3" class="bar grow pass" style="--d:1.1s"/><text class="mono l a" x="314" y="107" style="--d:0.5s">18%</text><text class="mono l a" x="314" y="121" style="--d:1.2s">4%</text><text class="tl a" x="112" y="143" style="text-anchor:end;--d:0.4s">prompt leak</text><rect x="118" y="133" width="190" height="11" rx="3" class="skel" style="opacity:.45"/><rect x="118" y="133" width="76" height="11" rx="3" class="bar grow fail" style="--d:0.5s"/><rect x="118" y="147" width="190" height="11" rx="3" class="skel" style="opacity:.45"/><rect x="118" y="147" width="9.5" height="11" rx="3" class="bar grow pass" style="--d:1.2000000000000002s"/><text class="mono l a" x="314" y="143" style="--d:0.6000000000000001s">40%</text><text class="mono l a" x="314" y="157" style="--d:1.3s">5%</text><g class="a" style="--d:1.4s"><rect class="bx fail" x="8" y="174" width="168" height="24" rx="6"/><text class="tl" x="92" y="190" text-anchor="middle">before fixes</text></g><g class="a" style="--d:1.5s"><rect class="bx pass" x="184" y="174" width="168" height="24" rx="6"/><text class="tl" x="268" y="190" text-anchor="middle">after fixes</text></g><g class="a" style="--d:1.7s"><rect class="bx acc" x="8" y="204" width="344" height="24" rx="6"/><text class="tl" x="180" y="220" text-anchor="middle">every found attack joins the CI regression suite</text></g></svg>