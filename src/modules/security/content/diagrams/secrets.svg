<svg viewBox="0 0 360 188" role="img" aria-label="A secret in the prompt can leak through any answer; in the tools’ environment it can leak through code the agent runs. In the broker pattern the agent sends a tool call to a broker, which fetches the key from a vault and calls the API, so the agent only sees the result. Short-lived keys and scanning of outputs and logs limit any leak."><text class="tl l a" x="6" y="14" style="--d:0s">Where the key lives decides what can leak</text><g class="a" style="--d:0.1s"><rect class="bx fail" x="6" y="22" width="110" height="24" rx="6"/><text class="mono" x="61" y="38" text-anchor="middle">in the prompt</text></g><g class="a" style="--d:0.2s"><rect class="bx warn" x="124" y="22" width="110" height="24" rx="6"/><text class="mono" x="179" y="38" text-anchor="middle">env of tools</text></g><g class="a" style="--d:0.3s"><rect class="bx pass" x="242" y="22" width="112" height="24" rx="6"/><text class="mono" x="298" y="38" text-anchor="middle">broker holds it</text></g><text class="tl l a" x="6" y="62" style="--d:0.45s">Broker pattern: the agent never sees the secret</text><g class="a" style="--d:0.55s"><rect class="bx acc" x="6" y="70" width="80" height="24" rx="6"/><text class="mono" x="46" y="86" text-anchor="middle">agent</text></g><g class="a" style="--d:0.6s"><path class="ln " d="M88 82L100 82" marker-end="url(#arr)"/></g><g class="a" style="--d:0.65s"><rect class="bx soft" x="102" y="70" width="84" height="24" rx="6"/><text class="mono" x="144" y="86" text-anchor="middle">broker</text></g><g class="a" style="--d:0.7s"><path class="ln " d="M188 82L200 82" marker-end="url(#arr)"/></g><g class="a" style="--d:0.75s"><rect class="bx soft" x="202" y="70" width="70" height="24" rx="6"/><text class="mono" x="237" y="86" text-anchor="middle">vault</text></g><g class="a" style="--d:0.8s"><path class="ln " d="M274 82L284 82" marker-end="url(#arr)"/></g><g class="a" style="--d:0.85s"><rect class="bx soft" x="286" y="70" width="68" height="24" rx="6"/><text class="mono" x="320" y="86" text-anchor="middle">API</text></g><text class="mono l a" x="6" y="118" style="--d:0.95s">tool call in, result out; the key stays in the broker</text><g class="a" style="--d:1.05s"><rect class="bx pass" x="6" y="128" width="168" height="22" rx="6"/><text class="mono" x="90" y="143" text-anchor="middle">short-lived: 1 hour</text></g><g class="a" style="--d:1.15s"><rect class="bx pass" x="186" y="128" width="168" height="22" rx="6"/><text class="mono" x="270" y="143" text-anchor="middle">scan outputs + logs</text></g><g class="a" style="--d:1.3s"><rect class="bx soft" x="6" y="158" width="348" height="24" rx="6"/><text class="tl" x="180" y="174" text-anchor="middle">a leaked 1-hour key is useless by lunch</text></g></svg>